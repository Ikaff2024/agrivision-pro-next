name: AgriVision Pro — CI/CD

on:
  push:
    branches: [main, develop, codex/cacaoguard-fusion]
  pull_request:
    branches: [main, codex/cacaoguard-fusion]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
  IMAGE_NAME: agrivision-api

jobs:

  # ── Job 1 : Lint & Tests ─────────────────────────────────────────────────────
  test:
    name: Lint & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v6

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Installer les dépendances
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov httpx pydantic[email]

      - name: Lancer les tests
        env:
          SECRET_KEY: test-secret-key-for-ci-only-not-production
          DATABASE_URL: ""
        run: |
          pytest tests/ -v --tb=short --cov=app --cov-report=term-missing

      - name: Rapport de couverture
        if: success()
        run: |
          echo "✅ Tests passés avec succès"


  # ── Job 1b : Tests E2E (Playwright) + vidéos ─────────────────────────────────
  # Backend éphémère (SQLite, AUCUNE clé externe : le provider satellite a un
  # fallback déterministe) + frontend servi en local → parcours navigateur réel,
  # 100 % reproductible, sans polluer le staging. Artefact : rapport HTML + vidéos.
  e2e:
    name: Tests E2E (Playwright)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout du code
        uses: actions/checkout@v6

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Installer les dépendances backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pydantic[email]"

      - name: Démarrer le backend (SQLite éphémère, sans clés)
        env:
          SECRET_KEY: test-secret-key-for-ci-only-not-production
          DATABASE_URL: ""
        run: |
          nohup uvicorn main:app --host 127.0.0.1 --port 8010 > backend.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8010/openapi.json > /dev/null; then
              echo "✅ Backend prêt"; exit 0
            fi
            sleep 1
          done
          echo "❌ Backend non démarré — logs :"; cat backend.log; exit 1

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Installer Playwright + Chromium
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Lancer les tests E2E
        working-directory: e2e
        env:
          AVP_API_URL: http://127.0.0.1:8010
        run: npm test

      - name: Publier le rapport + vidéos
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14


  # ── Job 2 : Build Docker ─────────────────────────────────────────────────────
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout du code
        uses: actions/checkout@v6

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extraire les métadonnées Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build & Push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


  # ── Job 3 : Déploiement (optionnel — Railway / Render) ───────────────────────
  deploy:
    name: Déploiement production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Checkout du code
        uses: actions/checkout@v6

      # ── Déploiement Railway ──────────────────────────────────────────────────
      # Décommenter et ajouter RAILWAY_TOKEN dans les secrets GitHub
      #
      # - name: Deploy sur Railway
      #   uses: bervProject/railway-deploy@main
      #   with:
      #     railway_token: ${{ secrets.RAILWAY_TOKEN }}
      #     service: agrivision-api

      # ── Déploiement Render ───────────────────────────────────────────────────
      # Décommenter et ajouter RENDER_DEPLOY_HOOK dans les secrets GitHub
      #
      # - name: Deploy sur Render
      #   run: |
      #     curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}

      - name: Déploiement configuré
        run: |
          echo "✅ Build validé — décommenter le bloc de déploiement cible (Railway / Render / VPS)"
