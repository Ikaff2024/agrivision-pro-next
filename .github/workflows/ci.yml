name: AgriVision Pro — CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  IMAGE_NAME: agrivision-api

jobs:

  # ── Job 1 : Lint & Tests ─────────────────────────────────────────────────────
  test:
    name: Lint & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Installer les dépendances
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov httpx pydantic[email]

      - name: Lancer les tests
        env:
          SECRET_KEY: test-secret-key-for-ci-only-not-production
          DATABASE_URL: ""
        run: |
          pytest tests/ -v --tb=short --cov=app --cov-report=term-missing

      - name: Rapport de couverture
        if: success()
        run: |
          echo "✅ Tests passés avec succès"


  # ── Job 2 : Build Docker ─────────────────────────────────────────────────────
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extraire les métadonnées Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build & Push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


  # ── Job 3 : Déploiement (optionnel — Railway / Render) ───────────────────────
  deploy:
    name: Déploiement production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      # ── Déploiement Railway ──────────────────────────────────────────────────
      # Décommenter et ajouter RAILWAY_TOKEN dans les secrets GitHub
      #
      # - name: Deploy sur Railway
      #   uses: bervProject/railway-deploy@main
      #   with:
      #     railway_token: ${{ secrets.RAILWAY_TOKEN }}
      #     service: agrivision-api

      # ── Déploiement Render ───────────────────────────────────────────────────
      # Décommenter et ajouter RENDER_DEPLOY_HOOK dans les secrets GitHub
      #
      # - name: Deploy sur Render
      #   run: |
      #     curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}

      - name: Déploiement configuré
        run: |
          echo "✅ Build validé — décommenter le bloc de déploiement cible (Railway / Render / VPS)"
