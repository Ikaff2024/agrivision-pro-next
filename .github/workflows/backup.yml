name: Sauvegarde DB (hors-site)

# Sauvegarde chiffrée de la base PostgreSQL, stockée hors Railway (artefact GitHub).
# Mise en place : voir docs/BACKUP_DR.md (secrets BACKUP_DATABASE_URL + BACKUP_PASSPHRASE).
# Note : les workflows planifiés ne s'exécutent que sur la branche par défaut du repo.

on:
  schedule:
    - cron: '0 */6 * * *'   # toutes les 6 heures (UTC)
  workflow_dispatch: {}      # déclenchement manuel (onglet Actions → Run workflow)

permissions:
  contents: read

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Dump PostgreSQL chiffré (AES-256)
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ] || [ -z "${BACKUP_PASSPHRASE:-}" ]; then
            echo "::warning::Secrets BACKUP_DATABASE_URL / BACKUP_PASSPHRASE absents — sauvegarde ignorée (voir docs/BACKUP_DR.md)."
            exit 0
          fi
          STAMP="$(date -u +%Y%m%d-%H%M%S)"
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          # pg_dump via l'image officielle postgres:16 (client compatible serveur 15/16),
          # format custom (-Fc) → restaurable sélectivement avec pg_restore.
          docker run --rm -e PGCONNECT_TIMEOUT=30 postgres:16 \
            pg_dump --no-owner --no-privileges -Fc "$DATABASE_URL" \
            | openssl enc -aes-256-cbc -pbkdf2 -salt -out "avp-${STAMP}.dump.enc" -pass env:BACKUP_PASSPHRASE
          SIZE="$(stat -c%s "avp-${STAMP}.dump.enc")"
          echo "Sauvegarde chiffrée : avp-${STAMP}.dump.enc (${SIZE} octets)"
          if [ "$SIZE" -lt 1000 ]; then
            echo "::error::Sauvegarde anormalement petite (<1 Ko) — échec probable du dump."
            exit 1
          fi

      - name: Upload de l'artefact chiffré
        if: env.STAMP != ''
        uses: actions/upload-artifact@v4
        with:
          name: avp-db-backup-${{ env.STAMP }}
          path: '*.dump.enc'
          retention-days: 30
          if-no-files-found: error
