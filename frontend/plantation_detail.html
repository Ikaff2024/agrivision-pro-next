<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgriVision Pro — Détail plantation</title>
<script src="auth.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
.back-link{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;
  color:var(--muted);margin-bottom:20px;cursor:pointer;transition:.15s}
.back-link:hover{color:var(--primary)}

.detail-grid{display:grid;grid-template-columns:340px 1fr;gap:24px;align-items:start}
@media(max-width:1050px){.detail-grid{grid-template-columns:1fr}}

/* Info card */
.info-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  overflow:hidden;box-shadow:var(--sh)}
.info-card-hero{background:var(--primary);padding:28px 24px;position:relative;overflow:hidden}
.info-card-hero::after{content:'🌱';position:absolute;right:20px;bottom:10px;
  font-size:72px;opacity:.08;line-height:1}
.info-name{font-family:'Fraunces',serif;font-size:22px;font-weight:700;color:#fff;
  letter-spacing:-.3px;margin-bottom:4px}
.info-owner{font-size:13px;color:rgba(255,255,255,.6)}
.info-score-row{display:flex;align-items:center;gap:14px;margin-top:16px}
.info-score-circle{width:56px;height:56px;border-radius:50%;border:3px solid rgba(255,255,255,.25);
  display:flex;align-items:center;justify-content:center;flex-direction:column;flex-shrink:0}
.info-score-num{font-family:'Fraunces',serif;font-size:20px;font-weight:700;color:#fff;line-height:1}
.info-score-lbl{font-size:9px;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:.05em}
.info-risk-lbl{font-size:14px;font-weight:600;color:rgba(255,255,255,.85)}
.info-risk-sub{font-size:12px;color:rgba(255,255,255,.5);margin-top:2px}

.info-meta{padding:18px 20px;display:flex;flex-direction:column;gap:0}
.meta-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--border-l)}
.meta-row:last-child{border-bottom:none}
.meta-icon{width:32px;height:32px;border-radius:8px;background:var(--bg);
  display:flex;align-items:center;justify-content:center;flex-shrink:0}
.meta-icon .ms{font-size:17px;color:var(--muted)}
.meta-label{font-size:11.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;margin-bottom:1px}
.meta-value{font-size:13.5px;font-weight:500;color:var(--text)}

.action-row{padding:16px 20px;border-top:1px solid var(--border);display:flex;gap:8px;flex-wrap:wrap}

/* Right column */
.chart-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  padding:22px;box-shadow:var(--sh);margin-bottom:20px}
.chart-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.chart-title{font-family:'Fraunces',serif;font-size:17px;font-weight:700}
.chart-wrap{position:relative;height:220px}

.history-table .table-wrap{box-shadow:none;border-radius:var(--r)}
.diag-module-pills{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.dpill{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--bg);
  border:1px solid var(--border);color:var(--muted)}

.empty-state{text-align:center;padding:56px 20px;color:var(--muted)}
.empty-icon{font-size:48px;opacity:.18;margin-bottom:12px}

.rec-panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  padding:22px;box-shadow:var(--sh);margin-bottom:20px}
.rec-panel-title{font-family:'Fraunces',serif;font-size:17px;font-weight:700;margin-bottom:16px;
  display:flex;align-items:center;gap:8px}
.rec-list{display:flex;flex-direction:column;gap:10px}
.rec-item{border-radius:10px;padding:14px 16px;border:1px solid transparent;display:flex;gap:12px;align-items:flex-start}
.rec-item.high{background:#fff5f5;border-color:#fecaca}
.rec-item.medium{background:#fffbeb;border-color:#fde68a}
.rec-item.low{background:#f0fdf4;border-color:#bbf7d0}
.rec-icon{font-size:20px;flex-shrink:0;margin-top:1px}
.rec-body{flex:1;min-width:0}
.rec-header{display:flex;align-items:center;gap:8px;margin-bottom:4px;flex-wrap:wrap}
.rec-title{font-size:13.5px;font-weight:600;color:var(--text)}
.rec-priority{font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;
  text-transform:uppercase;letter-spacing:.06em}
.rec-priority.high{background:#fee2e2;color:#991b1b}
.rec-priority.medium{background:#fef3c7;color:#92400e}
.rec-priority.low{background:#dcfce7;color:#166534}
.rec-category{font-size:11px;color:var(--muted)}
.rec-action{font-size:13px;color:var(--muted);line-height:1.6;margin-top:4px}

/* Agroforesterie mini-card */
.agro-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  padding:20px;box-shadow:var(--sh);margin-bottom:20px;
  border-left:4px solid #2D8C5A}
.agro-card-title{font-family:'Fraunces',serif;font-size:17px;font-weight:700;
  margin-bottom:16px;display:flex;align-items:center;justify-content:space-between}
.agro-metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.agro-metric{text-align:center;background:var(--bg);border-radius:8px;padding:12px 8px}
.agro-metric-val{font-family:'Fraunces',serif;font-size:22px;font-weight:700;line-height:1}
.agro-metric-lbl{font-size:10.5px;color:var(--muted);text-transform:uppercase;
  letter-spacing:.05em;margin-top:4px}
.agro-species-list{display:flex;flex-wrap:wrap;gap:6px}
.agro-pill{font-size:12px;padding:3px 10px;border-radius:99px;background:var(--low-bg);
  border:1px solid var(--low-b);color:var(--low);font-weight:500}
.agro-empty{font-size:13px;color:var(--faint);font-style:italic}

.ai-card{background:linear-gradient(135deg,#0f2d1f 0%,#1a4231 100%);border-radius:var(--r);padding:20px 22px;margin-bottom:16px;color:#fff}
.ai-card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.ai-card-title{font-family:'Fraunces',serif;font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}
.ai-badge{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:rgba(255,255,255,.15);padding:2px 8px;border-radius:99px}
.ai-btn{display:flex;align-items:center;gap:6px;padding:8px 16px;background:#52b788;color:#fff;border:none;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s}
.ai-btn:hover{background:#40916c}.ai-btn:disabled{opacity:.5;cursor:not-allowed}
.ai-spinner{display:none;width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ai-result{display:none;margin-top:14px}
.ai-resume{font-size:13.5px;line-height:1.65;color:rgba(255,255,255,.88);margin-bottom:14px;padding:12px 14px;background:rgba(255,255,255,.08);border-radius:6px}
.ai-section-title{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.5);margin:12px 0 6px}
.ai-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.ai-tag{font-size:12px;padding:3px 10px;border-radius:99px;background:rgba(255,255,255,.1);color:rgba(255,255,255,.85)}
.ai-tag.risk{background:rgba(255,100,80,.18);color:#ff9980}
.ai-actions{display:flex;flex-direction:column;gap:8px}
.ai-action{background:rgba(255,255,255,.07);border-radius:6px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start}
.ai-action-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:4px}
.ai-action-dot.urgent{background:#ff6b6b}.ai-action-dot.important{background:#ffd166}.ai-action-dot.conseil{background:#52b788}
.ai-action-body{flex:1}
.ai-action-title{font-size:13px;font-weight:600;color:#fff;margin-bottom:2px}
.ai-action-detail{font-size:12px;color:rgba(255,255,255,.65);line-height:1.5}
.ai-action-impact{font-size:11px;color:#52b788;margin-top:4px;font-weight:500}
.ai-eudr{font-size:12.5px;color:rgba(255,255,255,.75);padding:10px 12px;background:rgba(255,255,255,.06);border-radius:6px;margin-top:10px;border-left:3px solid #52b788}
.ai-score-row{display:flex;align-items:center;gap:10px;margin-top:12px}
.ai-score-label{font-size:12px;color:rgba(255,255,255,.55)}
.ai-score-val{font-family:'Fraunces',serif;font-size:22px;font-weight:700;color:#52b788}
.ai-error{color:rgba(255,150,120,.9);font-size:13px;padding:10px;background:rgba(255,100,80,.1);border-radius:6px;margin-top:8px}

/* Potentiel de production */
.prod-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  padding:18px 20px;margin-bottom:16px}
.prod-card-title{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;
  letter-spacing:.06em;margin-bottom:14px;display:flex;align-items:center;gap:6px}
.prod-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.prod-metric{text-align:center;padding:12px 8px;background:var(--bg);border-radius:8px;
  border:1px solid var(--border-l)}
.prod-val{font-family:'Fraunces',serif;font-size:20px;font-weight:700;color:var(--primary);
  line-height:1.1;margin-bottom:3px}
.prod-lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.prod-alert{margin-top:12px;padding:10px 12px;border-radius:8px;font-size:12.5px;
  display:flex;align-items:flex-start;gap:8px;line-height:1.5}
.prod-alert.warning{background:#fff8e6;border:1px solid #f0c97a;color:#7a4e00}
.prod-alert.success{background:#f0faf5;border:1px solid #b7e4c7;color:#1a6b3a}
.prod-alert.info{background:#eef4ff;border:1px solid #c3d5f5;color:#1e3a5f}
.plant-edit{display:flex;align-items:center;gap:8px;margin-top:10px}
.plant-input{width:120px;padding:6px 10px;border:1px solid var(--border);border-radius:6px;
  font-size:13px;text-align:center}
.plant-save{padding:6px 14px;background:var(--accent);color:#fff;border:none;border-radius:6px;
  font-size:12.5px;font-weight:600;cursor:pointer}
.plant-save:hover{background:#40916c}
</style>
</head>
<body>
<div class="avp-layout">
  <nav id="sidebar"></nav>
  <div class="avp-main">

    <div class="avp-header">
      <div>
        <div class="page-title" id="page-title">Chargement…</div>
        <div class="page-sub" id="page-sub"></div>
      </div>
      <button class="btn btn-primary" id="diag-btn" onclick="goDiag()" style="display:none">
        <span class="material-symbols-outlined" style="font-size:18px">biotech</span>
        Nouveau diagnostic
      </button>
    </div>

    <div class="avp-content">
      <div class="back-link" onclick="history.back()">
        <span class="material-symbols-outlined" style="font-size:18px">arrow_back</span>
        Retour aux plantations
      </div>

      <div class="detail-grid" id="detail-grid">
        <div style="text-align:center;padding:60px;color:var(--muted)" id="loading">Chargement…</div>
      </div>
    </div>
  </div>
</div>

<script>
initApp('plantations');

const pid = new URLSearchParams(location.search).get('id');
if (!pid) location.href = 'plantations.html';

let chartInstance = null;

async function load() {
  try {
    const [r1, r2, r3] = await Promise.all([
      authFetch(`/plantations/${pid}`),
      authFetch(`/plantations/${pid}/history?limit=20`),
      authFetch(`/plantations/${pid}/agroforestry`)
    ]);
    if (!r1?.ok) { location.href = 'plantations.html'; return; }
    const { plantation, diagnostics } = await r1.json();
    const history = r2?.ok ? await r2.json() : [];
    const agroData = r3?.ok ? await r3.json() : null;

    document.getElementById('page-title').textContent = plantation.name;
    document.getElementById('page-sub').textContent = `${plantation.region||''} · ${plantation.country}`;
    document.getElementById('diag-btn').style.display = '';

    const latestDiag = diagnostics.sort((a,b) => new Date(b.created_at)-new Date(a.created_at))[0];
    // Charger les recommandations du dernier diagnostic
    let recommendations = [];
    if (latestDiag) {
      try {
        const rr = await authFetch('/diagnostics/' + latestDiag.id + '/recommendations');
        if (rr?.ok) recommendations = await rr.json();
      } catch(e) {}
    }
    const score = latestDiag?.global_score;
    const risk  = latestDiag?.global_risk_level;
    const colors = { LOW:'#1a6b3a', MEDIUM:'#9a6200', HIGH:'#922b21' };
    const heroColor = colors[risk] || '#1a4231';

    document.getElementById('detail-grid').innerHTML = `
      <!-- Info card -->
      <div class="info-card">
        <div class="info-card-hero" style="background:${heroColor}">
          <div class="info-name">${esc(plantation.name)}</div>
          <div class="info-owner">${esc(plantation.owner_name)}</div>
          ${score != null ? `
          <div class="info-score-row">
            <div class="info-score-circle">
              <div class="info-score-num">${Math.round(score)}</div>
              <div class="info-score-lbl">score</div>
            </div>
            <div>
              <div class="info-risk-lbl">${riskLabels[risk]||risk}</div>
              <div class="info-risk-sub">Dernier diagnostic</div>
            </div>
          </div>` : '<div style="color:rgba(255,255,255,.5);font-size:13px;margin-top:12px">Aucun diagnostic réalisé</div>'}
        </div>
        <div class="info-meta">
          <div class="meta-row">
            <div class="meta-icon"><span class="material-symbols-outlined ms">location_on</span></div>
            <div>
              <div class="meta-label">Localisation</div>
              <div class="meta-value">${esc(plantation.region||'—')}, ${esc(plantation.country)}</div>
            </div>
          </div>
          <div class="meta-row">
            <div class="meta-icon"><span class="material-symbols-outlined ms">landscape</span></div>
            <div>
              <div class="meta-label">Superficie</div>
              <div class="meta-value">${plantation.hectares != null ? plantation.hectares + ' hectares' : '—'}</div>
            </div>
          </div>
          <div class="meta-row">
            <div class="meta-icon"><span class="material-symbols-outlined ms">grass</span></div>
            <div>
              <div class="meta-label">Plants de cacao</div>
              <div class="meta-value" id="plant-count-display">${plantation.plant_count != null ? plantation.plant_count.toLocaleString() + ' plants' : '—'}</div>
              ${currentUserRole === 'admin' || currentUserRole === 'agronomist' ? \`
              <div class="plant-edit">
                <input type="number" class="plant-input" id="plant-count-input"
                  placeholder="Nb plants" min="0"
                  value="\${plantation.plant_count || ''}">
                <button class="plant-save" onclick="savePlantCount()">Enregistrer</button>
              </div>\` : ''}
            </div>
          </div>
          <div class="meta-row">
            <div class="meta-icon"><span class="material-symbols-outlined ms">my_location</span></div>
            <div>
              <div class="meta-label">Coordonnées GPS</div>
              <div class="meta-value">${plantation.latitude != null ? `${plantation.latitude.toFixed(4)}, ${plantation.longitude.toFixed(4)}` : '—'}</div>
            </div>
          </div>
          <div class="meta-row">
            <div class="meta-icon"><span class="material-symbols-outlined ms">history</span></div>
            <div>
              <div class="meta-label">Diagnostics réalisés</div>
              <div class="meta-value">${diagnostics.length}</div>
            </div>
          </div>
          <div class="meta-row">
            <div class="meta-icon"><span class="material-symbols-outlined ms">calendar_today</span></div>
            <div>
              <div class="meta-label">Dernière analyse</div>
              <div class="meta-value">${latestDiag ? fmtDate(latestDiag.created_at) : '—'}</div>
            </div>
          </div>
        </div>
        <div class="action-row">
          <button class="btn btn-primary btn-sm" onclick="goDiag()">
            <span class="material-symbols-outlined" style="font-size:15px">biotech</span>
            Diagnostic
          </button>
          <button class="btn btn-outline btn-sm" onclick="goSat()">
            <span class="material-symbols-outlined" style="font-size:15px">satellite_alt</span>
            NDVI Satellite
          </button>
          <button class="btn btn-outline btn-sm" onclick="goAgro()">
            <span class="material-symbols-outlined" style="font-size:15px">forest</span>
            Agroforesterie
          </button>
        </div>
      </div>

      <!-- Right column -->
      <div>
        ${agroData && agroData.metrics && agroData.metrics.species_count > 0 ? `
        <div class="agro-card">
          <div class="agro-card-title">
            <span>🌳 Agroforesterie</span>
            <a href="agroforestry.html?id=${pid}" style="font-size:12.5px;color:var(--accent);font-weight:600">
              Gérer l'inventaire →
            </a>
          </div>
          <div class="agro-metrics">
            <div class="agro-metric">
              <div class="agro-metric-val" style="color:${agroData.metrics.conformity_score>=65?'#1a6b3a':agroData.metrics.conformity_score>=35?'#9a6200':'#922b21'}">
                ${agroData.metrics.conformity_score}
              </div>
              <div class="agro-metric-lbl">Conformité</div>
            </div>
            <div class="agro-metric">
              <div class="agro-metric-val" style="color:#1a6b3a">${agroData.metrics.shade_score}</div>
              <div class="agro-metric-lbl">Ombrage</div>
            </div>
            <div class="agro-metric">
              <div class="agro-metric-val">${agroData.metrics.carbon_stock_tco2_ha}</div>
              <div class="agro-metric-lbl">tCO₂/ha</div>
            </div>
            <div class="agro-metric">
              <div class="agro-metric-val">${agroData.metrics.total_trees_per_ha}</div>
              <div class="agro-metric-lbl">Arbres/ha</div>
            </div>
          </div>
          <div class="agro-species-list">
            ${agroData.records.map(r => '<span class="agro-pill">🌿 ' + esc(r.species_name) + ' (' + r.count_per_hectare + '/ha)</span>').join('')}
          </div>
        </div>` : ''}
        ${recommendations.length > 0 ? `
        <div class="rec-panel">
          <div class="rec-panel-title">
            <span>💡</span> Recommandations
          </div>
          <div class="rec-list">
            ${recommendations.map(r => `
            <div class="rec-item ${r.priority}">
              <div class="rec-icon">${r.icon}</div>
              <div class="rec-body">
                <div class="rec-header">
                  <span class="rec-title">${esc(r.title)}</span>
                  <span class="rec-priority ${r.priority}">${r.priority === 'high' ? 'Urgent' : r.priority === 'medium' ? 'Important' : 'Conseil'}</span>
                  <span class="rec-category">${esc(r.category)}</span>
                </div>
                <div class="rec-action">${esc(r.action)}</div>
              </div>
            </div>`).join('')}
          </div>
        </div>` : ''}
        ${history.length >= 1 ? `
        \${plantation.plant_count != null && plantation.plant_count > 0 ? \`
        <div class="prod-card">
          <div class="prod-card-title">🌱 Potentiel de production</div>
          <div class="prod-grid">
            <div class="prod-metric">
              <div class="prod-val">\${plantation.plant_count.toLocaleString()}</div>
              <div class="prod-lbl">Plants</div>
            </div>
            <div class="prod-metric">
              <div class="prod-val">\${plantation.hectares ? Math.round(plantation.plant_count / plantation.hectares).toLocaleString() : '—'}</div>
              <div class="prod-lbl">Pieds/ha</div>
            </div>
            <div class="prod-metric">
              <div class="prod-val">\${plantation.plant_count ? Math.round(plantation.plant_count * 0.5 / 1000) + ' t' : '—'}</div>
              <div class="prod-lbl">Potentiel/an</div>
            </div>
          </div>
          \${plantation.hectares ? (() => {
            const density = Math.round(plantation.plant_count / plantation.hectares);
            if (density < 800) return \`<div class="prod-alert warning">⚠️ Densité insuffisante (\${density} pieds/ha). Minimum recommandé : 800 pieds/ha (norme CCC). Replantation conseillée.</div>\`;
            if (density > 1200) return \`<div class="prod-alert info">ℹ️ Densité élevée (\${density} pieds/ha). Éclaircissage possible pour améliorer qualité des cabosses.</div>\`;
            return \`<div class="prod-alert success">✅ Densité optimale (\${density} pieds/ha). Conforme aux normes CCC (800-1 111 pieds/ha).</div>\`;
          })() : ''}
        </div>\` : ''}
        <div class="chart-card">
          <div class="chart-header">
            <span class="chart-title">Évolution du score</span>
            <span class="badge badge-${risk?.toLowerCase()==='low'?'low':risk?.toLowerCase()==='high'?'high':'medium'}">${history.length} mesures</span>
          </div>
          <div class="chart-wrap"><canvas id="history-chart"></canvas></div>
        </div>` : ''}

        <div class="chart-card history-table">
          <div class="chart-header">
            <span class="chart-title">Historique des diagnostics</span>
          </div>
          ${diagnostics.length === 0 ? `
          <div class="empty-state">
            <div class="empty-icon">🔬</div>
            <div style="font-size:14px;font-weight:600;margin-bottom:6px">Aucun diagnostic</div>
            <div style="font-size:13px">Lancez le premier diagnostic pour cette plantation.</div>
          </div>` : `
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Date</th>
                  <th>Score</th>
                  <th>Risque</th>
                  <th>Humidité</th>
                  <th>Pluie</th>
                  <th>Temp.</th>
                </tr>
              </thead>
              <tbody>
                ${diagnostics.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at)).map(d => `
                <tr>
                  <td style="color:var(--muted)">${fmtDate(d.created_at)}</td>
                  <td>
                    <div style="display:flex;align-items:center;gap:8px">
                      <div style="width:50px;height:6px;background:var(--border-l);border-radius:99px;overflow:hidden">
                        <div style="width:${d.global_score}%;height:100%;background:${scoreColor(d.global_score)};border-radius:99px"></div>
                      </div>
                      <span style="font-family:'Fraunces',serif;font-weight:700;font-size:14px">${Math.round(d.global_score)}</span>
                    </div>
                  </td>
                  <td>${riskBadge(d.global_risk_level)}</td>
                  <td style="color:var(--muted)">${d.humidity_pct != null ? d.humidity_pct + '%' : '—'}</td>
                  <td style="color:var(--muted)">${d.rainfall_mm_month != null ? d.rainfall_mm_month + ' mm' : '—'}</td>
                  <td style="color:var(--muted)">${d.avg_temp_c != null ? d.avg_temp_c + '°C' : '—'}</td>
                </tr>`).join('')}
              </tbody>
            </table>
          </div>`}
        <div class="ai-card">
          <div class="ai-card-header">
            <div class="ai-card-title">&#129302; Conseil Agronome IA <span class="ai-badge">Pro</span></div>
            <button class="ai-btn" id="ai-btn" onclick="loadAIAdvice()">
              <span id="ai-spinner" class="ai-spinner"></span>
              <span id="ai-btn-txt">Analyser cette plantation</span>
            </button>
          </div>
          <div style="font-size:12.5px;color:rgba(255,255,255,.5)">Analyse IA complete — diagnostic, agroforesterie et conformite EUDR.</div>
          <div class="ai-result" id="ai-result"></div>
        </div>
      </div>
    `;


    // loadAIAdvice chargee depuis ai-advice.js (evite le cache SW)

    // Draw chart if enough data
    if (history.length >= 1) {
      const sorted = [...history].reverse();
      const ctx = document.getElementById('history-chart').getContext('2d');
      chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: sorted.map(h => h.date),
          datasets: [{
            label: 'Score global',
            data: sorted.map(h => h.score),
            borderColor: '#1a4231',
            backgroundColor: 'rgba(26,66,49,.08)',
            borderWidth: 2,
            pointBackgroundColor: sorted.map(h => scoreColor(h.score)),
            pointRadius: 4,
            tension: 0.35,
            fill: true,
          }]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { grid: { display: false }, ticks: { font: { size: 11 }, color: '#6a7d64' } },
            y: { min: 0, max: 100, grid: { color: '#f0ead8' },
              ticks: { font: { size: 11 }, color: '#6a7d64', callback: v => v } }
          }
        }
      });
    }
  } catch(e) { console.error(e); }
}

const riskLabels = { LOW: 'Risque faible', MEDIUM: 'Risque moyen', HIGH: 'Risque élevé' };

async function savePlantCount() {
  const input = document.getElementById('plant-count-input');
  const display = document.getElementById('plant-count-display');
  const val = parseInt(input.value);
  if (isNaN(val) || val < 0) { toast('Nombre de plants invalide.', 'error'); return; }
  try {
    const r = await authFetch('/plantations/' + pid + '/plants?plant_count=' + val, { method: 'PUT' });
    if (!r?.ok) throw new Error('Erreur serveur');
    const data = await r.json();
    display.textContent = val.toLocaleString() + ' plants';
    toast('Nombre de plants enregistré.');
    // Recharger pour mettre à jour le potentiel
    setTimeout(() => location.reload(), 800);
  } catch(e) {
    toast('Erreur : ' + e.message, 'error');
  }
}
function goDiag() { location.href = `diagnostic.html?id=${pid}`; }
function goSat()  { location.href = `satellite.html?id=${pid}`; }
function goAgro() { location.href = `agroforestry.html?id=${pid}`; }
function esc(s)   { const el=document.createElement('div'); el.textContent=s||''; return el.innerHTML; }

load();
</script>
<script src="ai-advice.js"></script>
