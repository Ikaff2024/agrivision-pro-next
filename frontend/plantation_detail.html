<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgriVision Pro — Détail plantation</title>
<script src="avp-offline.js"></script>
  <script src="auth.js?v=ssrte1"></script>
  <script src="ai-advice.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
.back-link{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;
  color:var(--muted);margin-bottom:20px;cursor:pointer;transition:.15s}
.back-link:hover{color:var(--primary)}

.detail-grid{display:grid;grid-template-columns:340px 1fr;gap:24px;align-items:start}
@media(max-width:1050px){.detail-grid{grid-template-columns:1fr}}

/* Info card */
.info-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  overflow:hidden;box-shadow:var(--sh)}
.info-card-hero{background:var(--primary);padding:28px 24px;position:relative;overflow:hidden}
.info-card-hero::after{content:'🌱';position:absolute;right:20px;bottom:10px;
  font-size:72px;opacity:.08;line-height:1}
.info-name{font-family:'Fraunces',serif;font-size:22px;font-weight:700;color:#fff;
  letter-spacing:-.3px;margin-bottom:4px}
.info-owner{font-size:13px;color:rgba(255,255,255,.6)}
.info-score-row{display:flex;align-items:center;gap:14px;margin-top:16px}
.info-score-circle{width:56px;height:56px;border-radius:50%;border:3px solid rgba(255,255,255,.25);
  display:flex;align-items:center;justify-content:center;flex-direction:column;flex-shrink:0}
.info-score-num{font-family:'Fraunces',serif;font-size:20px;font-weight:700;color:#fff;line-height:1}
.info-score-lbl{font-size:9px;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:.05em}
.info-risk-lbl{font-size:14px;font-weight:600;color:rgba(255,255,255,.85)}
.info-risk-sub{font-size:12px;color:rgba(255,255,255,.5);margin-top:2px}

.info-meta{padding:18px 20px;display:flex;flex-direction:column;gap:0}
.meta-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--border-l)}
.meta-row:last-child{border-bottom:none}
.meta-icon{width:32px;height:32px;border-radius:8px;background:var(--bg);
  display:flex;align-items:center;justify-content:center;flex-shrink:0}
.meta-icon .ms{font-size:17px;color:var(--muted)}
.meta-label{font-size:11.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;margin-bottom:1px}
.meta-value{font-size:13.5px;font-weight:500;color:var(--text)}

.action-row{padding:16px 20px;border-top:1px solid var(--border);display:flex;gap:8px;flex-wrap:wrap}

/* Right column */
.chart-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  padding:22px;box-shadow:var(--sh);margin-bottom:20px}
.chart-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.chart-title{font-family:'Fraunces',serif;font-size:17px;font-weight:700}
.chart-wrap{position:relative;height:220px}

.history-table .table-wrap{box-shadow:none;border-radius:var(--r)}
.diag-module-pills{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.dpill{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--bg);
  border:1px solid var(--border);color:var(--muted)}

.empty-state{text-align:center;padding:56px 20px;color:var(--muted)}
.empty-icon{font-size:48px;opacity:.18;margin-bottom:12px}

.rec-panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  padding:22px;box-shadow:var(--sh);margin-bottom:20px}
.rec-panel-title{font-family:'Fraunces',serif;font-size:17px;font-weight:700;margin-bottom:16px;
  display:flex;align-items:center;gap:8px}
.rec-list{display:flex;flex-direction:column;gap:10px}
.rec-item{border-radius:10px;padding:14px 16px;border:1px solid transparent;display:flex;gap:12px;align-items:flex-start}
.rec-item.high{background:#fff5f5;border-color:#fecaca}
.rec-item.medium{background:#fffbeb;border-color:#fde68a}
.rec-item.low{background:#f0fdf4;border-color:#bbf7d0}
.rec-icon{font-size:20px;flex-shrink:0;margin-top:1px}
.rec-body{flex:1;min-width:0}
.rec-header{display:flex;align-items:center;gap:8px;margin-bottom:4px;flex-wrap:wrap}
.rec-title{font-size:13.5px;font-weight:600;color:var(--text)}
.rec-priority{font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;
  text-transform:uppercase;letter-spacing:.06em}
.rec-priority.high{background:#fee2e2;color:#991b1b}
.rec-priority.medium{background:#fef3c7;color:#92400e}
.rec-priority.low{background:#dcfce7;color:#166534}
.rec-category{font-size:11px;color:var(--muted)}
.rec-action{font-size:13px;color:var(--muted);line-height:1.6;margin-top:4px}

/* Agroforesterie mini-card */
.agro-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  padding:20px;box-shadow:var(--sh);margin-bottom:20px;
  border-left:4px solid #2D8C5A}
.agro-card-title{font-family:'Fraunces',serif;font-size:17px;font-weight:700;
  margin-bottom:16px;display:flex;align-items:center;justify-content:space-between}
.agro-metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.agro-metric{text-align:center;background:var(--bg);border-radius:8px;padding:12px 8px}
.agro-metric-val{font-family:'Fraunces',serif;font-size:22px;font-weight:700;line-height:1}
.agro-metric-lbl{font-size:10.5px;color:var(--muted);text-transform:uppercase;
  letter-spacing:.05em;margin-top:4px}
.agro-species-list{display:flex;flex-wrap:wrap;gap:6px}
.agro-pill{font-size:12px;padding:3px 10px;border-radius:99px;background:var(--low-bg);
  border:1px solid var(--low-b);color:var(--low);font-weight:500}
.agro-empty{font-size:13px;color:var(--faint);font-style:italic}

.ai-card{background:linear-gradient(135deg,#0f2d1f 0%,#1a4231 100%);border-radius:var(--r);padding:20px 22px;margin-bottom:16px;color:#fff}
.ai-card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.ai-card-title{font-family:'Fraunces',serif;font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}
.ai-badge{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:rgba(255,255,255,.15);padding:2px 8px;border-radius:99px}
.ai-btn{display:flex;align-items:center;gap:6px;padding:8px 16px;background:#52b788;color:#fff;border:none;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s}
.ai-btn:hover{background:#40916c}.ai-btn:disabled{opacity:.5;cursor:not-allowed}
.ai-spinner{display:none;width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ai-result{display:none;margin-top:14px}
.ai-resume{font-size:13.5px;line-height:1.65;color:rgba(255,255,255,.88);margin-bottom:14px;padding:12px 14px;background:rgba(255,255,255,.08);border-radius:6px}
.ai-section-title{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.5);margin:12px 0 6px}
.ai-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.ai-tag{font-size:12px;padding:3px 10px;border-radius:99px;background:rgba(255,255,255,.1);color:rgba(255,255,255,.85)}
.ai-tag.risk{background:rgba(255,100,80,.18);color:#ff9980}
.ai-actions{display:flex;flex-direction:column;gap:8px}
.ai-action{background:rgba(255,255,255,.07);border-radius:6px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start}
.ai-action-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:4px}
.ai-action-dot.urgent{background:#ff6b6b}.ai-action-dot.important{background:#ffd166}.ai-action-dot.conseil{background:#52b788}
.ai-action-body{flex:1}
.ai-action-title{font-size:13px;font-weight:600;color:#fff;margin-bottom:2px}
.ai-action-detail{font-size:12px;color:rgba(255,255,255,.65);line-height:1.5}
.ai-action-impact{font-size:11px;color:#52b788;margin-top:4px;font-weight:500}
.ai-eudr{font-size:12.5px;color:rgba(255,255,255,.75);padding:10px 12px;background:rgba(255,255,255,.06);border-radius:6px;margin-top:10px;border-left:3px solid #52b788}
.ai-score-row{display:flex;align-items:center;gap:10px;margin-top:12px}
.ai-score-label{font-size:12px;color:rgba(255,255,255,.55)}
.ai-score-val{font-family:'Fraunces',serif;font-size:22px;font-weight:700;color:#52b788}
.ai-error{color:rgba(255,150,120,.9);font-size:13px;padding:10px;background:rgba(255,100,80,.1);border-radius:6px;margin-top:8px}

/* Potentiel de production */
.prod-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:18px 20px;margin-bottom:16px}
.prod-card-title{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:14px;display:flex;align-items:center;gap:6px}
.prod-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.prod-metric{text-align:center;padding:12px 8px;background:var(--bg);border-radius:8px;border:1px solid var(--border-l)}
.prod-val{font-family:'Fraunces',serif;font-size:20px;font-weight:700;color:var(--primary);line-height:1.1;margin-bottom:3px}
.prod-lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.prod-alert{margin-top:12px;padding:10px 12px;border-radius:8px;font-size:12.5px;line-height:1.5}
.prod-alert.warning{background:#fff8e6;border:1px solid #f0c97a;color:#7a4e00}
.prod-alert.success{background:#f0faf5;border:1px solid #b7e4c7;color:#1a6b3a}
.prod-alert.info{background:#eef4ff;border:1px solid #c3d5f5;color:#1e3a5f}
.plant-edit{display:flex;align-items:center;gap:8px;margin-top:10px}
.plant-input{width:120px;padding:6px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;text-align:center}
.plant-save{padding:6px 14px;background:var(--accent);color:#fff;border:none;border-radius:6px;font-size:12.5px;font-weight:600;cursor:pointer}
.plant-save:hover{background:#40916c}
/* Carte Recoltes */
.harvest-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:18px 20px;margin-bottom:16px;border-left:4px solid #d4a017}
.harvest-card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px;flex-wrap:wrap}
.harvest-card-title{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;gap:6px}
.harvest-actions{display:flex;gap:6px}
.harvest-btn-add{background:#d4a017;color:#fff;border:none;padding:6px 12px;border-radius:6px;font-size:12.5px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:4px;transition:.15s}
.harvest-btn-add:hover{background:#b8890a}
.harvest-link{font-size:12.5px;color:var(--accent);font-weight:600;text-decoration:none;display:flex;align-items:center;gap:2px}
.harvest-link:hover{text-decoration:underline}
.harvest-main{text-align:center;padding:8px 0 14px}
.harvest-ratio{font-family:'Fraunces',serif;font-size:32px;font-weight:700;color:var(--text);line-height:1.1}
.harvest-ratio-sub{font-size:12px;color:var(--muted);margin-top:4px}
.harvest-progress-wrap{background:var(--border-l);border-radius:99px;height:10px;overflow:hidden;margin:14px 0 10px}
.harvest-progress-bar{height:100%;border-radius:99px;transition:.4s width}
.harvest-pct{font-size:12px;font-weight:600;text-align:center;margin-bottom:14px}
.harvest-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.harvest-metric{text-align:center;padding:10px 6px;background:var(--bg);border-radius:8px;border:1px solid var(--border-l)}
.harvest-metric-val{font-family:'Fraunces',serif;font-size:17px;font-weight:700;color:var(--primary);line-height:1.1;margin-bottom:2px}
.harvest-metric-lbl{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.harvest-empty{text-align:center;padding:24px 12px;color:var(--muted);font-size:13px}
.harvest-empty-icon{font-size:36px;opacity:.3;margin-bottom:8px}
.ssrte-card{background:var(--surface);border:1px solid var(--border);border-left:4px solid #f97316;border-radius:var(--r);padding:18px 20px;margin-bottom:16px}
.ssrte-card-header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.ssrte-card-title{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;gap:6px}
.ssrte-list{display:grid;gap:8px}
.ssrte-item{border:1px solid var(--border-l);background:var(--bg);border-radius:8px;padding:10px}
.ssrte-item.ssrte-danger{border-color:#fed7aa;background:#fff7ed}
.ssrte-item-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:5px}
.ssrte-item-title{font-size:13px;font-weight:700;color:var(--text)}
.ssrte-badge{font-size:11px;font-weight:700;border-radius:99px;padding:3px 8px;background:#dcfce7;color:#166534;white-space:nowrap}
.ssrte-badge.danger{background:#fee2e2;color:#991b1b}
.ssrte-item-meta{font-size:12px;color:var(--muted);line-height:1.45}

/* Modale de saisie */
#harvest-modal-overlay{position:fixed;inset:0;background:rgba(12,32,24,.55);display:none;align-items:center;justify-content:center;z-index:950;padding:20px}
#harvest-modal-overlay.open{display:flex}
.h-modal{background:var(--surface);border-radius:var(--rl);padding:24px 26px;width:100%;max-width:480px;box-shadow:var(--sh-md);animation:modalIn .2s ease}
.h-modal-title{font-family:'Fraunces',serif;font-size:18px;font-weight:700;margin-bottom:18px;display:flex;align-items:center;gap:8px}
.h-form-group{margin-bottom:14px}
.h-form-label{display:block;font-size:12.5px;font-weight:500;color:var(--muted);margin-bottom:5px}
.h-form-input,.h-form-select,.h-form-textarea{width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:7px;font-size:14px;color:var(--text);background:var(--surface);outline:none;font-family:'DM Sans',sans-serif;transition:.15s}
.h-form-input:focus,.h-form-select:focus,.h-form-textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(82,183,136,.14)}
.h-form-textarea{resize:vertical;min-height:60px;font-family:inherit}
.h-form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.h-modal-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;padding-top:14px;border-top:1px solid var(--border)}
</style>

<body>
<div class="avp-layout">
  <nav id="sidebar"></nav>
  <div class="avp-main">

    <div class="avp-header">
      <div>
        <div class="page-title" id="page-title">Chargement…</div>
        <div class="page-sub" id="page-sub"></div>
      </div>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        <button class="btn btn-outline" id="pdf-report-btn" onclick="downloadPlantationReport()" style="display:none">
          <span class="material-symbols-outlined" style="font-size:18px">picture_as_pdf</span>
          <span id="pdf-btn-label">Generer le rapport PDF</span>
        </button>
        <button class="btn btn-outline" onclick="goSsrteVisit()">
          <span class="material-symbols-outlined" style="font-size:18px">clinical_notes</span>
          Fiche C SSRTE
        </button>
        <button class="btn btn-primary" id="diag-btn" onclick="goDiag()" style="display:none">
          <span class="material-symbols-outlined" style="font-size:18px">biotech</span>
          Nouveau diagnostic
        </button>
      </div>
    </div>

    <div class="avp-content">
      <div class="back-link" onclick="history.back()">
        <span class="material-symbols-outlined" style="font-size:18px">arrow_back</span>
        Retour aux plantations
      </div>

      <div class="detail-grid" id="detail-grid">
        <div style="text-align:center;padding:60px;color:var(--muted)" id="loading">Chargement…</div>
      </div>
    </div>
  </div>
</div>

<script>
initApp('plantations');

const pid = new URLSearchParams(location.search).get('id');
if (!pid) location.href = 'plantations.html';

let chartInstance = null;

// Sprint Offline V1.6 - Phase 3a : load() en mode Stale-While-Revalidate
async function load() {
  const PATH_PLANT = `/plantations/${pid}`;
  const PATH_HIST = `/plantations/${pid}/history?limit=20`;
  const PATH_AGRO = `/plantations/${pid}/agroforestry`;

  // 1. Tentative cache (instantane si dispo)
  let renderedFromCache = false;
  try {
    const [cP, cH, cA] = await Promise.all([
      AVPOffline.cacheGet(PATH_PLANT),
      AVPOffline.cacheGet(PATH_HIST),
      AVPOffline.cacheGet(PATH_AGRO),
    ]);
    if (cP && cP.plantation) {
      const plantation = cP.plantation;
      const diagnostics = cP.diagnostics || [];
      const history = cH || [];
      const agroData = cA || null;
      const latestDiagCache = diagnostics.length
        ? [...diagnostics].sort((a,b) => new Date(b.created_at)-new Date(a.created_at))[0]
        : null;
      let recommendations = [];
      if (latestDiagCache) {
        const cR = await AVPOffline.cacheGet('/diagnostics/' + latestDiagCache.id + '/recommendations');
        if (cR) recommendations = cR;
      }
      _renderPlantationDetail(plantation, diagnostics, history, agroData, recommendations);
      renderedFromCache = true;
    }
  } catch(e) { console.warn('[Phase3a] cache read failed:', e); }

  // 2. Refresh reseau (peut echouer si offline)
  try {
    const [r1, r2, r3] = await Promise.all([
      authFetch(PATH_PLANT),
      authFetch(PATH_HIST),
      authFetch(PATH_AGRO)
    ]);
    if (!r1?.ok) {
      // Plantation introuvable cote serveur : redirect uniquement si pas de cache deja affiche
      if (!renderedFromCache) location.href = 'plantations.html';
      return;
    }
    const data1 = await r1.json();
    const { plantation, diagnostics } = data1;
    const history = r2?.ok ? await r2.json() : [];
    const agroData = r3?.ok ? await r3.json() : null;

    // Mise a jour cache
    AVPOffline.cacheSet(PATH_PLANT, data1);
    if (r2?.ok) AVPOffline.cacheSet(PATH_HIST, history);
    if (r3?.ok) AVPOffline.cacheSet(PATH_AGRO, agroData);

    // Sub-fetch recommendations + cacheSet
    const latestDiag = diagnostics.length
      ? [...diagnostics].sort((a,b) => new Date(b.created_at)-new Date(a.created_at))[0]
      : null;
    let recommendations = [];
    if (latestDiag) {
      try {
        const rr = await authFetch('/diagnostics/' + latestDiag.id + '/recommendations');
        if (rr?.ok) {
          recommendations = await rr.json();
          AVPOffline.cacheSet('/diagnostics/' + latestDiag.id + '/recommendations', recommendations);
        }
      } catch(e) {}
    }

    _renderPlantationDetail(plantation, diagnostics, history, agroData, recommendations);
  } catch(e) {
    // Echec reseau (probablement offline)
    if (!renderedFromCache) {
      // Aucun cache + pas de reseau : empty state explicite (au lieu d'un redirect)
      const grid = document.getElementById('detail-grid');
      if (grid) {
        grid.innerHTML = `<div style="grid-column:1/-1;padding:60px 24px;text-align:center;color:#6a7d64;">
          <div style="font-size:48px;margin-bottom:16px">📡</div>
          <div style="font-size:17px;font-weight:600;margin-bottom:8px;color:#1a4231">Cette plantation n'est pas disponible hors ligne</div>
          <div style="font-size:14px;line-height:1.6">Reconnectez-vous puis rechargez la page pour synchroniser les détails de cette plantation.</div>
          </div>`;
      }
      const titleEl = document.getElementById('page-title');
      if (titleEl) titleEl.textContent = 'Plantation';
      const subEl = document.getElementById('page-sub');
      if (subEl) subEl.textContent = 'Hors ligne — données non disponibles';
    }
    console.warn('[Phase3a] Network refresh failed:', e);
  }
}

// Fonction de rendu extraite de load() pour permettre le double-render (cache puis fresh)
function _renderPlantationDetail(plantation, diagnostics, history, agroData, recommendations) {
  try {
    document.getElementById('page-title').textContent = plantation.name;
    document.getElementById('page-sub').textContent = `${plantation.region||''} · ${plantation.country}`;
    document.getElementById('diag-btn').style.display = '';

    const latestDiag = diagnostics.length
      ? [...diagnostics].sort((a,b) => new Date(b.created_at)-new Date(a.created_at))[0]
      : null;
    // Phase 3a : recommendations sont maintenant passees en parametre par load() (pre-fetched + cached)
    const score = latestDiag?.global_score;
    const risk  = latestDiag?.global_risk_level;
    const colors = { LOW:'#1a6b3a', MEDIUM:'#9a6200', HIGH:'#922b21' };
    const heroColor = colors[risk] || '#1a4231';

    document.getElementById('detail-grid').innerHTML = `
      <!-- Info card -->
      <div class="info-card">
        <div class="info-card-hero" style="background:${heroColor}">
          <div class="info-name">${esc(plantation.name)}</div>
          <div class="info-owner">${esc(plantation.owner_name)}</div>
          ${score != null ? `

const riskLabels = { LOW: 'Risque faible', MEDIUM: 'Risque moyen', HIGH: 'Risque élevé' };
function renderProductionCard(p) {
  const container = document.getElementById("prod-container");
  if (!container || p.plant_count == null || p.plant_count <= 0) return;

  const pc = p.plant_count;
  const density = (p.hectares && p.hectares > 0) ? Math.round(pc / p.hectares) : null;
  const prodMinKg = Math.round(pc * 0.4);
  const prodMaxKg = Math.round(pc * 0.6);
  const prodAvgT = ((prodMinKg + prodMaxKg) / 2 / 1000).toFixed(1);

  let alertHtml = "";
  if (density !== null) {
    if (density < 800) {
      alertHtml = '<div class="prod-alert warning">&#9888; Densite insuffisante (' + density + ' pieds/ha). Minimum recommande : 800 pieds/ha (norme CCC). Replantation conseillee.</div>';
    } else if (density > 1200) {
      alertHtml = '<div class="prod-alert info">&#8505; Densite elevee (' + density + ' pieds/ha). Eclaircissage possible pour ameliorer la qualite des cabosses.</div>';
    } else {
      alertHtml = '<div class="prod-alert success">&#10003; Densite optimale (' + density + ' pieds/ha). Conforme aux normes CCC (800-1111 pieds/ha).</div>';
    }
  }

  container.innerHTML =
    '<div class="prod-card">' +
      '<div class="prod-card-title">&#127793; Potentiel de production</div>' +
      '<div class="prod-grid">' +
        '<div class="prod-metric"><div class="prod-val">' + pc.toLocaleString() + '</div><div class="prod-lbl">Plants</div></div>' +
        '<div class="prod-metric"><div class="prod-val">' + (density !== null ? density.toLocaleString() : "—") + '</div><div class="prod-lbl">Pieds/ha</div></div>' +
        '<div class="prod-metric"><div class="prod-val">' + prodAvgT + ' t</div><div class="prod-lbl">Potentiel/an</div></div>' +
      '</div>' +
      alertHtml +
    '</div>';
}

async function savePlantCount() {
  const input = document.getElementById("plant-count-input");
  const display = document.getElementById("plant-count-display");
  const val = parseInt(input.value);
  if (isNaN(val) || val < 0) { toast("Nombre de plants invalide.", "error"); return; }
  try {
    const r = await authFetch("/plantations/" + pid + "/plants?plant_count=" + val, { method: "PUT" });
    if (!r || !r.ok) throw new Error("Erreur serveur");
    display.textContent = val.toLocaleString() + " plants";
    toast("Nombre de plants enregistre.");
    setTimeout(() => location.reload(), 700);
  } catch (e) {
    toast("Erreur : " + e.message, "error");
  }
}

async function renderHarvestCard(p) {
  const container = document.getElementById("harvest-container");
  if (!container) return;

  // Calcul du potentiel annuel (meme formule que renderProductionCard)
  const pc = p.plant_count;
  const hasPotential = pc != null && pc > 0;
  const prodAvgKg = hasPotential ? Math.round(pc * 0.5) : 0;

  // Phase 3a : SWR sur les stats recoltes
  const STATS_PATH = "/plantations/" + pid + "/harvests/stats";
  let stats = null;
  // 1. Tentative cache d'abord
  try {
    const cached = await AVPOffline.cacheGet(STATS_PATH);
    if (cached) stats = cached;
  } catch (e) {}
  // 2. Refresh reseau (peut echouer si offline)
  try {
    const r = await authFetch(STATS_PATH);
    if (r && r.ok) {
      stats = await r.json();
      AVPOffline.cacheSet(STATS_PATH, stats);
    }
  } catch (e) {}

  if (!stats) {
    container.innerHTML = '';
    return;
  }

  // Permissions
  const u = (typeof getCurrentUser === "function") ? getCurrentUser() : null;
  const role = u && u.role ? u.role : "";
  const canAdd = (role === "admin" || role === "agronomist");

  const totalYear = stats.total_kg_current_year || 0;
  const countTotal = stats.count_total || 0;
  const seasonStr = (stats.by_season && stats.by_season.grande !== undefined)
    ? "Grande: " + Math.round(stats.by_season.grande) + " kg / Petite: " + Math.round(stats.by_season.petite) + " kg"
    : "";

  // Si pas de plant_count : afficher juste les recoltes sans ratio
  let mainHtml;
  if (!hasPotential) {
    mainHtml =
      '<div class="harvest-main">' +
        '<div class="harvest-ratio">' + Math.round(totalYear).toLocaleString() + ' kg</div>' +
        '<div class="harvest-ratio-sub">recoltes en ' + new Date().getFullYear() + '</div>' +
      '</div>';
  } else {
    const pct = prodAvgKg > 0 ? Math.min(100, Math.round((totalYear / prodAvgKg) * 100)) : 0;
    let barColor = '#922b21';
    let pctColor = '#922b21';
    if (pct >= 80) { barColor = '#1a6b3a'; pctColor = '#1a6b3a'; }
    else if (pct >= 50) { barColor = '#9a6200'; pctColor = '#9a6200'; }

    mainHtml =
      '<div class="harvest-main">' +
        '<div class="harvest-ratio">' + Math.round(totalYear).toLocaleString() + ' / ' + prodAvgKg.toLocaleString() + ' kg</div>' +
        '<div class="harvest-ratio-sub">recolte ' + new Date().getFullYear() + ' / potentiel annuel</div>' +
      '</div>' +
      '<div class="harvest-progress-wrap"><div class="harvest-progress-bar" style="width:' + pct + '%;background:' + barColor + '"></div></div>' +
      '<div class="harvest-pct" style="color:' + pctColor + '">' + pct + '% du potentiel atteint</div>';
  }

  // Etat vide vs avec donnees
  let bodyHtml;
  if (countTotal === 0) {
    bodyHtml =
      '<div class="harvest-empty">' +
        '<div class="harvest-empty-icon">&#127806;</div>' +
        '<div>Aucune recolte enregistree.</div>' +
        (canAdd ? '<div style="font-size:12px;margin-top:6px">Cliquez sur <b>+ Saisir</b> pour ajouter votre premiere recolte.</div>' : '') +
      '</div>';
  } else {
    bodyHtml = mainHtml +
      '<div class="harvest-grid">' +
        '<div class="harvest-metric"><div class="harvest-metric-val">' + countTotal + '</div><div class="harvest-metric-lbl">Recoltes</div></div>' +
        '<div class="harvest-metric"><div class="harvest-metric-val">' + Math.round(stats.total_kg_all_time).toLocaleString() + '</div><div class="harvest-metric-lbl">Cumul kg</div></div>' +
        '<div class="harvest-metric"><div class="harvest-metric-val">' + (stats.by_year && stats.by_year.length || 0) + '</div><div class="harvest-metric-lbl">Annees</div></div>' +
      '</div>' +
      (seasonStr ? '<div style="text-align:center;font-size:11.5px;color:var(--muted);margin-top:10px">' + seasonStr + '</div>' : '');
  }

  container.innerHTML =
    '<div class="harvest-card">' +
      '<div class="harvest-card-header">' +
        '<div class="harvest-card-title">&#127806; Recoltes</div>' +
        '<div class="harvest-actions">' +
          (canAdd ? '<button class="harvest-btn-add" onclick="openHarvestModal()"><span class="material-symbols-outlined" style="font-size:15px">add</span>Saisir</button>' : '') +
          '<a class="harvest-link" href="harvests.html?plantation_id=' + pid + '">Voir tout &rarr;</a>' +
        '</div>' +
      '</div>' +
      bodyHtml +
    '</div>';
}

async function renderSsrteCard(p) {
  const container = document.getElementById("ssrte-container");
  if (!container) return;

  const createUrl = "ssrte.html?tab=visit&plantation_id=" + encodeURIComponent(pid);
  try {
    const r = await authFetch("/ssrte/plantation-visits?plantation_id=" + encodeURIComponent(pid) + "&limit=5");
    const visits = (r && r.ok) ? await r.json() : [];

    const header =
      '<div class="ssrte-card-header">' +
        '<div class="ssrte-card-title"><span class="material-symbols-outlined" style="font-size:16px">clinical_notes</span> Suivi SSRTE</div>' +
        '<a class="harvest-link" href="' + createUrl + '">Nouvelle Fiche C &rarr;</a>' +
      '</div>';

    if (!visits.length) {
      container.innerHTML =
        '<div class="ssrte-card">' +
          header +
          '<div class="harvest-empty">' +
            '<div class="harvest-empty-icon"><span class="material-symbols-outlined" style="font-size:36px">assignment</span></div>' +
            '<div>Aucune visite SSRTE Fiche C pour cette plantation.</div>' +
            '<div style="font-size:12px;margin-top:6px">Demarrez une visite terrain depuis ce raccourci.</div>' +
          '</div>' +
        '</div>';
      return;
    }

    const dateFmt = (value) => {
      if (!value) return "-";
      if (typeof fmtDate === "function") return fmtDate(value);
      return String(value).slice(0, 10);
    };

    const body = visits.map(v => {
      const dangerous = Array.isArray(v.dangerous_tasks_observed) ? v.dangerous_tasks_observed : [];
      const photos = Array.isArray(v.photos) ? v.photos : [];
      const suspect = !!v.suspected_child_labor;
      const action = v.immediate_actions_taken ? '<div class="ssrte-item-meta"><b>Action:</b> ' + esc(v.immediate_actions_taken) + '</div>' : '';
      const notes = v.notes ? '<div class="ssrte-item-meta"><b>Notes:</b> ' + esc(v.notes) + '</div>' : '';
      return '<div class="ssrte-item ' + (suspect ? 'ssrte-danger' : '') + '">' +
        '<div class="ssrte-item-top">' +
          '<div class="ssrte-item-title">Fiche C - ' + esc(dateFmt(v.visit_date)) + '</div>' +
          '<span class="ssrte-badge ' + (suspect ? 'danger' : '') + '">' + (suspect ? 'Suspicion' : 'OK') + '</span>' +
        '</div>' +
        '<div class="ssrte-item-meta">Taches dangereuses: ' + dangerous.length + ' | Photos: ' + photos.length + ' | Consentement: ' + (v.consent_given ? 'oui' : 'non') + '</div>' +
        action +
        notes +
      '</div>';
    }).join("");

    container.innerHTML =
      '<div class="ssrte-card">' +
        header +
        '<div class="ssrte-list">' + body + '</div>' +
      '</div>';
  } catch (e) {
    container.innerHTML = "";
  }
}

async function downloadDdsPdf() {
  const btn = document.getElementById('dds-btn');
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Generation...'; }
  try {
    const res = await authFetch('/plantations/' + pid + '/eudr-dds.pdf');
    if (!res || !res.ok) {
      const body = await (res ? res.json().catch(() => ({})) : {});
      throw new Error(body.detail || 'Echec generation DDS PDF.');
    }
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    // Reuse filename from content-disposition if present
    const cd = res.headers.get('content-disposition') || '';
    const match = cd.match(/filename="([^"]+)"/);
    a.download = match ? match[1] : ('DDS_plantation_' + pid + '.pdf');
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    if (typeof toast === 'function') toast('DDS PDF telecharge.');
  } catch (e) {
    if (typeof toast === 'function') toast(e.message, 'error');
    else alert(e.message);
  } finally {
    if (btn) {
      btn.disabled = false;
      btn.innerHTML = '<span class="material-symbols-outlined" style="font-size:16px">picture_as_pdf</span> Telecharger DDS';
    }
  }
}

async function renderEudrCard(p) {
  const container = document.getElementById("eudr-container");
  if (!container) return;
  try {
    const r = await authFetch("/plantations/" + pid + "/eudr-score");
    if (!r || !r.ok) {
      container.innerHTML = "";
      return;
    }
    const data = await r.json();
    const STATUS_LBL = { conforme: "Conforme EUDR", a_verifier: "A verifier", non_conforme: "Non conforme" };
    const COLOR_BG = { green: "#eafaf1", orange: "#fef8ec", red: "#fdedec" };
    const COLOR_FG = { green: "#1a6b3a", orange: "#9a6200", red: "#922b21" };
    const COLOR_BD = { green: "#a8d8bb", orange: "#f0c97a", red: "#f1948a" };
    const bg = COLOR_BG[data.badge_color] || "#f0ead8";
    const fg = COLOR_FG[data.badge_color] || "#1a4231";
    const bd = COLOR_BD[data.badge_color] || "#e6ddd0";
    const rules = (data.rules || []).map(rule => {
      const ok = rule.passed;
      const icon = ok ? "check_circle" : "cancel";
      const col = ok ? "#1a6b3a" : "#922b21";
      return '<div style="display:flex;align-items:flex-start;gap:8px;padding:8px 10px;border-bottom:1px solid var(--border-l);font-size:13px">' +
        '<span class="material-symbols-outlined" style="font-size:18px;color:' + col + ';flex-shrink:0;margin-top:1px">' + icon + '</span>' +
        '<div style="flex:1">' +
          '<div style="font-weight:600;color:var(--text)">' + esc(rule.label) + '</div>' +
          (rule.detail ? '<div style="font-size:12px;color:var(--muted);margin-top:2px">' + esc(rule.detail) + '</div>' : '') +
        '</div>' +
      '</div>';
    }).join('');
    const ctaText = data.has_polygon ? 'Voir sur la carte' : 'Tracer le polygone';
    container.innerHTML =
      '<div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;margin-top:18px">' +
        '<div style="background:' + bg + ';border-left:4px solid ' + bd + ';padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap">' +
          '<div>' +
            '<div style="font-family:Fraunces,serif;font-size:16px;font-weight:700;color:' + fg + '">' +
              '<span class="material-symbols-outlined" style="font-size:18px;vertical-align:-3px">eco</span> ' +
              'Conformite EUDR : ' + (STATUS_LBL[data.status] || data.status) +
            '</div>' +
            '<div style="font-size:12px;color:' + fg + ';margin-top:3px">' +
              'Score ' + data.score + '/' + data.max_score + ' - methodologie ' + data.methodology_version +
            '</div>' +
          '</div>' +
          '<div style="display:flex;gap:6px;flex-wrap:wrap">' +
            '<a class="btn btn-outline btn-sm" href="map.html?plantation_id=' + pid + '">' +
              '<span class="material-symbols-outlined" style="font-size:16px">polyline</span> ' + ctaText +
            '</a>' +
            '<button class="btn btn-primary btn-sm" onclick="downloadDdsPdf()" id="dds-btn">' +
              '<span class="material-symbols-outlined" style="font-size:16px">picture_as_pdf</span> Telecharger DDS' +
            '</button>' +
          '</div>' +
        '</div>' +
        '<div>' + rules + '</div>' +
      '</div>';
  } catch (e) {
    container.innerHTML = '';
  }
}

function openHarvestModal() {
  document.getElementById("harvest-modal-overlay").classList.add("open");
  // Date par defaut = aujourd'hui
  document.getElementById("h-date").value = new Date().toISOString().split("T")[0];
  document.getElementById("h-quantity").value = "";
  document.getElementById("h-quality").value = "Bonne";
  document.getElementById("h-price").value = "";
  document.getElementById("h-notes").value = "";
  setTimeout(() => document.getElementById("h-quantity").focus(), 100);
}

function closeHarvestModal() {
  document.getElementById("harvest-modal-overlay").classList.remove("open");
}

async function submitHarvest() {
  const date = document.getElementById("h-date").value;
  const qty = parseFloat(document.getElementById("h-quantity").value);
  const quality = document.getElementById("h-quality").value;
  const priceVal = document.getElementById("h-price").value;
  const notes = document.getElementById("h-notes").value.trim();

  if (!date) { toast("Date obligatoire.", "error"); return; }
  if (isNaN(qty) || qty <= 0) { toast("Quantite invalide.", "error"); return; }
  if (!["Bonne", "Moyenne", "Defauts"].includes(quality)) { toast("Qualite invalide.", "error"); return; }

  const payload = {
    harvest_date: date + "T08:00:00",
    quantity_kg: qty,
    quality: quality,
    is_historical: false
  };
  if (priceVal !== "" && !isNaN(parseFloat(priceVal))) {
    payload.price_per_kg_fcfa = parseFloat(priceVal);
  }
  if (notes) payload.notes = notes;

  const submitBtn = document.getElementById("h-submit-btn");
  submitBtn.disabled = true;
  submitBtn.textContent = "Enregistrement...";

  try {
    const r = await authFetch("/plantations/" + pid + "/harvests", {
      method: "POST",
      body: JSON.stringify(payload)
    });
    if (!r) throw new Error("Pas de reponse serveur");
    if (r.status === 403) { toast("Vous n'avez pas les droits pour saisir une recolte.", "error"); return; }
    if (!r.ok) {
      let detail = "Erreur serveur";
      try { const e = await r.json(); detail = e.detail || detail; } catch(e){}
      throw new Error(detail);
    }
    toast("Recolte enregistree avec succes !");
    closeHarvestModal();
    // Rafraichir la carte
    setTimeout(() => location.reload(), 600);
  } catch (e) {
    toast("Erreur : " + e.message, "error");
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = "Enregistrer";
  }
}

// === Sprint Reports R1b : telechargement PDF du rapport plantation ===
async function downloadPlantationReport() {
  const btn = document.getElementById("pdf-report-btn");
  const label = document.getElementById("pdf-btn-label");
  if (!btn || !label) return;

  const originalLabel = label.textContent;
  btn.disabled = true;
  label.textContent = "Generation en cours...";

  try {
    const response = await authFetch("/plantations/" + pid + "/report.pdf");

    if (!response.ok) {
      let detail = "Erreur " + response.status;
      try {
        const err = await response.json();
        if (err && err.detail) {
          detail = (typeof err.detail === "string") ? err.detail : JSON.stringify(err.detail);
        }
      } catch (e) {}

      if (response.status === 403) {
        alert("Acces refuse : seuls les admins et agronomes peuvent generer le rapport PDF.");
      } else if (response.status === 404) {
        alert("Plantation introuvable.");
      } else {
        alert("Echec de la generation du rapport :\n" + detail);
      }
      return;
    }

    let filename = "Rapport_Plantation_" + pid + ".pdf";
    const cd = response.headers.get("Content-Disposition") || "";
    const m1 = cd.match(/filename\*=UTF-8''([^;]+)/i);
    const m2 = cd.match(/filename="([^"]+)"/);
    if (m1) {
      try { filename = decodeURIComponent(m1[1]); } catch (e) { filename = m1[1]; }
    } else if (m2) {
      filename = m2[1];
    }

    const blob = await response.blob();
    const blobUrl = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = blobUrl;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function() { URL.revokeObjectURL(blobUrl); }, 1000);

  } catch (err) {
    console.error("Erreur generation PDF :", err);
    alert("Erreur reseau lors de la generation du PDF. Verifiez votre connexion et reessayez.");
  } finally {
    btn.disabled = false;
    label.textContent = originalLabel;
  }
}


// === Sprint R1d : helper Anti-Detracteur — verification NDVI plantation ====
async function avpCheckPlantationNdvi(plantationId, recoContainerId) {
  // Recupere l'analyse satellite et, si confidence=low, affiche un badge
  // d'alerte au-dessus du conteneur de recommandations.
  if (typeof authFetch !== "function") return;
  // Phase 3a : SWR sur l'analyse satellite NDVI
  const SAT_PATH = "/plantations/" + plantationId + "/satellite";
  let data = null;
  // 1. Tentative cache
  try {
    const cached = await AVPOffline.cacheGet(SAT_PATH);
    if (cached) data = cached;
  } catch (e) {}
  // 2. Refresh reseau (peut echouer si offline)
  try {
    const res = await authFetch(SAT_PATH);
    if (res && res.ok) {
      data = await res.json();
      AVPOffline.cacheSet(SAT_PATH, data);
    }
  } catch (e) {
    // Echec silencieux : si on a du cache, on continue avec; sinon on sort
  }
  try {
    if (!data) return;
    if (data && data.confidence === "low" && data.warning_message) {
      const container = document.getElementById(recoContainerId || "recommendations");
      if (!container) return;
      let badge = document.getElementById("avp-ndvi-badge");
      if (!badge) {
        badge = document.createElement("div");
        badge.id = "avp-ndvi-badge";
        badge.style.cssText = "margin: 12px 0; padding: 12px 16px; " +
          "background: #fef3c7; border-left: 4px solid #d97706; " +
          "border-radius: 6px; color: #78350f; font-size: 13.5px; line-height: 1.5;";
        container.parentNode.insertBefore(badge, container);
      }
      badge.innerHTML = "<strong>NDVI satellite tres faible — recommandations a verifier</strong><br>" +
                        data.warning_message;
    }
  } catch (e) {
    // Echec silencieux : le helper est purement informatif
    console.warn("avpCheckPlantationNdvi: ", e);
  }
}
