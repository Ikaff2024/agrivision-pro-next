<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1a4231">
  <title>AgriVision Pro - Remediation CacaoGuard</title>
  <script src="config.js?v=staging1"></script>
  <script src="avp-offline.js?v=cg3"></script>
  <script src="auth.js?v=ssrte1"></script>
  <style>
    .rem-layout{display:grid;grid-template-columns:380px 1fr;gap:20px}
    .rem-panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:22px;box-shadow:var(--sh)}
    .plan-list{display:grid;gap:12px}
    .plan-card{border:1px solid var(--border);border-radius:8px;background:var(--surface);padding:16px}
    .plan-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:10px}
    .plan-ref{font-weight:700;font-size:14px}
    .plan-meta{font-size:12.5px;color:var(--muted);line-height:1.45;margin-top:3px}
    .action-list{margin-top:10px;display:grid;gap:7px}
    .action-item{font-size:12.5px;background:var(--surface-warm);border:1px solid var(--border-l);border-radius:8px;padding:8px}
    .sync-box{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--border);background:var(--surface-warm);border-radius:8px;padding:10px 12px;margin-bottom:14px}
    .sync-text{font-size:12.5px;color:var(--muted);line-height:1.35}
    @media(max-width:960px){.rem-layout{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div class="avp-layout">
  <nav id="sidebar"></nav>
  <div class="avp-main">
    <div class="avp-header">
      <div>
        <div class="page-title">Remediation</div>
        <div class="page-sub">Plans individuels, actions et suivi mensuel CacaoGuard</div>
      </div>
      <button class="btn btn-outline" onclick="location.href='children.html'">
        <span class="material-symbols-outlined" style="font-size:18px">diversity_3</span>
        Enfants
      </button>
    </div>

    <div class="avp-content">
      <div class="rem-layout">
        <div class="rem-panel">
          <div class="section-title">Ouvrir un plan</div>
          <div class="form-group">
            <label class="form-label">Enfant concerne</label>
            <select class="form-input" id="child"></select>
          </div>
          <div class="form-group">
            <label class="form-label">Priorite</label>
            <select class="form-input" id="priority">
              <option value="high">Elevee</option>
              <option value="urgent">Urgente</option>
              <option value="medium">Moyenne</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Objectif principal</label>
            <textarea class="form-input" id="objective" rows="3">Retirer l'enfant des taches dangereuses et documenter le retour a une situation conforme.</textarea>
          </div>
          <div id="err" style="display:none;color:var(--high);font-size:13px;margin-bottom:10px"></div>
          <button class="btn btn-primary" onclick="createPlan()" style="width:100%;justify-content:center">
            <span class="material-symbols-outlined" style="font-size:18px">assignment_add</span>
            Creer le plan
          </button>
          <div class="divider"></div>
          <div class="text-sm text-muted" style="line-height:1.45">
            Les enfants a risque eleve ou critique generent deja un plan automatiquement. Ce formulaire sert a ouvrir un plan manuel.
          </div>
        </div>

        <div class="rem-panel">
          <div class="flex items-center justify-between mb-4">
            <div class="section-title" style="margin:0">Plans actifs</div>
            <button class="btn btn-sm btn-outline" onclick="loadPlans()">Actualiser</button>
          </div>
          <div class="sync-box">
            <div>
              <div class="plan-ref">Synchronisation terrain</div>
              <div class="sync-text" id="sync-status">Verification des suivis locaux...</div>
            </div>
            <button class="btn btn-sm btn-outline" onclick="syncOfflineQueue()">Synchroniser</button>
          </div>
          <div id="plans" class="plan-list">
            <div class="empty-state" style="padding:32px">Chargement...</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
initApp('remediation');

const CG_API = window.CG_API_BASE || window.API_BASE || 'http://127.0.0.1:8010';
const labels = {
  draft:'Brouillon', pending_approval:'Validation', approved:'Approuve', in_progress:'En cours',
  completed:'Termine', closed:'Clos', escalated:'Escalade',
  low:'Faible', medium:'Moyenne', high:'Elevee', urgent:'Urgente',
  none:'Aucun', critical:'Critique',
  education:'Education', awareness:'Sensibilisation', economic_support:'Soutien economique', other:'Autre'
};

async function cgFetch(endpoint, options = {}) {
  const token = typeof getToken === 'function' ? getToken() : null;
  const method = (options.method || 'GET').toUpperCase();
  return fetch(CG_API + endpoint, {
    ...options,
    cache:'no-store',
    headers:{
      ...(method !== 'GET' ? { 'Content-Type':'application/json' } : {}),
      ...(token ? { 'Authorization':'Bearer ' + token } : {}),
      ...(options.headers || {})
    }
  });
}

async function loadChildren() {
  const res = await cgFetch('/children?limit=500');
  const children = res.ok ? await res.json() : [];
  document.getElementById('child').innerHTML = children.map(c =>
    `<option value="${c.id}">${c.first_name} ${c.last_name} - risque ${labels[c.risk_level] || c.risk_level}</option>`
  ).join('');
}

async function loadPlans() {
  const el = document.getElementById('plans');
  const res = await cgFetch('/remediation/plans?limit=100');
  if (!res.ok) {
    el.innerHTML = '<div class="empty-state" style="padding:32px">Impossible de charger les plans.</div>';
    return;
  }
  const plans = await res.json();
  if (!plans.length) {
    el.innerHTML = '<div class="empty-state" style="padding:32px">Aucun plan de remediation ouvert.</div>';
    return;
  }
  el.innerHTML = plans.map(p => `
    <div class="plan-card">
      <div class="plan-top">
        <div>
          <div class="plan-ref">${p.plan_reference} - ${p.child_name}</div>
          <div class="plan-meta">${p.producer_name} - echeance ${p.expected_completion_date || 'non definie'}</div>
        </div>
        <span class="badge ${p.priority === 'urgent' || p.priority === 'high' ? 'badge-high' : 'badge-med'}">${labels[p.priority] || p.priority}</span>
      </div>
      <div class="plan-meta">Statut: ${labels[p.status] || p.status}</div>
      <div class="plan-meta">${p.main_objective}</div>
      <div class="action-list">
        ${(p.actions || []).map(a => `<div class="action-item">${labels[a.action_type] || a.action_type}: ${a.description} - ${a.planned_date}</div>`).join('')}
      </div>
      <div class="form-group" style="margin-top:12px">
        <input class="form-input" id="note-${p.id}" placeholder="Note de suivi mensuel...">
      </div>
      <button class="btn btn-sm btn-primary" onclick="addProgress(${p.id})">Ajouter suivi</button>
    </div>
  `).join('');
}

async function createPlan() {
  const err = document.getElementById('err');
  err.style.display = 'none';
  const childId = Number(document.getElementById('child').value);
  if (!childId) {
    err.textContent = 'Selectionnez un enfant.';
    err.style.display = 'block';
    return;
  }
  const payload = {
    child_id: childId,
    priority: document.getElementById('priority').value,
    main_objective: document.getElementById('objective').value.trim()
  };
  const res = await submitOffline('/remediation/plans', payload, `Plan remediation enfant ${childId}`);
  if (res.queued) {
    toast('Plan garde en local. Il sera synchronise au retour du reseau.', 'success');
    await refreshQueueStatus();
    return;
  }
  if (!res.response.ok) {
    const e = await res.response.json().catch(() => ({}));
    err.textContent = e.detail || 'Erreur creation plan.';
    err.style.display = 'block';
    return;
  }
  toast('Plan cree.');
  await refreshQueueStatus();
  await loadPlans();
}

async function addProgress(id) {
  const input = document.getElementById(`note-${id}`);
  const note = input.value.trim();
  if (!note) {
    toast('Saisissez une note de suivi.', 'error');
    return;
  }
  const res = await submitOffline(`/remediation/plans/${id}/progress`, { note, status:'in_progress' }, `Suivi remediation plan ${id}`);
  if (res.queued) {
    toast('Suivi garde en local. Synchronisation au retour du reseau.', 'success');
    input.value = '';
    await refreshQueueStatus();
    return;
  }
  if (!res.response.ok) {
    toast('Impossible d ajouter le suivi.', 'error');
    return;
  }
  toast('Suivi ajoute.');
  input.value = '';
  await refreshQueueStatus();
  await loadPlans();
}

async function submitOffline(endpoint, payload, label) {
  if (window.AVPOffline?.offlineFetch) {
    return AVPOffline.offlineFetch(endpoint, {
      method:'POST',
      body:JSON.stringify(payload),
      headers:{ 'Content-Type':'application/json' }
    }, label, { module:'cacaoguard', page:'remediation' });
  }
  const response = await cgFetch(endpoint, { method:'POST', body:JSON.stringify(payload) });
  return { queued:false, response };
}

async function refreshQueueStatus() {
  if (!window.AVPOffline?.getQueueByEndpoint) return;
  const queue = await AVPOffline.getQueueByEndpoint('/remediation/');
  const pending = queue.filter(e => e.status === 'pending').length;
  const errors = queue.filter(e => e.status === 'error').length;
  const syncing = queue.filter(e => e.status === 'syncing').length;
  document.getElementById('sync-status').textContent =
    `${pending} saisie(s) en attente, ${syncing} en cours, ${errors} en erreur.`;
}

async function syncOfflineQueue() {
  if (!window.AVPOffline?.syncQueue) return;
  const result = await AVPOffline.syncQueue();
  if (result && !result.skipped) toast(`${result.synced || 0} saisie(s) synchronisee(s).`);
  await refreshQueueStatus();
  await loadPlans();
}

window.addEventListener('avp-queue-changed', refreshQueueStatus);
window.addEventListener('online', refreshQueueStatus);
loadChildren();
loadPlans();
refreshQueueStatus();
</script>
</body>
</html>
