<!DOCTYPE html>
<html lang="fr">
<head>
  <!-- Coquille CRITIQUE render-blocking : peint un shell STYLÉ (barre latérale
       sombre + fond crème + layout) dès l'analyse du HTML, SANS attendre auth.js.
       Sans ça, toute la page "disparaît" le temps qu'auth.js injecte ses styles à
       chaque navigation. auth.js réinjecte ensuite le jeu complet (valeurs alignées). -->
  <style id="avp-anti-flash">
    html{background:#f8f4ee}
    @view-transition{navigation:auto}
    .avp-layout{display:flex;min-height:100vh}
    #sidebar{width:240px;background:#0c2018;flex-shrink:0;position:sticky;top:0;height:100vh;overflow-y:auto}
    .avp-main{flex:1;min-width:0;height:100vh;overflow-y:auto;background:#f8f4ee}
    @media(max-width:768px){.avp-layout{display:block}#sidebar{width:100%;height:auto;position:static}.avp-main{height:auto}}
  </style>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgriVision Pro — Analytique (fusionné)</title>
  <!-- La page Analytique a été fusionnée dans le Dashboard (section « Analyse agronomique »). -->
  <meta http-equiv="refresh" content="0; url=index.html">
  <script>window.location.replace('index.html');</script>
  <!-- Polices de marque : préchargées tôt (évite le flash de typographie au chargement) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" data-avp-fonts href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,700&family=DM+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block">
</head>
<body>
  <p style="font-family:sans-serif;padding:24px">
    L'analytique est désormais intégrée au <a href="index.html">Dashboard</a>. Redirection…
  </p>
</body>
</html>
