<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1a4231">
  <title>AgriVision Pro — Aide / Guide</title>
  <script src="config.js?v=staging1"></script>
    <!-- Polices de marque : préchargées tôt (évite le flash de typographie au chargement) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" data-avp-fonts href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,700&family=DM+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block">
<script src="auth.js?v=guide1"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
  <style>
    .guide-grid{display:grid;grid-template-columns:280px 1fr;gap:18px}
    .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--sh)}
    .toc{padding:10px;position:sticky;top:12px;max-height:calc(100vh - 120px);overflow:auto}
    .toc a{display:block;padding:9px 12px;border-radius:8px;font-size:13.5px;color:var(--text);text-decoration:none;cursor:pointer;line-height:1.3}
    .toc a:hover{background:var(--bg)}
    .toc a.active{background:#f0faf5;color:var(--primary);font-weight:700;border-left:3px solid var(--accent)}
    .content{padding:26px 32px;min-height:60vh}
    .content h1{font-family:'Fraunces',serif;font-size:26px;color:var(--primary);margin:0 0 16px}
    .content h2{font-family:'Fraunces',serif;font-size:20px;color:var(--primary,#14532d);margin:22px 0 10px;border-bottom:1px solid var(--border);padding-bottom:6px}
    .content h3{font-size:16px;margin:18px 0 8px}
    .content p,.content li{font-size:14.5px;line-height:1.7;color:var(--text)}
    .content ul,.content ol{padding-left:22px}
    .content code{background:var(--surface-warm);padding:1px 6px;border-radius:5px;font-size:13px}
    .content table{border-collapse:collapse;width:100%;margin:12px 0;font-size:13.5px}
    .content th,.content td{border:1px solid var(--border);padding:7px 10px;text-align:left}
    .content th{background:var(--surface-warm)}
    .content blockquote{border-left:4px solid var(--accent);background:#fbf8f1;margin:12px 0;padding:8px 14px;color:var(--text);border-radius:0 6px 6px 0}
    .content a{color:var(--primary,#15803d);font-weight:600}
    .print-btn{float:right}
    @media(max-width:900px){.guide-grid{grid-template-columns:1fr}.toc{position:static;max-height:none}}
    @media print{ #sidebar,.avp-header,.toc,.print-btn{display:none!important} .guide-grid{grid-template-columns:1fr} }
  </style>
</head>
<body>
<div class="avp-layout">
  <nav id="sidebar"></nav>
  <div class="avp-main">
    <div class="avp-header">
      <div>
        <div class="page-title">Aide / Guide d'utilisation</div>
        <div class="page-sub">Mode d'emploi détaillé, module par module</div>
      </div>
      <button class="btn btn-outline print-btn" onclick="window.print()"><span class="material-symbols-outlined" style="font-size:18px">print</span> Imprimer cette fiche</button>
    </div>
    <div class="avp-content">
      <div class="guide-grid">
        <div class="panel toc" id="toc"></div>
        <div class="panel content" id="content"><p>Chargement…</p></div>
      </div>
    </div>
  </div>
</div>

<script>
initApp('guide');

// Sommaire (titre affiché -> fichier markdown dans /guide/)
const SECTIONS = [
  ['Sommaire',                         '00_INDEX.md'],
  ['1. Démarrage',                     '01_demarrage.md'],
  ['2. Plantations & Producteurs',     '02_plantations_producteurs.md'],
  ['3. Diagnostic, Carte & Satellite', '03_diagnostic_carte_satellite.md'],
  ['4. Agroforesterie & Récoltes',     '04_agroforesterie_recoltes.md'],
  ['5. Achats, Lots & Certification',  '05_achats_lots_certification.md'],
  ['6. CacaoGuard & SSRTE',            '06_cacaoguard_ssrte.md'],
  ['7. EUDR & Conformité',             '07_eudr_conformite.md'],
  ['8. Revenu vital',      '08_farmforce_revenu_vital.md'],
  ['9. Suivi terrain',                 '09_suivi_terrain.md'],
  ['10. Import d\'un registre',        '10_import_registre.md'],
  ['11. Dashboard, Direction, Rapports','11_dashboard_direction_rapports.md'],
  ['12. Administration','12_administration_proprietaire.md'],
  ['13. Jumeau de parcelle & Parcelles à risque','13_jumeau_parcelle.md'],
];

const fileToTitle = {};
SECTIONS.forEach(([t, f]) => fileToTitle[f] = t);

function renderToc(activeFile) {
  document.getElementById('toc').innerHTML = SECTIONS.map(([title, file]) =>
    `<a onclick="loadSection('${file}')" class="${file === activeFile ? 'active' : ''}">${title}</a>`
  ).join('');
}

async function loadSection(file) {
  renderToc(file);
  const el = document.getElementById('content');
  el.innerHTML = '<p>Chargement…</p>';
  try {
    const res = await fetch('guide/' + file, { cache: 'no-store' });
    if (!res.ok) throw new Error('introuvable');
    const md = await res.text();
    el.innerHTML = marked.parse(md);
    // Intercepter les liens internes vers d'autres fiches .md
    el.querySelectorAll('a[href$=".md"]').forEach(a => {
      const f = a.getAttribute('href').split('/').pop();
      if (fileToTitle[f]) {
        a.addEventListener('click', (e) => { e.preventDefault(); loadSection(f); window.scrollTo(0,0); });
      }
    });
    el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    try { localStorage.setItem('avp_guide_last', file); } catch (_) {}
  } catch (e) {
    el.innerHTML = '<p style="color:var(--high)">Impossible de charger cette fiche. Réessayez (Ctrl+F5).</p>';
  }
}

// Ouvre la dernière fiche lue, sinon le sommaire ; ou ?section=XX.md
const params = new URLSearchParams(location.search);
let start = params.get('section') || localStorage.getItem('avp_guide_last') || '00_INDEX.md';
if (!fileToTitle[start]) start = '00_INDEX.md';
loadSection(start);
</script>
</body>
</html>
