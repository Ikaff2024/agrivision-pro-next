<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgriVision Pro — Carte</title>
<script src="auth.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css">
<style>
.map-layout{display:flex;height:100%;flex:1;min-height:0;overflow:hidden}
.avp-main{overflow:hidden!important}

/* Sidebar panel */
.map-panel{width:300px;background:var(--surface);border-right:1px solid var(--border);
  display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
.map-panel-header{padding:18px 18px 14px;border-bottom:1px solid var(--border)}
.map-panel-title{font-family:'Fraunces',serif;font-size:16px;font-weight:700;margin-bottom:10px}

.risk-filter{display:flex;flex-direction:column;gap:6px}
.rfb{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;
  border:1px solid var(--border);cursor:pointer;transition:.15s;background:var(--surface);
  font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;text-align:left;width:100%}
.rfb:hover{background:var(--bg)}
.rfb.active{border-color:var(--accent);background:#f0faf5}
.rfb-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.rfb-count{margin-left:auto;font-family:'Fraunces',serif;font-size:14px;font-weight:700}

.plantation-list{flex:1;padding:10px 14px;overflow-y:auto}
.pl-item{padding:12px 10px;border-radius:8px;cursor:pointer;transition:.15s;
  border:1px solid transparent;margin-bottom:4px}
.pl-item:hover{background:var(--bg);border-color:var(--border-l)}
.pl-item.selected{background:#f0faf5;border-color:var(--accent)}
.pl-name{font-size:13.5px;font-weight:600;margin-bottom:3px}
.pl-meta{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.pl-score{font-family:'Fraunces',serif;font-size:15px;font-weight:700;margin-left:auto;flex-shrink:0}

/* Map container */
.map-container{flex:1;position:relative}
#map{width:100%;height:100%}

/* ── Layout mobile carte ─────────────────────────────────────────────────── */
@media(max-width:768px) {
  .avp-main{overflow:auto!important;height:auto!important}
  .map-layout{flex-direction:column;height:auto!important;overflow:visible!important}

  /* Panneau filtres + liste → affiché en haut, scrollable horizontalement */
  .map-panel{width:100%!important;border-right:none;border-bottom:1px solid var(--border);
    max-height:280px;flex-shrink:0}
  .map-panel-header{padding:12px 14px 10px}
  .risk-filter{flex-direction:row;flex-wrap:wrap;gap:6px}
  .rfb{padding:6px 10px;font-size:12px}
  .plantation-list{max-height:120px;overflow-y:auto}
  .pl-item{padding:8px}
  .stats-mini{padding:10px 14px;gap:8px}

  /* Carte → hauteur fixe sur mobile */
  .map-container{height:55vh!important;min-height:300px;flex-shrink:0}
  #map{height:100%!important}

  /* Toolbar délimitation → en bas de la carte */
  .boundary-toolbar{top:auto!important;bottom:60px!important;right:10px!important;
    left:10px!important;flex-direction:row!important;flex-wrap:wrap;gap:6px;
    justify-content:center}
  .boundary-btn{font-size:12px;padding:8px 12px;flex:1;min-width:120px;
    justify-content:center}

  /* Bouton délimiter → toujours visible */
  .map-panel .btn{font-size:12.5px;padding:10px}

  /* Légende → plus petite */
  .map-legend{bottom:10px;right:10px;padding:8px 10px;font-size:11px}
  .legend-title{font-size:10px}

  /* Info GPS */
  .boundary-info{bottom:10px;font-size:12px;padding:8px 14px}
}

/* Custom marker */
.marker-pin{width:32px;height:32px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);
  border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.25);display:flex;
  align-items:center;justify-content:center}
.marker-pin span{transform:rotate(45deg);font-size:13px}

/* Map popup */
.map-popup .popup-name{font-family:'Fraunces',serif;font-size:15px;font-weight:700;margin-bottom:6px}
.map-popup .popup-score{font-size:24px;font-family:'Fraunces',serif;font-weight:700}

.stats-mini{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:14px;border-top:1px solid var(--border)}
.stat-mini{background:var(--bg);border-radius:8px;padding:10px 12px;text-align:center}
.stat-mini-val{font-family:'Fraunces',serif;font-size:22px;font-weight:700}
.stat-mini-lbl{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:2px}

/* Module délimitation */
.boundary-toolbar{position:absolute;top:12px;left:50%;transform:translateX(-50%);
  display:flex;gap:8px;z-index:1000;background:var(--surface);
  border:1px solid var(--border);border-radius:10px;padding:8px;box-shadow:var(--sh)}
.tb-btn{display:flex;align-items:center;gap:6px;padding:7px 14px;border-radius:7px;
  border:1.5px solid var(--border);background:var(--surface);cursor:pointer;
  font-family:'DM Sans',sans-serif;font-size:12.5px;font-weight:600;
  color:var(--text);transition:.15s;white-space:nowrap}
.tb-btn:hover{border-color:var(--accent);background:#f0faf5}
.tb-btn.active{border-color:var(--accent);background:#f0faf5;color:var(--primary)}
.tb-btn.danger{border-color:var(--high);color:var(--high)}
.tb-btn.danger:hover{background:var(--high-bg)}
.tb-btn .ms{font-size:16px}
.boundary-info{position:absolute;bottom:70px;left:50%;transform:translateX(-50%);
  z-index:1000;background:var(--primary);color:#fff;padding:8px 16px;
  border-radius:99px;font-size:12.5px;font-weight:600;display:none;
  box-shadow:0 2px 12px rgba(0,0,0,.2)}
.gps-pulse{animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

.map-legend{position:absolute;bottom:20px;right:20px;background:var(--surface);
  border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;
  box-shadow:var(--sh);z-index:1000;font-size:12px}
.legend-title{font-weight:600;margin-bottom:8px;color:var(--muted);font-size:11px;
  text-transform:uppercase;letter-spacing:.05em}
.legend-row{display:flex;align-items:center;gap:8px;margin-bottom:5px;font-size:12.5px}
.legend-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}

/* ── Délimitation de parcelles ────────────────────────────────────────────── */
.boundary-toolbar{position:absolute;top:16px;right:16px;z-index:1000;
  display:flex;flex-direction:column;gap:8px}
.boundary-btn{display:flex;align-items:center;gap:8px;padding:9px 14px;
  border-radius:9px;border:1.5px solid var(--border);background:var(--surface);
  box-shadow:var(--sh);cursor:pointer;font-family:'DM Sans',sans-serif;
  font-size:13px;font-weight:600;color:var(--text);transition:.2s;white-space:nowrap}
.boundary-btn:hover{border-color:var(--accent);background:#f0faf5}
.boundary-btn.active{border-color:var(--accent);background:#f0faf5;color:var(--primary)}
.boundary-btn.danger{color:var(--high);border-color:var(--high-b)}
.boundary-btn.danger:hover{background:var(--high-bg)}
.boundary-btn .ms{font-size:16px}

.boundary-info{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);
  z-index:1000;background:var(--primary);color:#fff;padding:10px 18px;
  border-radius:99px;font-size:13px;font-weight:600;
  box-shadow:0 4px 12px rgba(26,42,24,.3);display:none;white-space:nowrap}

.gps-pulse{animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* Panel délimitation */
.boundary-panel{background:var(--surface-warm);border:1px solid var(--border-l);
  border-radius:var(--r);padding:14px;margin:10px 14px}
.boundary-panel-title{font-size:12px;font-weight:600;color:var(--muted);
  text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
.boundary-stat{display:flex;justify-content:space-between;align-items:center;
  font-size:13px;margin-bottom:6px}
.boundary-stat-val{font-family:'Fraunces',serif;font-size:16px;font-weight:700;color:var(--primary)}

/* ── Sélecteur plantation mobile (mode délimitation) ───────────────────── */
#mobile-plantation-picker {
  display:none;position:fixed;bottom:0;left:0;right:0;z-index:3000;
  background:var(--surface);border-radius:16px 16px 0 0;
  box-shadow:0 -4px 20px rgba(0,0,0,.15);
  padding:0 0 env(safe-area-inset-bottom,0);
  max-height:70vh;overflow:hidden;flex-direction:column;
}
#mobile-plantation-picker.open { display:flex; }
.picker-handle {width:36px;height:4px;background:var(--border);border-radius:99px;
  margin:10px auto 0;}
.picker-title {font-size:14px;font-weight:700;padding:10px 16px 8px;
  border-bottom:1px solid var(--border);color:var(--primary)}
.picker-list {overflow-y:auto;flex:1;padding:8px 12px 16px}
.picker-item {display:flex;align-items:center;gap:10px;padding:12px 10px;
  border-radius:8px;cursor:pointer;border:1px solid var(--border-l);margin-bottom:6px;
  background:var(--bg)}
.picker-item:active {background:#f0faf5;border-color:var(--accent)}
.picker-dot {width:10px;height:10px;border-radius:50%;flex-shrink:0}
.picker-name {font-size:14px;font-weight:600;flex:1}
.picker-score {font-family:'Fraunces',serif;font-size:16px;font-weight:700}

/* Mobile map layout fixes */
@media(max-width:768px) {
  .avp-main{overflow:auto!important;height:auto!important}
  .map-layout{flex-direction:column;height:auto!important;overflow:visible!important}
  .map-panel{width:100%!important;border-right:none;border-bottom:1px solid var(--border);
    max-height:none!important;flex-shrink:0}
  .map-panel-header{padding:10px 14px 8px}
  .map-panel-title{font-size:14px;margin-bottom:6px}
  .risk-filter{flex-direction:row;flex-wrap:wrap;gap:6px}
  .rfb{padding:6px 10px;font-size:12px}
  /* Liste cachée sur mobile — remplacée par le picker */
  .plantation-list{display:none!important}
  .stats-mini{padding:10px 14px;gap:8px}
  /* Carte */
  .map-container{height:52vh!important;min-height:280px;flex-shrink:0;position:relative!important}
  #map{height:100%!important;width:100%!important}
  /* Toolbar délimitation → barre fixe en bas */
  .boundary-toolbar{
    position:fixed!important;bottom:0!important;left:0!important;right:0!important;
    top:auto!important;transform:none!important;
    flex-direction:row!important;flex-wrap:wrap;gap:4px;
    justify-content:center;padding:8px 8px env(safe-area-inset-bottom,8px);
    background:var(--surface)!important;
    border-top:2px solid var(--accent);
    z-index:2000!important;box-shadow:0 -2px 10px rgba(0,0,0,.1)
  }
  .boundary-btn{font-size:12px;padding:8px 10px;flex:1;min-width:90px;
    justify-content:center;max-width:150px}
  .map-panel .btn{font-size:12.5px;padding:10px}
  .map-legend{bottom:10px;right:10px;padding:8px 10px;font-size:11px}
  .legend-title{font-size:10px}
  .boundary-info{bottom:70px!important;font-size:12px;padding:8px 14px}
}
</style>
</head>
<body>
<div class="avp-layout">
  <nav id="sidebar"></nav>
  <div class="avp-main" style="height:100vh;overflow:hidden;display:flex;flex-direction:column">

    <div class="avp-header" style="flex-shrink:0">
      <div>
        <div class="page-title">Carte des plantations</div>
        <div class="page-sub" id="map-sub">Chargement…</div>
      </div>
      <button class="btn btn-outline btn-sm" onclick="resetView()">
        <span class="material-symbols-outlined" style="font-size:16px">my_location</span>
        Recentrer
      </button>
    </div>

    <div class="map-layout" style="flex:1;min-height:0">
      <!-- Left panel -->
      <div class="map-panel">
        <div class="map-panel-header">
          <div class="map-panel-title">Filtres</div>
          <div class="risk-filter">
            <button class="rfb active" data-risk="all" onclick="setRisk('all',this)">
              <div class="rfb-dot" style="background:#1a4231"></div>
              Toutes
              <span class="rfb-count" id="cnt-all">—</span>
            </button>
            <button class="rfb" data-risk="LOW" onclick="setRisk('LOW',this)">
              <div class="rfb-dot" style="background:var(--low)"></div>
              Faible
              <span class="rfb-count" style="color:var(--low)" id="cnt-low">—</span>
            </button>
            <button class="rfb" data-risk="MEDIUM" onclick="setRisk('MEDIUM',this)">
              <div class="rfb-dot" style="background:var(--med)"></div>
              Moyen
              <span class="rfb-count" style="color:var(--med)" id="cnt-med">—</span>
            </button>
            <button class="rfb" data-risk="HIGH" onclick="setRisk('HIGH',this)">
              <div class="rfb-dot" style="background:var(--high)"></div>
              Élevé
              <span class="rfb-count" style="color:var(--high)" id="cnt-high">—</span>
            </button>
          </div>
        </div>

        <div class="plantation-list" id="plantation-list">
          <div style="color:var(--muted);font-size:13px;padding:20px 0;text-align:center">Chargement…</div>
        </div>

        <!-- Bouton délimitation -->
        <div style="padding:10px 14px;border-top:1px solid var(--border)">
          <button class="btn btn-outline btn-sm" style="width:100%;justify-content:center"
            onclick="toggleBoundaryMode()" id="btn-boundary">
            <span class="material-symbols-outlined" style="font-size:15px">polyline</span>
            Délimiter une parcelle
          </button>
        </div>

        <!-- Panel délimitation -->
        <div class="boundary-panel" id="boundary-panel" style="display:none">
          <div class="boundary-panel-title">🗺 Délimitation</div>
          <div class="boundary-stat">
            <span>Superficie calculée</span>
            <span class="boundary-stat-val" id="bp-area">—</span>
          </div>
          <div class="boundary-stat">
            <span>Points tracés</span>
            <span class="boundary-stat-val" id="bp-pts">—</span>
          </div>
          <div class="boundary-stat">
            <span>Méthode</span>
            <span style="font-size:12px;color:var(--muted)" id="bp-method">—</span>
          </div>
        </div>

        <div class="stats-mini" id="stats-mini">
          <div class="stat-mini">
            <div class="stat-mini-val" id="st-total">—</div>
            <div class="stat-mini-lbl">Total</div>
          </div>
          <div class="stat-mini">
            <div class="stat-mini-val" style="color:var(--high)" id="st-high">—</div>
            <div class="stat-mini-lbl">Élevé</div>
          </div>
        </div>
      </div>

      <!-- Map -->
      <div class="map-container">
        <div id="map"></div>

        <!-- Toolbar délimitation -->
        <div class="boundary-toolbar" id="boundary-toolbar" style="display:none">
          <button class="boundary-btn" id="btn-draw" onclick="startDraw()">
            <span class="material-symbols-outlined ms">edit_location</span>
            Dessiner les limites
          </button>
          <button class="boundary-btn" id="btn-gps" onclick="startGPS()">
            <span class="material-symbols-outlined ms">directions_walk</span>
            Tracer par GPS
          </button>
          <button class="boundary-btn" id="btn-save" onclick="saveBoundary()" style="display:none;background:var(--accent);color:#fff;border-color:var(--accent)">
            <span class="material-symbols-outlined ms">save</span>
            Enregistrer
          </button>
          <button class="boundary-btn danger" id="btn-clear" onclick="clearBoundary()" style="display:none">
            <span class="material-symbols-outlined ms">delete</span>
            Effacer
          </button>
        </div>

        <!-- Info bulle tracé GPS -->
        <div class="boundary-info" id="boundary-info">
          <span class="gps-pulse">📍</span>
          <span id="boundary-info-txt">Marchez autour de la parcelle...</span>
        </div>

        <div class="map-legend">
          <div class="legend-title">Niveau de risque</div>
          <div class="legend-row"><div class="legend-dot" style="background:var(--low)"></div>Faible</div>
          <div class="legend-row"><div class="legend-dot" style="background:var(--med)"></div>Moyen</div>
          <div class="legend-row"><div class="legend-dot" style="background:var(--high)"></div>Élevé</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
initApp('map');

// Lancer le chargement des données après initialisation
// Le délai permet au token JWT d'être disponible
setTimeout(load, 300);

let map, allData = [], markers = [], currentRisk = 'all';
let allPlantations = [];
let boundaryModeActive = false; // Défini globalement pour focusPlantation
const RC = { LOW:'#1a6b3a', MEDIUM:'#9a6200', HIGH:'#922b21' };
const RL = { LOW:'Faible', MEDIUM:'Moyen', HIGH:'Élevé' };

// Init map centered on Côte d'Ivoire
map = L.map('map', { zoomControl: true }).setView([6.8, -5.5], 7);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
  attribution: '© OpenStreetMap, © CARTO', maxZoom: 19
}).addTo(map);

function makeIcon(risk) {
  const color = RC[risk] || '#888';
  const svg = `<svg width="32" height="40" viewBox="0 0 32 40" xmlns="http://www.w3.org/2000/svg">
    <path d="M16 0C7.163 0 0 7.163 0 16c0 12 16 24 16 24s16-12 16-24C32 7.163 24.837 0 16 0z" fill="${color}"/>
    <circle cx="16" cy="16" r="7" fill="white" opacity="0.9"/>
  </svg>`;
  return L.divIcon({
    html: svg, className: '', iconSize: [32, 40], iconAnchor: [16, 40], popupAnchor: [0, -40]
  });
}

async function load() {
  try {
    const [r1, r2] = await Promise.all([
      authFetch('/map/plantations'),
      authFetch('/map/stats')
    ]);
    if (!r1?.ok) return;
    allData = await r1.json();

    if (r2?.ok) {
      const s = await r2.json();
      // cnt-all reflète ce qui est réellement affiché sur la carte (plantations avec diagnostic)
      // Les autres compteurs viennent des stats agrégées backend
      document.getElementById('cnt-low').textContent  = s.low_risk_plantations;
      document.getElementById('cnt-med').textContent  = s.medium_risk_plantations;
      document.getElementById('cnt-high').textContent = s.high_risk_plantations;
      document.getElementById('st-total').textContent = s.total_plantations;
      document.getElementById('st-high').textContent  = s.high_risk_plantations;
      document.getElementById('map-sub').textContent  =
        `${s.total_plantations} plantation${s.total_plantations>1?'s':''} · ${s.high_risk_plantations} à risque élevé`;
    }
    // cnt-all = plantations effectivement visibles sur la carte (ont un diagnostic)
    document.getElementById('cnt-all').textContent = allData.length;

    allPlantations = plantations;
    renderList();
    renderMarkers();
  } catch {}
}

function getFiltered() {
  return currentRisk === 'all' ? allData : allData.filter(p => p.risk_level === currentRisk);
}

function renderList() {
  const items = getFiltered();
  const el = document.getElementById('plantation-list');
  if (!items.length) {
    el.innerHTML = '<div style="color:var(--muted);font-size:13px;padding:20px 0;text-align:center">Aucune plantation</div>';
    return;
  }
  el.innerHTML = items.map(p => `
    <div class="pl-item" id="li-${p.id}" onclick="focusPlantation(${p.id})">
      <div style="display:flex;align-items:flex-start;gap:8px">
        <div style="width:10px;height:10px;border-radius:50%;background:${RC[p.risk_level]||'#888'};
          flex-shrink:0;margin-top:4px"></div>
        <div style="flex:1;min-width:0">
          <div class="pl-name">${esc(p.name)}</div>
          <div class="pl-meta">
            <span>${RL[p.risk_level]||p.risk_level}</span>
            ${p.score != null ? `<span>·</span><span>${Math.round(p.score)} pts</span>` : ''}
          </div>
        </div>
        ${p.score != null ? `<div class="pl-score" style="color:${RC[p.risk_level]||'#888'}">${Math.round(p.score)}</div>` : ''}
      </div>
    </div>`).join('');
}

function renderMarkers() {
  markers.forEach(m => map.removeLayer(m));
  markers = [];

  const items = getFiltered().filter(p => p.latitude != null && p.longitude != null);

  items.forEach(p => {
    const m = L.marker([p.latitude, p.longitude], { icon: makeIcon(p.risk_level) }).addTo(map);
    m.bindPopup(`
      <div class="map-popup" style="font-family:'DM Sans',sans-serif;min-width:180px">
        <div class="popup-name">${esc(p.name)}</div>
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
          <span class="popup-score" style="color:${RC[p.risk_level]||'#888'}">${p.score!=null?Math.round(p.score):'—'}</span>
          <span style="font-size:12px;background:${RC[p.risk_level]||'#888'}20;color:${RC[p.risk_level]||'#888'};
            padding:2px 8px;border-radius:99px;font-weight:600">${RL[p.risk_level]||p.risk_level}</span>
        </div>
        <a href="plantation_detail.html?id=${p.id}"
          style="font-size:12.5px;color:#1a4231;font-weight:600;text-decoration:none">
          Voir le détail →
        </a>
      </div>`, { maxWidth: 240 });
    m._plantationId = p.id;
    markers.push(m);
  });

  if (items.length) {
    const group = L.featureGroup(markers);
    map.fitBounds(group.getBounds().pad(0.15));
  }
}

function focusPlantation(id) {
  document.querySelectorAll('.pl-item').forEach(el => el.classList.remove('selected'));
  const li = document.getElementById('li-'+id);
  if (li) li.classList.add('selected');
  const m = markers.find(mk => mk._plantationId === id);
  if (m) { map.setView(m.getLatLng(), 13); m.openPopup(); }
  // Si mode délimitation actif, sélectionner la plantation
  if (boundaryModeActive) selectPlantationForBoundary(id);
}

function setRisk(risk, btn) {
  currentRisk = risk;
  document.querySelectorAll('.rfb').forEach(b => b.classList.toggle('active', b.dataset.risk === risk));
  renderList();
  renderMarkers();
}

function resetView() {
  if (markers.length) {
    const group = L.featureGroup(markers);
    map.fitBounds(group.getBounds().pad(0.15));
  } else {
    map.setView([6.8, -5.5], 7);
  }
}

function esc(s) { const el=document.createElement('div'); el.textContent=s||''; return el.innerHTML; }

// ════════════════════════════════════════════════════════════════════════════
// ── Module Délimitation de parcelles ────────────════════════════════════════
// ════════════════════════════════════════════════════════════════════════════

function toggleBoundaryMode() {
  boundaryModeActive = !boundaryModeActive;
  const toolbar = document.getElementById('boundary-toolbar');
  const btn = document.getElementById('btn-boundary');
  if (boundaryModeActive) {
    toolbar.style.display = 'flex';
    btn.style.background = 'var(--accent)';
    btn.style.color = '#fff';
    btn.style.borderColor = 'var(--accent)';
    // Mobile : afficher le picker de plantation
    if (window.innerWidth <= 768) {
      showMobilePlantationPicker();
    } else {
      toast('Selectionnez une plantation pour delimiter ses limites.');
    }
  } else {
    toolbar.style.display = 'none';
    btn.style.background = '';
    btn.style.color = '';
    btn.style.borderColor = '';
    hideMobilePlantationPicker();
    clearBoundary();
  }
}

function showMobilePlantationPicker() {
  const picker = document.getElementById('mobile-plantation-picker');
  const list = document.getElementById('picker-list');
  const RC = {'LOW':'#52b788','MEDIUM':'#e9c46a','HIGH':'#e76f51'};
  // Remplir la liste
  list.innerHTML = allPlantations.length === 0
    ? '<div style="text-align:center;padding:20px;color:var(--muted)">Aucune plantation disponible</div>'
    : allPlantations.map(p => {
        const color = RC[p.risk_level] || '#888';
        return '<div class="picker-item" onclick="pickPlantationMobile(' + p.id + ')">'
          + '<div class="picker-dot" style="background:' + color + '"></div>'
          + '<div class="picker-name">' + (p.name || 'Plantation') + '</div>'
          + (p.score != null ? '<div class="picker-score" style="color:' + color + '">' + Math.round(p.score) + '</div>' : '')
          + '</div>';
      }).join('');
  picker.classList.add('open');
}

function hideMobilePlantationPicker() {
  document.getElementById('mobile-plantation-picker').classList.remove('open');
}

function pickPlantationMobile(id) {
  hideMobilePlantationPicker();
  selectPlantationForBoundary(id);
  // Scroller vers la carte
  document.querySelector('.map-container').scrollIntoView({behavior:'smooth'});
  focusPlantation(id);
}

let drawnItems = new L.FeatureGroup();
let drawControl = null;
let currentBoundaryLayer = null;
let selectedPlantationId = null;
let gpsWatchId = null;
let gpsPoints = [];
let gpsPolyline = null;
let drawMode = null; // 'manual' | 'gps'

map.addLayer(drawnItems);
if (window.innerWidth <= 768) {
  setTimeout(function() { map.invalidateSize(); }, 400);
  window.addEventListener('resize', function() { map.invalidateSize(); });
}

// Initialiser les outils de dessin Leaflet.draw
function initDrawControl() {
  if (drawControl) map.removeControl(drawControl);
  drawControl = new L.Control.Draw({
    draw: {
      polygon: {
        allowIntersection: false,
        showArea: true,
        shapeOptions: { color: '#52b788', fillOpacity: 0.15, weight: 2 }
      },
      polyline: false, rectangle: false, circle: false,
      circlemarker: false, marker: false
    },
    edit: { featureGroup: drawnItems }
  });
}

// Écouter la fin du dessin
map.on('draw:created', function(e) {
  drawnItems.clearLayers();
  currentBoundaryLayer = e.layer;
  drawnItems.addLayer(currentBoundaryLayer);
  drawMode = 'manual';

  const coords = currentBoundaryLayer.getLatLngs()[0];
  document.getElementById('bp-pts').textContent = coords.length + ' points';
  document.getElementById('bp-method').textContent = 'Dessin manuel';
  updateSaveBtn(true);
});

function selectPlantationForBoundary(pid) {
  selectedPlantationId = pid;

  // Réinitialiser les layers sans perdre selectedPlantationId
  drawnItems.clearLayers();
  currentBoundaryLayer = null;
  drawMode = null;
  gpsPoints = [];
  if (gpsPolyline) { map.removeLayer(gpsPolyline); gpsPolyline = null; }
  if (drawControl) { map.removeControl(drawControl); drawControl = null; }
  document.getElementById('btn-draw').classList.remove('active');
  document.getElementById('btn-save').style.display = 'none';
  document.getElementById('btn-clear').style.display = 'none';
  document.getElementById('boundary-panel').style.display = 'none';

  // Afficher la toolbar
  document.getElementById('boundary-toolbar').style.display = 'flex';

  // Feedback visuel
  toast('Plantation selectionnee. Cliquez Dessiner ou Trace GPS.');

  // Charger la délimitation existante si elle existe
  loadExistingBoundary(pid);
}

async function loadExistingBoundary(pid) {
  try {
    const r = await authFetch('/plantations/' + pid + '/boundary');
    if (!r?.ok) return;
    const data = await r.json();
    if (!data.has_boundary) return;

    // Afficher la délimitation existante
    const geo = JSON.parse(data.geojson);
    const layer = L.geoJSON(geo, {
      style: { color: '#1a4231', fillOpacity: 0.1, weight: 2, dashArray: '5,5' }
    }).addTo(drawnItems);
    currentBoundaryLayer = layer;

    // Mettre à jour le panel
    document.getElementById('boundary-panel').style.display = '';
    document.getElementById('bp-area').textContent = data.area_hectares + ' ha';
    document.getElementById('bp-pts').textContent = data.points_count + ' points';
    document.getElementById('bp-method').textContent =
      data.method === 'gps_track' ? 'Tracé GPS' : 'Dessin manuel';
    updateSaveBtn(false);
  } catch {}
}

function startDraw() {
  if (!selectedPlantationId) { toast("Selectionnez une plantation.", "error"); return; }
  initDrawControl();
  map.addControl(drawControl);
  document.getElementById('btn-draw').classList.add('active');
  document.getElementById('btn-clear').style.display = 'flex';
  toast("Cliquez sur la carte pour dessiner. Double-clic pour terminer.");
}

// ── Tracé GPS ─────────────────────────────────────────────────────────────────
function startGPS() {
  if (!selectedPlantationId) { toast("Selectionnez une plantation.", "error"); return; }
  if (!navigator.geolocation) { toast("GPS non disponible sur cet appareil.", "error"); return; }

  gpsPoints = [];
  drawMode = 'gps';
  document.getElementById('btn-gps').classList.add('active');
  document.getElementById('btn-clear').style.display = 'flex';
  document.getElementById('boundary-info').style.display = 'block';
  document.getElementById('boundary-info-txt').textContent = 'Marchez autour de la parcelle... 0 points';

  gpsWatchId = navigator.geolocation.watchPosition(
    function(pos) {
      const pt = [pos.coords.latitude, pos.coords.longitude];
      gpsPoints.push(pt);

      // Dessiner la trajectoire en temps réel
      if (gpsPolyline) map.removeLayer(gpsPolyline);
      gpsPolyline = L.polyline(gpsPoints, { color: '#52b788', weight: 3 }).addTo(map);
      map.setView(pt, 16);

      document.getElementById('boundary-info-txt').textContent = 'Marchez autour de la parcelle... ' + gpsPoints.length + ' points captures';

      // Proposer d\'arrêter après 10 points
      if (gpsPoints.length >= 10) {
        document.getElementById('btn-save').style.display = 'flex';
        document.getElementById('boundary-info-txt').textContent = gpsPoints.length + ' points - Cliquez Enregistrer pour finaliser';
      }
    },
    function(err) { toast("Erreur GPS : " + err.message, "error"); stopGPS(); },
    { enableHighAccuracy: true, maximumAge: 2000, timeout: 10000 }
  );

  toast("GPS active - marchez autour de votre parcelle.");
}

function stopGPS() {
  if (gpsWatchId) {
    navigator.geolocation.clearWatch(gpsWatchId);
    gpsWatchId = null;
  }
  document.getElementById('boundary-info').style.display = 'none';
  document.getElementById('btn-gps').classList.remove('active');
}

// ── Sauvegarder ───────────────────────────────────────────────────────────────
async function saveBoundary() {
  if (!selectedPlantationId) return;

  let geojson;

  if (drawMode === 'gps' && gpsPoints.length >= 3) {
    stopGPS();
    // Fermer le polygone GPS
    const closedPts = [...gpsPoints, gpsPoints[0]];
    const coords = closedPts.map(p => [p[1], p[0]]); // [lng, lat]
    geojson = JSON.stringify({
      type: 'Polygon',
      coordinates: [coords]
    });
    if (gpsPolyline) { map.removeLayer(gpsPolyline); gpsPolyline = null; }
  } else if (currentBoundaryLayer && drawMode === 'manual') {
    geojson = JSON.stringify(currentBoundaryLayer.toGeoJSON().geometry);
  } else {
    toast("Tracez les limites de la parcelle.", "error");
    return;
  }

  try {
    const r = await authFetch('/plantations/' + selectedPlantationId + '/boundary', {
      method: 'POST',
      body: JSON.stringify({ geojson, method: drawMode === 'gps' ? 'gps_track' : 'manual' })
    });
    if (!r?.ok) { const e = await r.json().catch(()=>({})); throw new Error(e.detail||'Erreur.'); }
    const data = await r.json();

    toast('Délimitation sauvegardée — ' + data.area_hectares + ' ha calculés.');
    document.getElementById('boundary-panel').style.display = '';
    document.getElementById('bp-area').textContent = data.area_hectares + ' ha';
    document.getElementById('bp-pts').textContent = data.points_count + ' points';
    document.getElementById('bp-method').textContent = drawMode === 'gps' ? 'Tracé GPS' : 'Dessin manuel';

    // Si pas d\'hectares sur la plantation → afficher le nouveau calcul
    updateSaveBtn(false);
  } catch(e) { toast(e.message, 'error'); }
}

function clearBoundary() {
  drawnItems.clearLayers();
  currentBoundaryLayer = null;
  drawMode = null;
  gpsPoints = [];
  if (gpsPolyline) { map.removeLayer(gpsPolyline); gpsPolyline = null; }
  stopGPS();
  if (drawControl) { map.removeControl(drawControl); drawControl = null; }
  document.getElementById('btn-draw').classList.remove('active');
  document.getElementById('btn-save').style.display = 'none';
  document.getElementById('btn-clear').style.display = 'none';
  document.getElementById('boundary-panel').style.display = 'none';
}

function updateSaveBtn(show) {
  document.getElementById('btn-save').style.display = show ? 'flex' : 'none';
}


// Les limites sont chargées à la demande quand on clique sur une plantation
</script>

    <div class="picker-handle"></div>
    <div class="picker-title">🗺 Choisir une plantation à délimiter</div>
    <div class="picker-list" id="picker-list"></div>
  </div>
</body>
