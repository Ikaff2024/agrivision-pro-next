<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1a4231">
<title>AgriVision Pro — Plantations</title>
<script src="avp-offline.js"></script>
    <!-- Polices de marque : préchargées tôt (évite le flash de typographie au chargement) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" data-avp-fonts href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,700&family=DM+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block">
<script src="auth.js?v=ssrte1"></script>
<style>
.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.search-wrap{position:relative;flex:1;min-width:200px;max-width:340px}
.search-wrap .ms{position:absolute;left:12px;top:50%;transform:translateY(-50%);
  font-size:18px;color:var(--faint);pointer-events:none}
.search-input{width:100%;padding:9px 12px 9px 38px;border:1.5px solid var(--border);
  border-radius:var(--r);font-size:13.5px;color:var(--text);background:var(--surface);
  outline:none;font-family:'DM Sans',sans-serif;transition:.15s}
.search-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(82,183,136,.12)}
.search-input::placeholder{color:var(--faint)}

.filter-tabs{display:flex;gap:0;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--surface)}
.ftab{padding:8px 14px;font-size:13px;font-weight:500;cursor:pointer;border:none;
  background:transparent;font-family:'DM Sans',sans-serif;color:var(--muted);transition:.15s}
.ftab:hover{background:var(--bg)}
.ftab.active{background:var(--primary);color:#fff}
.filter-select{padding:8px 12px;border:1.5px solid var(--border);border-radius:8px;
  background:var(--surface);font-family:'DM Sans',sans-serif;font-size:13px;color:var(--text);
  outline:none;min-width:190px}
.filter-select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(82,183,136,.12)}

.plantation-name{display:flex;align-items:center;gap:10px}
.p-avatar{width:34px;height:34px;border-radius:9px;background:var(--bg);
  display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.p-name{font-size:14px;font-weight:600}
.p-owner{font-size:12px;color:var(--muted);margin-top:1px}

.score-pill{display:flex;align-items:center;gap:8px}
.score-pill-bar{width:52px;height:6px;background:var(--border-l);border-radius:99px;overflow:hidden}
.score-pill-fill{height:100%;border-radius:99px}
.score-num{font-family:'Fraunces',serif;font-size:14px;font-weight:700;min-width:26px}

.action-btns{display:flex;gap:4px;justify-content:flex-end;opacity:0;transition:.15s}
tr:hover .action-btns{opacity:1}
@media(max-width:768px){
  table{min-width:0!important}
  .action-btns{opacity:1!important}
  th.mob-hide,td.mob-hide{display:none!important}
  .search-wrap{max-width:100%!important;min-width:0!important}
  .toolbar{gap:8px}
  .filter-tabs .ftab{padding:6px 8px!important;font-size:11.5px!important}
  .btn.btn-primary{padding:7px 10px!important;font-size:12px!important}
  .score-pill-bar{width:36px!important}
}
.act-btn{width:30px;height:30px;border-radius:7px;border:1px solid var(--border);
  background:var(--surface);cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:16px;transition:.15s;font-family:'DM Sans',sans-serif}
.act-btn:hover{border-color:var(--accent);background:#f0faf5}

.empty-state{text-align:center;padding:64px 20px;color:var(--muted)}
.empty-icon{font-size:52px;opacity:.18;margin-bottom:14px}
.pagination{display:flex;align-items:center;justify-content:space-between;
  padding:12px 16px;border-top:1px solid var(--border);background:var(--surface-warm)}
.pag-info{font-size:12.5px;color:var(--muted)}
.pag-btns{display:flex;gap:6px}

.modal-overlay{position:fixed;inset:0;background:rgba(12,32,24,.55);
  display:flex;align-items:center;justify-content:center;z-index:900;padding:20px;display:none}
.modal{background:var(--surface);border-radius:var(--rl);padding:28px;
  width:100%;max-width:520px;box-shadow:var(--sh-md);animation:modalIn .2s ease}
@keyframes modalIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.modal-title{font-family:'Fraunces',serif;font-size:20px;font-weight:700;margin-bottom:20px}
.form-row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal-footer{display:flex;justify-content:flex-end;gap:10px;margin-top:22px;
  padding-top:16px;border-top:1px solid var(--border)}
</style>
</head>
<body>
<div class="avp-layout">
  <nav id="sidebar"></nav>
  <div class="avp-main">

    <div class="avp-header">
      <div>
        <div class="page-title">Plantations</div>
        <div class="page-sub" id="count-sub">Chargement…</div>
      </div>
      <button class="btn btn-primary" id="add-btn" onclick="openModal()" style="display:none">
        <span class="material-symbols-outlined" style="font-size:18px">add</span>
        Nouvelle plantation
      </button>
    </div>

    <div class="avp-content">
      <div class="toolbar">
        <div class="search-wrap">
          <span class="material-symbols-outlined ms">search</span>
          <input class="search-input" id="search" placeholder="Nom, région, propriétaire…" oninput="filterRows()">
        </div>
        <div class="filter-tabs">
          <button class="ftab active" data-filter="all" onclick="setFilter('all',this)">Toutes</button>
          <button class="ftab" data-filter="LOW" onclick="setFilter('LOW',this)">Faible</button>
          <button class="ftab" data-filter="MEDIUM" onclick="setFilter('MEDIUM',this)">Moyen</button>
          <button class="ftab" data-filter="HIGH" onclick="setFilter('HIGH',this)">Élevé</button>
        </div>
        <select class="filter-select" id="assignment-filter" onchange="setAssignmentFilter(this.value)" style="display:none"></select>
        <select class="filter-select" id="cert-filter" onchange="setCertFilter(this.value)" style="display:none" title="Filtrer par certification"></select>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Plantation</th>
              <th class="mob-hide">Région</th>
              <th class="mob-hide">Superficie</th>
              <th>Score</th>
              <th>Risque</th>
              <th class="mob-hide">EUDR</th>
              <th style="text-align:right">Actions</th>
            </tr>
          </thead>
          <tbody id="tbody">
            <tr><td colspan="6" style="text-align:center;padding:48px;color:var(--muted)">Chargement…</td></tr>
          </tbody>
        </table>
        <div class="pagination" id="pagination" style="display:none">
          <span class="pag-info" id="pag-info"></span>
          <div class="pag-btns">
            <button class="btn btn-outline btn-sm" id="pag-prev" onclick="changePage(-1)">← Précédent</button>
            <button class="btn btn-outline btn-sm" id="pag-next" onclick="changePage(1)">Suivant →</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Modal création -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-title">Nouvelle plantation</div>
    <div class="form-row2">
      <div class="form-group"><label class="form-label">Nom *</label><input class="form-input" id="m-name" placeholder="Plantation Soubré"></div>
      <div class="form-group"><label class="form-label">Propriétaire *</label><input class="form-input" id="m-owner" placeholder="Konan Kouassi"></div>
    </div>
    <div class="form-row2">
      <div class="form-group"><label class="form-label">Pays</label>
        <select class="form-input" id="m-country">
          <option>Côte d'Ivoire</option><option>Ghana</option><option>Cameroun</option><option>Nigeria</option>
        </select>
      </div>
      <div class="form-group"><label class="form-label">Région</label><input class="form-input" id="m-region" placeholder="Soubré"></div>
    </div>
    <div class="form-row2">
      <div class="form-group"><label class="form-label">Latitude</label><input class="form-input" id="m-lat" type="number" step="any" placeholder="5.78"></div>
      <div class="form-group"><label class="form-label">Longitude</label><input class="form-input" id="m-lng" type="number" step="any" placeholder="-6.59"></div>
    </div>
    <button type="button" class="btn btn-outline" id="geo-btn" onclick="grabGPS()"
      style="width:100%;justify-content:center;margin-bottom:4px">
      <span class="material-symbols-outlined" style="font-size:16px">my_location</span>
      <span id="geo-txt">Utiliser ma position GPS</span>
    </button>
    <div id="geo-err" style="font-size:12px;color:var(--high);display:none;margin-bottom:4px"></div>
    <div class="form-group"><label class="form-label">Superficie (ha)</label><input class="form-input" id="m-ha" type="number" step="any" placeholder="4.5"></div>
    <div id="m-err" style="color:var(--high);font-size:13px;margin-top:8px;display:none"></div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal()">Annuler</button>
      <button class="btn btn-primary" id="m-btn" onclick="createPlantation()">Créer</button>
    </div>
  </div>
</div>

<script>
initApp('plantations');

// Afficher le bouton création uniquement pour les admins
let allPlantations = [];
let mapData = {};
let currentFilter = 'all';
let assignmentFilter = 'all';
let certFilter = '';
let page = 0;
const PAGE_SIZE = 15;
const PLANTATION_LIST_ENDPOINT = '/plantations?limit=5000';
const PARAMS = new URLSearchParams(location.search);
const PRODUCER_FILTER_ID = PARAMS.get('producer_id');
const CURRENT_USER = typeof getCurrentUser === 'function' ? getCurrentUser() : null;
const CURRENT_ROLE = CURRENT_USER?.role || '';

function canCreatePlantation() {
  return CURRENT_ROLE === 'admin';
}

function initCreateButton() {
  const btn = document.getElementById('add-btn');
  if (!btn) return;
  btn.classList.remove('btn-outline', 'btn-primary');
  if (canCreatePlantation()) {
    btn.style.display = '';
    btn.classList.add('btn-primary');
    btn.innerHTML = '<span class="material-symbols-outlined ms">add</span>Nouvelle plantation';
    btn.onclick = openModal;
    btn.title = 'Creer une nouvelle plantation';
  } else if (!CURRENT_USER) {
    btn.style.display = '';
    btn.classList.add('btn-outline');
    btn.innerHTML = '<span class="material-symbols-outlined ms">login</span>Connexion admin';
    btn.onclick = () => { location.href = 'login.html'; };
    btn.title = 'Se connecter avec un compte admin';
  } else {
    btn.style.display = 'none';
  }
}

function initAssignmentFilter() {
  const select = document.getElementById('assignment-filter');
  if (!select) return;
  if (CURRENT_ROLE === 'technician') {
    select.innerHTML = `
      <option value="all">Mes plantations accessibles</option>
      <option value="mine">Mes plantations attribuees</option>`;
    select.style.display = '';
    return;
  }
  if (CURRENT_ROLE === 'admin' || CURRENT_ROLE === 'agronomist') {
    select.innerHTML = '<option value="all">Tous les techniciens</option>';
    authFetch('/plantations/filters-options')
      .then(r => r?.ok ? r.json() : null)
      .then(opts => {
        (opts?.technicians || []).forEach(t => {
          const option = document.createElement('option');
          option.value = 'tech:' + t.id;
          option.textContent = t.email;
          select.appendChild(option);
        });
        select.style.display = (opts?.technicians || []).length ? '' : 'none';
      })
      .catch(() => {});
  }
}

function setAssignmentFilter(value) {
  assignmentFilter = value || 'all';
  page = 0;
  load();
}

function setCertFilter(value) {
  certFilter = value || '';
  page = 0;
  load();
}

// Peuple le filtre certification avec les certifs réellement présentes dans la coop.
function initCertFilter() {
  const sel = document.getElementById('cert-filter');
  if (!sel) return;
  authFetch('/plantations/filters-options')
    .then(r => r?.ok ? r.json() : null)
    .then(opts => {
      const certs = (opts && opts.certifications) || [];
      if (!certs.length) { sel.style.display = 'none'; return; }
      sel.innerHTML = '<option value="">Toutes certifications</option>' +
        certs.map(c => `<option value="${c}">${c}</option>`).join('');
      sel.style.display = '';
    })
    .catch(() => {});
}

function plantationEndpoint() {
  const producerFilter = PRODUCER_FILTER_ID ? '&producer_id=' + encodeURIComponent(PRODUCER_FILTER_ID) : '';
  const certParam = certFilter ? '&certification=' + encodeURIComponent(certFilter) : '';
  if (assignmentFilter === 'mine') return PLANTATION_LIST_ENDPOINT + '&assigned_to_me=true' + producerFilter + certParam;
  if (assignmentFilter.startsWith('tech:')) {
    return PLANTATION_LIST_ENDPOINT + '&technician_id=' + encodeURIComponent(assignmentFilter.slice(5)) + producerFilter + certParam;
  }
  return PLANTATION_LIST_ENDPOINT + producerFilter + certParam;
}

// Sprint Offline V1.6 - Phase 2 : Stale-While-Revalidate sur les lectures
async function load() {
  const endpoint = plantationEndpoint();
  // 1. Affichage instantane depuis le cache IndexedDB (si dispo)
  const [cachedP, cachedM] = await Promise.all([
    AVPOffline.cacheGet(endpoint),
    AVPOffline.cacheGet('/map/plantations'),
  ]);
  let hasCachedData = false;
  if (cachedP) {
    allPlantations = cachedP;
    if (cachedM) cachedM.forEach(p => { mapData[p.id] = p; });
    updatePlantationCount();
    render();
    hasCachedData = true;
  }

  // 2. Refresh reseau en arriere-plan (peut echouer si offline)
  try {
    const [r1, r2] = await Promise.all([
      authFetch(endpoint),
      authFetch('/map/plantations')
    ]);
    if (r1?.ok) {
      const data = await r1.json();
      allPlantations = data;
      AVPOffline.cacheSet(endpoint, data);
    }
    if (r2?.ok) {
      const md = await r2.json();
      md.forEach(p => { mapData[p.id] = p; });
      AVPOffline.cacheSet('/map/plantations', md);
    }
    updatePlantationCount();
    render();
  } catch {
    // Echec reseau (probablement offline)
    if (!hasCachedData) {
      // Aucun cache et pas de reseau : afficher empty state explicite
      const tb = document.getElementById('tbody');
      if (tb) {
        tb.innerHTML = '<tr><td colspan="6">' +
          '<div class="empty-state">' +
          '<div class="empty-icon">📡</div>' +
          '<div style="font-size:15px;font-weight:600;margin-bottom:8px">Aucune donnée disponible hors ligne</div>' +
          '<div style="font-size:13px">Reconnectez-vous puis rechargez la page pour synchroniser vos plantations.</div>' +
          '</div></td></tr>';
      }
      const sub = document.getElementById('count-sub');
      if (sub) sub.textContent = 'Hors ligne — données non disponibles';
    }
    // Si on avait du cache, on garde simplement l'affichage cache (rien a faire)
  }
}

function updatePlantationCount() {
  const n = allPlantations.length;
  const el = document.getElementById('count-sub');
  if (el) {
    el.textContent = n + ' plantation' + (n > 1 ? 's' : '') + ' enregistrée' + (n > 1 ? 's' : '');
  }
}

function getFiltered() {
  const q = document.getElementById('search').value.toLowerCase();
  return allPlantations.filter(p => {
    const md = mapData[p.id];
    const risk = md?.risk_level || '';
    if (currentFilter !== 'all' && risk !== currentFilter) return false;
    if (q && !`${p.name} ${p.region||''} ${p.owner_name}`.toLowerCase().includes(q)) return false;
    return true;
  });
}

function render() {
  const filtered = getFiltered();
  const start = page * PAGE_SIZE;
  const slice = filtered.slice(start, start + PAGE_SIZE);
  const tb = document.getElementById('tbody');

  if (!filtered.length) {
    tb.innerHTML = `<tr><td colspan="6">
      <div class="empty-state">
        <div class="empty-icon">🌱</div>
        <div style="font-size:15px;font-weight:600;margin-bottom:8px">Aucune plantation trouvée</div>
        <div style="font-size:13px">Créez votre première plantation ou modifiez les filtres.</div>
      </div></td></tr>`;
    document.getElementById('pagination').style.display = 'none';
    return;
  }

  tb.innerHTML = slice.map(p => {
    const md = mapData[p.id];
    const score = md?.score;
    const risk  = md?.risk_level;
    return `<tr>
      <td>
        <div class="plantation-name">
          <div class="p-avatar">🌱</div>
          <div>
            <div class="p-name">${esc(p.name)}</div>
            <div class="p-owner">${esc(p.owner_name)}</div>
          </div>
        </div>
      </td>
      <td class="mob-hide" style="color:var(--muted)">${esc(p.region || p.country || '—')}</td>
      <td class="mob-hide" style="color:var(--muted)">${p.hectares != null ? p.hectares + ' ha' : '—'}</td>
      <td>${score != null ? `
        <div class="score-pill">
          <div class="score-pill-bar"><div class="score-pill-fill" style="width:${score}%;background:${scoreColor(score)}"></div></div>
          <span class="score-num" style="color:${scoreColor(score)}">${Math.round(score)}</span>
        </div>` : '<span style="color:var(--faint)">—</span>'}
      </td>
      <td>${risk ? riskBadge(risk) : '<span style="color:var(--faint);font-size:12px">Non diagnostiqué</span>'}</td>
      <td class="mob-hide" id="eudr-cell-${p.id}"><span style="color:var(--faint);font-size:12px">…</span></td>
      <td style="text-align:right">
        <div class="action-btns">
          <button class="act-btn" onclick="viewDetail(${p.id})" title="Voir détail">
            <span class="material-symbols-outlined" style="font-size:15px">visibility</span>
          </button>
          <button class="act-btn" onclick="goDiag(${p.id})" title="Lancer un diagnostic">
            <span class="material-symbols-outlined" style="font-size:15px">biotech</span>
          </button>
          ${p.producer_id ? `<button class="act-btn" onclick="goProducer(${p.producer_id})" title="Fiche producteur">
            <span class="material-symbols-outlined" style="font-size:15px">person</span>
          </button>` : ''}
          <button class="act-btn" onclick="goSsrteVisit(${p.id})" title="Fiche C SSRTE">
            <span class="material-symbols-outlined" style="font-size:15px">clinical_notes</span>
          </button>
        </div>
      </td>
    </tr>`;
  }).join('');

  // Pagination
  const pag = document.getElementById('pagination');
  if (filtered.length > PAGE_SIZE) {
    pag.style.display = 'flex';
    document.getElementById('pag-info').textContent = `${start+1}–${Math.min(start+PAGE_SIZE, filtered.length)} sur ${filtered.length}`;
    document.getElementById('pag-prev').disabled = page === 0;
    document.getElementById('pag-next').disabled = start + PAGE_SIZE >= filtered.length;
  } else {
    pag.style.display = 'none';
  }

  // EUDR-01a : charger les statuts en batch et injecter dans les cellules
  loadEudrBadges(slice);
}

async function loadEudrBadges(plantations) {
  try {
    const r = await authFetch('/eudr/plantations?limit=1000');
    if (!r || !r.ok) return;
    const data = await r.json();
    const byId = {};
    for (const item of (data.plantations || [])) {
      byId[item.id] = item;
    }
    const LABELS = { conforme: 'Conforme', a_verifier: 'A verifier', non_conforme: 'Non conforme' };
    const CLS = { conforme: 'badge-low', a_verifier: 'badge-med', non_conforme: 'badge-high' };
    for (const p of plantations) {
      const cell = document.getElementById('eudr-cell-' + p.id);
      if (!cell) continue;
      const e = byId[p.id];
      if (!e) {
        cell.innerHTML = '<span style="color:var(--faint);font-size:12px">—</span>';
        continue;
      }
      const cls = CLS[e.eudr_status] || 'badge-med';
      cell.innerHTML = '<span class="badge ' + cls + '" title="Score ' + e.eudr_score + '/' + e.eudr_max + '">' +
        LABELS[e.eudr_status] + '</span>';
    }
  } catch (_) { /* silent */ }
}

function filterRows() { page = 0; render(); }
function setFilter(f, el) {
  currentFilter = f;
  document.querySelectorAll('.ftab').forEach(t => t.classList.toggle('active', t.dataset.filter === f));
  page = 0; render();
}
function changePage(d) { page += d; render(); }
function esc(s) { const el = document.createElement('div'); el.textContent = s||''; return el.innerHTML; }
function viewDetail(id) { location.href = `plantation_detail.html?id=${id}`; }
function goDiag(id)     { location.href = `diagnostic.html?id=${id}`; }
function goProducer(id) { location.href = `producer_profile.html?id=${id}`; }
function goSsrteVisit(id) { location.href = `ssrte.html?tab=visit&plantation_id=${id}`; }

function openModal()  {
  if (!canCreatePlantation()) {
    toast(CURRENT_USER ? 'Creation reservee aux administrateurs.' : 'Connecte-toi avec un compte admin pour creer une plantation.', 'error');
    if (!CURRENT_USER) setTimeout(() => { location.href = 'login.html'; }, 900);
    return;
  }
  document.getElementById('modal').style.display = 'flex';
}
function closeModal() { document.getElementById('modal').style.display = 'none'; }
document.getElementById('modal').addEventListener('click', e => { if(e.target===e.currentTarget) closeModal(); });

async function createPlantation() {
  if (!canCreatePlantation()) {
    const errEl = document.getElementById('m-err');
    errEl.textContent = CURRENT_USER ? 'Creation reservee aux administrateurs.' : 'Connexion admin requise.';
    errEl.style.display = 'block';
    return;
  }
  const name   = document.getElementById('m-name').value.trim();
  const owner  = document.getElementById('m-owner').value.trim();
  const country= document.getElementById('m-country').value;
  const region = document.getElementById('m-region').value.trim();
  const lat    = parseFloat(document.getElementById('m-lat').value);
  const lng    = parseFloat(document.getElementById('m-lng').value);
  const ha     = parseFloat(document.getElementById('m-ha').value);
  const errEl  = document.getElementById('m-err');
  errEl.style.display = 'none';

  if (!name || !owner) { errEl.textContent = 'Nom et propriétaire sont requis.'; errEl.style.display='block'; return; }

  const btn = document.getElementById('m-btn');
  btn.disabled=true; btn.textContent='Création…';

  try {
    const res = await authFetch('/plantations', {
      method:'POST',
      body: JSON.stringify({ name, owner_name:owner, country, region:region||null,
        latitude:isNaN(lat)?null:lat, longitude:isNaN(lng)?null:lng, hectares:isNaN(ha)?null:ha })
    });
    if (!res?.ok) { const e = await res?.json().catch(()=>({})); throw new Error(e.detail||'Erreur (rôle admin requis).'); }
    closeModal();
    ['m-name','m-owner','m-region','m-lat','m-lng','m-ha'].forEach(id => document.getElementById(id).value='');
    toast('Plantation créée avec succès.');
    await load();
  } catch(e) {
    errEl.textContent = e.message; errEl.style.display='block';
  } finally { btn.disabled=false; btn.textContent='Créer'; }
}

function grabGPS() {
  const btn = document.getElementById('geo-btn');
  const txt = document.getElementById('geo-txt');
  const err = document.getElementById('geo-err');
  err.style.display = 'none';

  if (!navigator.geolocation) {
    err.textContent = 'Géolocalisation non supportée par ce navigateur.';
    err.style.display = 'block'; return;
  }

  btn.disabled = true;
  txt.textContent = 'Localisation en cours…';

  navigator.geolocation.getCurrentPosition(
    pos => {
      document.getElementById('m-lat').value = pos.coords.latitude.toFixed(6);
      document.getElementById('m-lng').value = pos.coords.longitude.toFixed(6);
      txt.textContent = '✓ Position capturée';
      btn.disabled = false;
      setTimeout(() => { txt.textContent = 'Utiliser ma position GPS'; }, 2500);
    },
    e => {
      const msgs = {
        1: 'Permission refusée — autorisez la localisation dans votre navigateur.',
        2: 'Position indisponible — vérifiez le GPS de votre appareil.',
        3: 'Délai dépassé — réessayez en extérieur.'
      };
      err.textContent = msgs[e.code] || 'Localisation GPS impossible — autorisez la position.';
      err.style.display = 'block';
      txt.textContent = 'Utiliser ma position GPS';
      btn.disabled = false;
    },
    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
  );
}

initAssignmentFilter();
initCertFilter();
initCreateButton();
load();
</script>
