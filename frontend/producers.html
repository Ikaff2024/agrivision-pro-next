<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1a4231">
  <title>AgriVision Pro — Producteurs</title>
  <script src="config.js?v=staging1"></script>
    <!-- Polices de marque : préchargées tôt (évite le flash de typographie au chargement) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" data-avp-fonts href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,700&family=DM+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block">
<script src="auth.js?v=producers1"></script>
  <style>
    .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--sh);padding:18px}
    .kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:16px}
    .kpi{border:1px solid var(--border);border-radius:8px;background:var(--surface-warm);padding:12px}
    .kpi strong{display:block;font-family:'Fraunces',serif;font-size:24px;line-height:1}
    .kpi span{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;font-weight:800;margin-top:6px}
    .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
    .search{flex:1;min-width:220px;padding:10px 14px;border:1.5px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit;outline:none}
    .search:focus{border-color:var(--accent)}
    table{width:100%;border-collapse:collapse;font-size:13px}
    th{background:var(--surface-warm);text-align:left;padding:9px 10px;font-size:11px;text-transform:uppercase;color:var(--muted);letter-spacing:.04em;border-bottom:2px solid var(--border)}
    td{padding:10px;border-bottom:1px solid var(--border-l,#f0ead8)}
    tr:hover td{background:var(--bg)}
    .code{font-weight:700;color:var(--text)}
    .muted{color:var(--muted)}
    .empty{text-align:center;padding:40px;color:var(--muted)}
    .lnk{color:var(--primary,#15803d);font-weight:700;text-decoration:none}
  </style>
</head>
<body>
<div class="avp-layout">
  <nav id="sidebar"></nav>
  <div class="avp-main">
    <div class="avp-header">
      <div>
        <div class="page-title">Producteurs</div>
        <div class="page-sub">Annuaire des producteurs de la coopérative</div>
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-primary" onclick="openNewProducer()"><span class="material-symbols-outlined" style="font-size:18px">person_add</span> Nouveau producteur</button>
        <button class="btn btn-outline" onclick="load()"><span class="material-symbols-outlined" style="font-size:18px">refresh</span> Actualiser</button>
      </div>
    </div>

    <div class="avp-content">
      <div class="kpis">
        <div class="kpi"><strong id="k-total">0</strong><span>Producteurs</span></div>
        <div class="kpi"><strong id="k-shown">0</strong><span>Affichés</span></div>
        <div class="kpi"><strong id="k-localites">0</strong><span>Localités</span></div>
      </div>

      <div class="panel">
        <div class="toolbar">
          <input class="search" id="search" placeholder="Rechercher par nom, code ou téléphone…" oninput="onSearch()">
          <select class="search" id="cert-filter" onchange="onCertChange()" style="flex:0 0 auto;min-width:180px;max-width:230px;display:none" title="Filtrer par certification"></select>
          <span class="muted" id="hint" style="font-size:12.5px"></span>
        </div>
        <div style="overflow:auto">
          <table>
            <thead>
              <tr><th>Code</th><th>Nom et prénoms</th><th>Localité</th><th>Section</th><th>Téléphone</th><th></th></tr>
            </thead>
            <tbody id="tbody">
              <tr><td colspan="6" class="empty">Chargement…</td></tr>
            </tbody>
          </table>
        </div>
        <div id="pager" style="display:none;align-items:center;justify-content:space-between;gap:12px;padding:12px 4px 2px;border-top:1px solid var(--border);margin-top:8px">
          <span class="muted" id="pager-info" style="font-size:12.5px"></span>
          <div style="display:flex;gap:8px">
            <button class="btn btn-outline btn-sm" id="pager-prev" onclick="goPage(-1)">← Précédent</button>
            <button class="btn btn-outline btn-sm" id="pager-next" onclick="goPage(1)">Suivant →</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Modal: Nouveau producteur -->
<div class="modal-overlay" id="modal-prod">
  <div class="modal">
    <div class="modal-title">Nouveau producteur</div>
    <div class="form-group"><label class="form-label">Nom et prénoms *</label><input class="form-input" id="p-nom" placeholder="Kouassi Konan"></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div class="form-group"><label class="form-label">Code interne (coopérative)</label><input class="form-input" id="p-code" placeholder="COOP-1234"></div>
      <div class="form-group"><label class="form-label">Téléphone</label><input class="form-input" id="p-tel" placeholder="07 00 00 00 00"></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div class="form-group"><label class="form-label">Localité</label><input class="form-input" id="p-localite" placeholder="Village"></div>
      <div class="form-group"><label class="form-label">Section</label><input class="form-input" id="p-section" placeholder="Section"></div>
    </div>
    <div class="form-group"><label class="form-label">Sexe</label><select class="form-input" id="p-sexe"><option value="">—</option><option value="H">Homme</option><option value="F">Femme</option></select></div>
    <div id="p-err" style="color:var(--high);font-size:13px;margin-top:8px;display:none"></div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeNewProducer()">Annuler</button>
      <button class="btn btn-primary" id="p-btn" onclick="createProducer()">Créer</button>
    </div>
  </div>
</div>

<script>
initApp('producers');
let _all = [];
let _searchTimer = null;
let certFilter = '';
let _page = 0;            // page courante (0-based)
let _total = 0;          // total filtré (pour le pager)
const PAGE_SIZE = 50;    // on n'affiche jamais 7000 lignes d'un coup → pagination serveur

function esc(s){ const d=document.createElement('div'); d.textContent = (s==null?'':String(s)); return d.innerHTML; }

function _filterParams() {
  const params = new URLSearchParams();
  const q = document.getElementById('search').value.trim();
  if (q) params.set('search', q);
  if (certFilter) params.set('certification', certFilter);
  return params;
}

async function load(resetPage) {
  if (resetPage) _page = 0;
  const tb = document.getElementById('tbody');
  tb.innerHTML = '<tr><td colspan="6" class="empty">Chargement…</td></tr>';

  // Total filtré (pour le pager) — mêmes filtres que la liste
  try {
    const rc = await authFetch('/producers/count?' + _filterParams().toString());
    _total = rc?.ok ? ((await rc.json()).total || 0) : 0;
  } catch { _total = 0; }

  // Page courante uniquement (limit + skip) → jamais 7000 lignes rendues
  const params = _filterParams();
  params.set('limit', String(PAGE_SIZE));
  params.set('skip', String(_page * PAGE_SIZE));
  let rows = [];
  try {
    const r = await authFetch('/producers?' + params.toString());
    rows = r?.ok ? await r.json() : [];
  } catch { rows = []; }
  _all = rows;
  render(rows);

  document.getElementById('k-total').textContent = _total.toLocaleString('fr-FR');
  document.getElementById('k-shown').textContent = rows.length;
  document.getElementById('k-localites').textContent = new Set(rows.map(p => p.localite).filter(Boolean)).size;
  renderPager(rows.length);
}

function renderPager(pageCount) {
  const pager = document.getElementById('pager');
  if (!pager) return;
  const pages = Math.max(1, Math.ceil(_total / PAGE_SIZE));
  if (_total <= PAGE_SIZE) { pager.style.display = 'none'; return; }
  pager.style.display = 'flex';
  const from = _total ? _page * PAGE_SIZE + 1 : 0;
  const to = _page * PAGE_SIZE + pageCount;
  document.getElementById('pager-info').textContent =
    `${from.toLocaleString('fr-FR')}–${to.toLocaleString('fr-FR')} sur ${_total.toLocaleString('fr-FR')} · page ${_page + 1}/${pages}`;
  document.getElementById('pager-prev').disabled = _page <= 0;
  document.getElementById('pager-next').disabled = _page >= pages - 1;
}

function goPage(delta) {
  const pages = Math.max(1, Math.ceil(_total / PAGE_SIZE));
  const next = Math.min(Math.max(0, _page + delta), pages - 1);
  if (next === _page) return;
  _page = next;
  load(false);
}

function render(rows) {
  const tb = document.getElementById('tbody');
  if (!rows.length) {
    tb.innerHTML = '<tr><td colspan="6" class="empty">Aucun producteur. Importez un registre ou créez une plantation.</td></tr>';
    return;
  }
  tb.innerHTML = rows.map(p => `
    <tr>
      <td class="code">${esc(p.code_yeyasso || '—')}</td>
      <td>${esc(p.nom_complet || '—')}</td>
      <td>${esc(p.localite || '—')}</td>
      <td>${esc(p.section || '—')}</td>
      <td class="muted">${esc(p.telephone || '—')}</td>
      <td><a class="lnk" href="producer_profile.html?id=${p.id}">Profil →</a></td>
    </tr>`).join('');
  document.getElementById('k-shown').textContent = rows.length;
}

function onSearch() {
  clearTimeout(_searchTimer);
  _searchTimer = setTimeout(() => load(true), 300);  // nouvelle recherche → page 0
}

function onCertChange() {
  certFilter = document.getElementById('cert-filter').value || '';
  load(true);  // nouveau filtre → page 0
}

// Peuple le filtre avec les certifications réellement présentes dans la coopérative.
function initCertFilter() {
  const sel = document.getElementById('cert-filter');
  if (!sel) return;
  authFetch('/plantations/filters-options')
    .then(r => r?.ok ? r.json() : null)
    .then(opts => {
      const certs = (opts && opts.certifications) || [];
      if (!certs.length) { sel.style.display = 'none'; return; }
      sel.innerHTML = '<option value="">Toutes certifications</option>' +
        certs.map(c => `<option value="${c}">${c}</option>`).join('');
      sel.style.display = '';
    })
    .catch(() => {});
}

/* ── Création directe d'un producteur ─────────────────────────── */
function openNewProducer() {
  document.getElementById('p-err').style.display = 'none';
  ['p-nom', 'p-code', 'p-tel', 'p-localite', 'p-section'].forEach(id => { document.getElementById(id).value = ''; });
  document.getElementById('p-sexe').value = '';
  document.getElementById('modal-prod').style.display = 'flex';
}
function closeNewProducer() { document.getElementById('modal-prod').style.display = 'none'; }
document.getElementById('modal-prod').addEventListener('click', e => { if (e.target === e.currentTarget) closeNewProducer(); });

async function createProducer() {
  const err = document.getElementById('p-err'); err.style.display = 'none';
  const nom = document.getElementById('p-nom').value.trim();
  if (nom.length < 2) { err.textContent = 'Le nom et prénoms est obligatoire.'; err.style.display = 'block'; return; }
  const btn = document.getElementById('p-btn'); btn.disabled = true; btn.textContent = 'Création…';
  try {
    const r = await authFetch('/producers', { method: 'POST', body: JSON.stringify({
      nom_complet: nom,
      code_yeyasso: document.getElementById('p-code').value.trim() || null,
      telephone: document.getElementById('p-tel').value.trim() || null,
      localite: document.getElementById('p-localite').value.trim() || null,
      section: document.getElementById('p-section').value.trim() || null,
      sexe: document.getElementById('p-sexe').value || null,
    }) });
    const body = await r.json().catch(() => ({}));
    if (!r || !r.ok) throw new Error(body.detail || 'Création impossible.');
    closeNewProducer();
    toast('Producteur créé.');
    load(false);
  } catch (e) { err.textContent = e.message; err.style.display = 'block'; }
  finally { btn.disabled = false; btn.textContent = 'Créer'; }
}

initCertFilter();
load();
</script>
</body>
</html>
