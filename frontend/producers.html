<!DOCTYPE html>
<html lang="fr">
<head>
  <!-- Coquille CRITIQUE render-blocking : peint un shell STYLÉ (barre latérale
       sombre + fond crème + layout) dès l'analyse du HTML, SANS attendre auth.js.
       Sans ça, toute la page "disparaît" le temps qu'auth.js injecte ses styles à
       chaque navigation. auth.js réinjecte ensuite le jeu complet (valeurs alignées). -->
  <style id="avp-anti-flash">
    html{background:#f8f4ee}
    @view-transition{navigation:auto}
    .avp-layout{display:flex;min-height:100vh}
    #sidebar{width:240px;background:#0c2018;flex-shrink:0;position:sticky;top:0;height:100vh;overflow-y:auto}
    .avp-main{flex:1;min-width:0;height:100vh;overflow-y:auto;background:#f8f4ee}
    @media(max-width:768px){.avp-layout{display:block}#sidebar{width:100%;height:auto;position:static}.avp-main{height:auto}}
  </style>
  <link rel="stylesheet" href="/fonts/avp-fonts.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1a4231">
  <title>AgriVision Pro — Producteurs</title>
  <script src="config.js?v=staging1"></script>
    <!-- Polices de marque : préchargées tôt (évite le flash de typographie au chargement) -->
<script src="auth.js?v=producers1"></script>
  <style>
    .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--sh);padding:18px}
    .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
    .kpi{border:1px solid var(--border);border-radius:8px;background:var(--surface-warm);padding:12px}
    .kpi strong{display:block;font-family:'Fraunces',serif;font-size:24px;line-height:1}
    .kpi span{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;font-weight:800;margin-top:6px}
    .kpi .note{display:block;font-size:10.5px;font-weight:700;margin-top:4px}
    .kpi.ok{border-color:#bbf7d0;background:#f0fdf4}
    .kpi.ok strong,.kpi.ok .note{color:#166534}
    .kpi.over{border-color:#fecaca;background:#fef2f2}
    .kpi.over strong,.kpi.over .note{color:#b91c1c}
    .cat-sel{padding:4px 7px;border:1.5px solid var(--border);border-radius:6px;font-size:12px;font-family:inherit;font-weight:700;cursor:pointer;outline:none}
    .cat-sel.membre{color:#166534;background:#dcfce7;border-color:#bbf7d0}
    .cat-sel.non_membre{color:#9a3412;background:#ffedd5;border-color:#fed7aa}
    .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
    .search{flex:1;min-width:220px;padding:10px 14px;border:1.5px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit;outline:none}
    .search:focus{border-color:var(--accent)}
    table{width:100%;border-collapse:collapse;font-size:13px}
    th{background:var(--surface-warm);text-align:left;padding:9px 10px;font-size:11px;text-transform:uppercase;color:var(--muted);letter-spacing:.04em;border-bottom:2px solid var(--border)}
    td{padding:10px;border-bottom:1px solid var(--border-l,#f0ead8)}
    tr:hover td{background:var(--bg)}
    .code{font-weight:700;color:var(--text)}
    .muted{color:var(--muted)}
    .empty{text-align:center;padding:40px;color:var(--muted)}
    .lnk{color:var(--primary,#15803d);font-weight:700;text-decoration:none}
  </style>
</head>
<body>
<div class="avp-layout">
  <nav id="sidebar"></nav>
  <div class="avp-main">
    <div class="avp-header">
      <div>
        <div class="page-title">Producteurs</div>
        <div class="page-sub">Annuaire des producteurs de la coopérative</div>
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-primary" onclick="openNewProducer()"><span class="material-symbols-outlined" style="font-size:18px">person_add</span> Nouveau producteur</button>
        <button class="btn btn-outline" id="bulk-btn" style="display:none" onclick="openBulkClassify()" title="Reclasser en masse les producteurs correspondant au filtre actuel"><span class="material-symbols-outlined" style="font-size:18px">category</span> Classer en masse</button>
        <button class="btn btn-outline" id="export-btn" onclick="exportProducersCsv()" title="Exporter en CSV (Excel) — tous les producteurs filtrés"><span class="material-symbols-outlined" style="font-size:18px">download</span> Export CSV</button>
        <button class="btn btn-outline" onclick="load()"><span class="material-symbols-outlined" style="font-size:18px">refresh</span> Actualiser</button>
      </div>
    </div>

    <div class="avp-content">
      <div class="kpis">
        <div class="kpi"><strong id="k-total">0</strong><span>Producteurs</span></div>
        <div class="kpi"><strong id="k-shown">0</strong><span>Affichés</span></div>
        <div class="kpi"><strong id="k-localites">0</strong><span>Localités</span></div>
        <div class="kpi" id="k-achats-card"><strong id="k-achats">—</strong><span>Part achats (non-membres)</span><span class="note" id="k-achats-note">Seuil OHADA ≤ 20 %</span></div>
      </div>

      <div class="panel">
        <div class="toolbar">
          <input class="search" id="search" placeholder="Rechercher par nom, code ou téléphone…" oninput="onSearch()">
          <select class="search" id="cert-filter" onchange="onCertChange()" style="flex:0 0 auto;min-width:180px;max-width:230px;display:none" title="Filtrer par certification"></select>
          <select class="search" id="cat-filter" onchange="onCatChange()" style="flex:0 0 auto;min-width:170px;max-width:220px" title="Filtrer par catégorie">
            <option value="">Toutes catégories</option>
            <option value="membre">Membres (récolte)</option>
            <option value="non_membre">Non-membres (achat)</option>
          </select>
          <span id="col-wrap" style="position:relative;flex:0 0 auto">
            <button class="btn btn-outline btn-sm" onclick="toggleColMenu(event)" title="Choisir les colonnes affichées"><span class="material-symbols-outlined" style="font-size:16px;vertical-align:middle">view_column</span> Colonnes</button>
            <div id="col-menu" style="display:none;position:absolute;right:0;top:112%;z-index:50;background:var(--surface);border:1px solid var(--border);border-radius:8px;box-shadow:var(--sh);padding:8px;min-width:210px"></div>
          </span>
          <span class="muted" id="hint" style="font-size:12.5px"></span>
        </div>
        <div style="overflow:auto">
          <table>
            <thead id="thead"></thead>
            <tbody id="tbody">
              <tr><td colspan="7" class="empty">Chargement…</td></tr>
            </tbody>
          </table>
        </div>
        <div id="pager" style="display:none;align-items:center;justify-content:space-between;gap:12px;padding:12px 4px 2px;border-top:1px solid var(--border);margin-top:8px">
          <span class="muted" id="pager-info" style="font-size:12.5px"></span>
          <div style="display:flex;gap:8px">
            <button class="btn btn-outline btn-sm" id="pager-prev" onclick="goPage(-1)">← Précédent</button>
            <button class="btn btn-outline btn-sm" id="pager-next" onclick="goPage(1)">Suivant →</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Modal: Nouveau producteur -->
<div class="modal-overlay" id="modal-prod">
  <div class="modal">
    <div class="modal-title" id="p-modal-title">Nouveau producteur</div>
    <div class="form-group"><label class="form-label">Nom et prénoms *</label><input class="form-input" id="p-nom" placeholder="Kouassi Konan"></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div class="form-group"><label class="form-label">Code interne (coopérative)</label><input class="form-input" id="p-code" placeholder="COOP-1234"></div>
      <div class="form-group"><label class="form-label">Téléphone</label><input class="form-input" id="p-tel" placeholder="07 00 00 00 00"></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div class="form-group"><label class="form-label">Localité</label><input class="form-input" id="p-localite" placeholder="Village"></div>
      <div class="form-group"><label class="form-label">Section</label><input class="form-input" id="p-section" placeholder="Section"></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div class="form-group"><label class="form-label">Sexe</label><select class="form-input" id="p-sexe"><option value="">—</option><option value="H">Homme</option><option value="F">Femme</option></select></div>
      <div class="form-group"><label class="form-label">Catégorie *</label><select class="form-input" id="p-type"><option value="" disabled selected>— Choisir la catégorie —</option><option value="membre">Membre (récolte)</option><option value="non_membre">Non-membre (achat)</option></select></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div class="form-group"><label class="form-label">N° pièce d'identité</label><input class="form-input" id="p-piece-num" placeholder="Numéro de la pièce"></div>
      <div class="form-group"><label class="form-label">Nature de la pièce</label><select class="form-input" id="p-piece-nat"><option value="">—</option><option>CNI</option><option>Passeport</option><option>Carte consulaire</option><option>Attestation</option><option>Autre</option></select></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px">
      <div class="form-group"><label class="form-label">Code exportateur</label><input class="form-input" id="p-code-exp" placeholder="Réf. exportateur"></div>
      <div class="form-group"><label class="form-label">Récépissé</label><input class="form-input" id="p-recepisse" placeholder="Récépissé"></div>
      <div class="form-group"><label class="form-label">Formateur interne</label><input class="form-input" id="p-formateur" placeholder="Nom du formateur"></div>
    </div>
    <div id="p-err" style="color:var(--high);font-size:13px;margin-top:8px;display:none"></div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeNewProducer()">Annuler</button>
      <button class="btn btn-primary" id="p-btn" onclick="submitProducer()">Créer</button>
    </div>
  </div>
</div>

<!-- Modal: reclassement en masse -->
<div class="modal-overlay" id="modal-bulk">
  <div class="modal">
    <div class="modal-title">Classer en masse</div>
    <div id="bulk-scope" style="font-size:13px;color:var(--muted);margin-bottom:14px;line-height:1.5">…</div>
    <div class="form-group">
      <label class="form-label">Nouvelle catégorie à appliquer</label>
      <select class="form-input" id="bulk-target">
        <option value="non_membre">Non-membre (achat)</option>
        <option value="membre">Membre (récolte)</option>
      </select>
    </div>
    <label style="display:flex;gap:8px;align-items:center;font-size:13px;margin-top:4px;cursor:pointer">
      <input type="checkbox" id="bulk-only-default" checked>
      Ne toucher que les producteurs restés dans l'<b>autre</b> catégorie (ne réécrit pas ceux déjà classés)
    </label>
    <div id="bulk-err" style="color:var(--high);font-size:13px;margin-top:10px;display:none"></div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeBulk()">Annuler</button>
      <button class="btn btn-primary" id="bulk-apply" onclick="applyBulkClassify()">Appliquer</button>
    </div>
  </div>
</div>

<script>
initApp('producers');
let _all = [];
let _searchTimer = null;
let certFilter = '';
let catFilter = '';
let _page = 0;            // page courante (0-based)
let _total = 0;          // total filtré (pour le pager)
const PAGE_SIZE = 50;    // on n'affiche jamais 7000 lignes d'un coup → pagination serveur

function esc(s){ const d=document.createElement('div'); d.textContent = (s==null?'':String(s)); return d.innerHTML; }

// ── Colonnes configurables (affichage à la carte, persisté localement) ──────
const COLUMNS = [
  { key:'code_yeyasso', label:'Code', always:true, cls:'code', val:p=>esc(p.code_yeyasso||'—') },
  { key:'nom_complet', label:'Nom et prénoms', always:true, val:p=>esc(p.nom_complet||'—') },
  { key:'localite', label:'Localité', def:true, val:p=>esc(p.localite||'—') },
  { key:'section', label:'Section', def:true, val:p=>esc(p.section||'—') },
  { key:'telephone', label:'Téléphone', def:true, cls:'muted', val:p=>esc(p.telephone||'—') },
  { key:'type_producteur', label:'Catégorie', def:true, val:p=>catSelect(p) },
  { key:'sexe', label:'Sexe', val:p=> p.sexe==='H'?'Homme':(p.sexe==='F'?'Femme':'—') },
  { key:'code_saco', label:'Code exportateur', val:p=>esc(p.code_exportateur||p.code_saco||'—') },
  { key:'recepisse', label:'Récépissé', val:p=>esc(p.recepisse||'—') },
  { key:'piece', label:"Pièce d'identité", val:p=> p.piece_identite_numero ? esc(((p.piece_identite_nature||'')+' '+p.piece_identite_numero).trim()) : '—' },
  { key:'date_naissance', label:'Naissance', val:p=> p.date_naissance ? esc(new Date(p.date_naissance).toLocaleDateString('fr-FR')) : '—' },
  { key:'formateur_interne_nom', label:'Formateur', val:p=>esc(p.formateur_interne_nom||'—') },
  { key:'gps', label:'GPS', val:p=> (p.latitude!=null && p.longitude!=null) ? esc(Number(p.latitude).toFixed(4)+', '+Number(p.longitude).toFixed(4)) : '—' },
];
const COL_LS = 'avp_prod_cols';
function selectedOptional(){
  try { const s = JSON.parse(localStorage.getItem(COL_LS) || 'null'); if (Array.isArray(s)) return new Set(s); } catch (e) {}
  return new Set(COLUMNS.filter(c=>c.def).map(c=>c.key));   // défaut : localité, section, téléphone
}
function visibleCols(){ const sel = selectedOptional(); return COLUMNS.filter(c => c.always || sel.has(c.key)); }
function setCol(key, on){
  const sel = selectedOptional();
  if (on) sel.add(key); else sel.delete(key);
  localStorage.setItem(COL_LS, JSON.stringify([...sel]));
  renderHeader(); render(_all); renderColMenu();
}
function renderHeader(){
  const th = document.getElementById('thead'); if (!th) return;
  th.innerHTML = '<tr>' + visibleCols().map(c=>`<th>${esc(c.label)}</th>`).join('') + '<th></th></tr>';
}
function renderColMenu(){
  const menu = document.getElementById('col-menu'); if (!menu) return;
  const sel = selectedOptional();
  menu.innerHTML = COLUMNS.filter(c=>!c.always).map(c=>`
    <label style="display:flex;gap:8px;align-items:center;padding:5px 4px;font-size:13px;cursor:pointer">
      <input type="checkbox" ${sel.has(c.key)?'checked':''} onchange="setCol('${c.key}', this.checked)"> ${esc(c.label)}
    </label>`).join('');
}
function toggleColMenu(e){ if (e) e.stopPropagation(); const m=document.getElementById('col-menu'); if (m) m.style.display = (m.style.display==='block') ? 'none' : 'block'; }
document.addEventListener('click', e => {
  const m = document.getElementById('col-menu');
  if (m && m.style.display==='block' && !e.target.closest('#col-wrap')) m.style.display='none';
});

function _filterParams() {
  const params = new URLSearchParams();
  const q = document.getElementById('search').value.trim();
  if (q) params.set('search', q);
  if (certFilter) params.set('certification', certFilter);
  if (catFilter) params.set('type_producteur', catFilter);
  return params;
}

async function load(resetPage) {
  if (resetPage) _page = 0;
  const tb = document.getElementById('tbody');
  tb.innerHTML = `<tr><td colspan="${visibleCols().length + 1}" class="empty">Chargement…</td></tr>`;

  // Total filtré (pour le pager) — mêmes filtres que la liste
  try {
    const rc = await authFetch('/producers/count?' + _filterParams().toString());
    _total = rc?.ok ? ((await rc.json()).total || 0) : 0;
  } catch { _total = 0; }

  // Page courante uniquement (limit + skip) → jamais 7000 lignes rendues
  const params = _filterParams();
  params.set('limit', String(PAGE_SIZE));
  params.set('skip', String(_page * PAGE_SIZE));
  let rows = [];
  try {
    const r = await authFetch('/producers?' + params.toString());
    rows = r?.ok ? await r.json() : [];
  } catch { rows = []; }
  _all = rows;
  render(rows);

  document.getElementById('k-total').textContent = _total.toLocaleString('fr-FR');
  document.getElementById('k-shown').textContent = rows.length;
  document.getElementById('k-localites').textContent = new Set(rows.map(p => p.localite).filter(Boolean)).size;
  renderPager(rows.length);
  loadMembershipStats();
}

// ── Catégorie membre / non-membre + KPI part achats (OHADA) ──────────────────
function catSelect(p){
  const cur = p.type_producteur || 'membre';
  const o=(v,l)=>`<option value="${v}"${v===cur?' selected':''}>${l}</option>`;
  return `<select class="cat-sel ${cur}" title="Catégorie du producteur" onclick="event.stopPropagation()" onchange="reclassifyProducer(${p.id}, this)">${o('membre','Membre')}${o('non_membre','Non-membre')}</select>`;
}

async function reclassifyProducer(id, sel){
  const value = sel.value;
  sel.disabled = true;
  try {
    const r = await authFetch('/producers/' + id + '/type', { method:'PATCH', body: JSON.stringify({ type_producteur: value }) });
    if (!r || !r.ok) {
      toast(r && r.status === 403 ? 'Reclassement réservé aux gestionnaires.' : 'Échec de la mise à jour.', 'error');
      return;
    }
    const p = _all.find(x => x.id === id); if (p) p.type_producteur = value;
    sel.className = 'cat-sel ' + value;
    if (typeof toast === 'function') toast('Catégorie mise à jour.');
    if (catFilter && catFilter !== value) { load(false); } else { loadMembershipStats(); }
  } catch (e) {
    toast('Serveur inaccessible. Réessayez.', 'error');
  } finally { sel.disabled = false; }
}

function onCatChange(){ catFilter = document.getElementById('cat-filter').value || ''; load(true); }

async function loadMembershipStats(){
  const card = document.getElementById('k-achats-card');
  const val = document.getElementById('k-achats');
  const note = document.getElementById('k-achats-note');
  if (!card) return;
  let s = null;
  try { const r = await authFetch('/producers/stats/membership'); s = r?.ok ? await r.json() : null; } catch { s = null; }
  card.classList.remove('ok', 'over');
  if (!s) { val.textContent = '—'; note.textContent = 'Seuil OHADA ≤ 20 %'; return; }
  val.textContent = (s.part_achats_pct ?? 0).toFixed(1).replace('.', ',') + ' %';
  const over = !s.ohada_compliant;
  card.classList.add(over ? 'over' : 'ok');
  note.textContent = over ? '⚠ Dépasse le seuil OHADA (20 %)' : 'OHADA ≤ 20 % — conforme';
  card.title = 'Achats (non-membres) : ' + Math.round(s.volume_non_membres_kg) + ' kg\nStock total collecté : ' + Math.round(s.volume_total_kg) + ' kg';
}

async function exportProducersCsv() {
  // Exporte TOUS les producteurs correspondant au filtre courant (pas seulement
  // la page affichée). Données déjà cloisonnées par coopérative côté serveur.
  const btn = document.getElementById('export-btn');
  if (btn) { btn.disabled = true; }
  try {
    const params = _filterParams();
    params.set('limit', String(Math.max(_total, PAGE_SIZE) || 10000));
    params.set('skip', '0');
    let rows = [];
    try {
      const r = await authFetch('/producers?' + params.toString());
      rows = r?.ok ? await r.json() : [];
    } catch { rows = []; }
    avpExportCsv(rows, `Producteurs_${new Date().toISOString().slice(0,10)}`, [
      { key: 'code_yeyasso', label: 'Code' },
      { key: 'nom_complet', label: 'Nom et prénoms' },
      { label: 'Sexe', value: p => p.sexe==='H'?'Homme':(p.sexe==='F'?'Femme':'') },
      { key: 'localite', label: 'Localité' },
      { key: 'section', label: 'Section' },
      { key: 'telephone', label: 'Téléphone' },
      { label: 'Catégorie', value: p => p.type_producteur==='non_membre'?'Non-membre':'Membre' },
      { label: 'Code exportateur', value: p => p.code_exportateur || p.code_saco || '' },
      { key: 'recepisse', label: 'Récépissé' },
      { key: 'piece_identite_nature', label: "Nature pièce" },
      { key: 'piece_identite_numero', label: "N° pièce" },
      { key: 'date_naissance', label: 'Naissance' },
      { key: 'formateur_interne_nom', label: 'Formateur' },
      { key: 'latitude', label: 'Latitude' },
      { key: 'longitude', label: 'Longitude' },
    ]);
  } finally {
    if (btn) { btn.disabled = false; }
  }
}

function renderPager(pageCount) {
  const pager = document.getElementById('pager');
  if (!pager) return;
  const pages = Math.max(1, Math.ceil(_total / PAGE_SIZE));
  if (_total <= PAGE_SIZE) { pager.style.display = 'none'; return; }
  pager.style.display = 'flex';
  const from = _total ? _page * PAGE_SIZE + 1 : 0;
  const to = _page * PAGE_SIZE + pageCount;
  document.getElementById('pager-info').textContent =
    `${from.toLocaleString('fr-FR')}–${to.toLocaleString('fr-FR')} sur ${_total.toLocaleString('fr-FR')} · page ${_page + 1}/${pages}`;
  document.getElementById('pager-prev').disabled = _page <= 0;
  document.getElementById('pager-next').disabled = _page >= pages - 1;
}

function goPage(delta) {
  const pages = Math.max(1, Math.ceil(_total / PAGE_SIZE));
  const next = Math.min(Math.max(0, _page + delta), pages - 1);
  if (next === _page) return;
  _page = next;
  load(false);
}

function render(rows) {
  const tb = document.getElementById('tbody');
  const cols = visibleCols();
  const span = cols.length + 1;
  if (!rows || !rows.length) {
    tb.innerHTML = `<tr><td colspan="${span}" class="empty">Aucun producteur. Importez un registre ou créez une plantation.</td></tr>`;
    return;
  }
  tb.innerHTML = rows.map(p => '<tr>' +
    cols.map(c => `<td${c.cls ? ` class="${c.cls}"` : ''}>${c.val(p)}</td>`).join('') +
    `<td style="white-space:nowrap">
       <a class="lnk" href="#" onclick="openEditProducer(${p.id});return false" title="Modifier les informations">Éditer</a>
       <span class="muted"> · </span>
       <a class="lnk" href="producer_profile.html?id=${p.id}">Profil →</a>
     </td></tr>`).join('');
  document.getElementById('k-shown').textContent = rows.length;
}

function onSearch() {
  clearTimeout(_searchTimer);
  _searchTimer = setTimeout(() => load(true), 300);  // nouvelle recherche → page 0
}

function onCertChange() {
  certFilter = document.getElementById('cert-filter').value || '';
  load(true);  // nouveau filtre → page 0
}

// Peuple le filtre avec les certifications réellement présentes dans la coopérative.
function initCertFilter() {
  const sel = document.getElementById('cert-filter');
  if (!sel) return;
  authFetch('/plantations/filters-options')
    .then(r => r?.ok ? r.json() : null)
    .then(opts => {
      const certs = (opts && opts.certifications) || [];
      if (!certs.length) { sel.style.display = 'none'; return; }
      sel.innerHTML = '<option value="">Toutes certifications</option>' +
        certs.map(c => `<option value="${c}">${c}</option>`).join('');
      sel.style.display = '';
    })
    .catch(() => {});
}

/* ── Création / édition d'un producteur (modale duale) ──────────── */
let _editId = null;

function _fillProducerModal(p) {
  document.getElementById('p-nom').value = (p && p.nom_complet) || '';
  document.getElementById('p-code').value = (p && p.code_yeyasso) || '';
  document.getElementById('p-tel').value = (p && p.telephone) || '';
  document.getElementById('p-localite').value = (p && p.localite) || '';
  document.getElementById('p-section').value = (p && p.section) || '';
  document.getElementById('p-sexe').value = (p && p.sexe) || '';
  document.getElementById('p-type').value = (p && p.type_producteur) || '';
  document.getElementById('p-piece-num').value = (p && p.piece_identite_numero) || '';
  document.getElementById('p-piece-nat').value = (p && p.piece_identite_nature) || '';
  document.getElementById('p-code-exp').value = (p && (p.code_exportateur || p.code_saco)) || '';
  document.getElementById('p-recepisse').value = (p && p.recepisse) || '';
  document.getElementById('p-formateur').value = (p && p.formateur_interne_nom) || '';
}

function openNewProducer() {
  _editId = null;
  document.getElementById('p-err').style.display = 'none';
  _fillProducerModal(null);
  document.getElementById('p-modal-title').textContent = 'Nouveau producteur';
  document.getElementById('p-btn').textContent = 'Créer';
  document.getElementById('modal-prod').style.display = 'flex';
}

function openEditProducer(id) {
  const p = _all.find(x => x.id === id);
  if (!p) return;
  _editId = id;
  document.getElementById('p-err').style.display = 'none';
  _fillProducerModal(p);
  document.getElementById('p-modal-title').textContent = 'Modifier le producteur';
  document.getElementById('p-btn').textContent = 'Enregistrer';
  document.getElementById('modal-prod').style.display = 'flex';
}

function closeNewProducer() { document.getElementById('modal-prod').style.display = 'none'; }
document.getElementById('modal-prod').addEventListener('click', e => { if (e.target === e.currentTarget) closeNewProducer(); });

async function submitProducer() {
  const err = document.getElementById('p-err'); err.style.display = 'none';
  const nom = document.getElementById('p-nom').value.trim();
  if (nom.length < 2) { err.textContent = 'Le nom et prénoms est obligatoire.'; err.style.display = 'block'; return; }
  const type = document.getElementById('p-type').value;
  if (!type) { err.textContent = 'Choisissez la catégorie : Membre (récolte) ou Non-membre (achat).'; err.style.display = 'block'; return; }
  const payload = {
    nom_complet: nom,
    type_producteur: type,   // OBLIGATOIRE des la creation
    code_yeyasso: document.getElementById('p-code').value.trim() || null,
    telephone: document.getElementById('p-tel').value.trim() || null,
    localite: document.getElementById('p-localite').value.trim() || null,
    section: document.getElementById('p-section').value.trim() || null,
    sexe: document.getElementById('p-sexe').value || null,
  };
  // Champs additionnels : pertinents surtout à l'édition (PUT). ProducerCreate
  // ignore les clés inconnues, donc sans effet à la création.
  if (_editId) {
    payload.piece_identite_numero = document.getElementById('p-piece-num').value.trim() || null;
    payload.piece_identite_nature = document.getElementById('p-piece-nat').value || null;
    payload.code_exportateur = document.getElementById('p-code-exp').value.trim() || null;
    payload.recepisse = document.getElementById('p-recepisse').value.trim() || null;
    payload.formateur_interne_nom = document.getElementById('p-formateur').value.trim() || null;
  }
  const btn = document.getElementById('p-btn'); btn.disabled = true; btn.textContent = '…';
  try {
    const r = await authFetch(_editId ? `/producers/${_editId}` : '/producers',
      { method: _editId ? 'PUT' : 'POST', body: JSON.stringify(payload) });
    const body = await r.json().catch(() => ({}));
    if (!r || !r.ok) throw new Error(body.detail || 'Enregistrement impossible.');
    closeNewProducer();
    toast(_editId ? 'Producteur mis à jour.' : 'Producteur créé.');
    load(false);
  } catch (e) { err.textContent = e.message; err.style.display = 'block'; }
  finally { btn.disabled = false; btn.textContent = _editId ? 'Enregistrer' : 'Créer'; }
}

/* ── Reclassement en masse (admin / gestionnaire) ─────────────────────────── */
(function initBulkBtn(){
  try {
    const u = (typeof getCurrentUser === 'function') ? getCurrentUser() : null;
    if (u && (u.role === 'admin' || u.role === 'gestionnaire')) {
      const b = document.getElementById('bulk-btn'); if (b) b.style.display = '';
    }
  } catch (e) {}
})();

function _bulkFromType(){
  const target = document.getElementById('bulk-target').value;
  const opposite = target === 'membre' ? 'non_membre' : 'membre';
  return document.getElementById('bulk-only-default').checked ? opposite : '';
}
async function _updateBulkPreview(){
  const target = document.getElementById('bulk-target').value;
  const fromType = _bulkFromType();
  const scope = document.getElementById('bulk-scope');
  const params = new URLSearchParams();
  const q = document.getElementById('search').value.trim();
  if (q) params.set('search', q);
  if (certFilter) params.set('certification', certFilter);
  if (fromType) params.set('type_producteur', fromType);
  let n = '…';
  try { const r = await authFetch('/producers/count?' + params.toString()); if (r?.ok) n = (await r.json()).total; } catch (e) {}
  const lbl = target === 'membre' ? 'Membre (récolte)' : 'Non-membre (achat)';
  const filtre = q ? ` correspondant à « ${esc(q)} »` : (certFilter ? ` certifiés ${esc(certFilter)}` : '');
  scope.innerHTML = `<b>${n}</b> producteur(s)${filtre}` +
    (fromType ? ` actuellement « ${fromType === 'membre' ? 'Membre' : 'Non-membre'} »` : '') +
    ` seront classés en <b>${lbl}</b>.`;
}
function openBulkClassify(){
  document.getElementById('bulk-err').style.display = 'none';
  document.getElementById('bulk-target').value = 'non_membre';
  document.getElementById('bulk-only-default').checked = true;
  document.getElementById('modal-bulk').style.display = 'flex';
  _updateBulkPreview();
}
function closeBulk(){ document.getElementById('modal-bulk').style.display = 'none'; }
document.getElementById('modal-bulk').addEventListener('click', e => { if (e.target === e.currentTarget) closeBulk(); });
document.getElementById('bulk-target').addEventListener('change', _updateBulkPreview);
document.getElementById('bulk-only-default').addEventListener('change', _updateBulkPreview);

async function applyBulkClassify(){
  const err = document.getElementById('bulk-err'); err.style.display = 'none';
  const target = document.getElementById('bulk-target').value;
  const fromType = _bulkFromType();
  const q = document.getElementById('search').value.trim();
  const body = { type_producteur: target };
  if (fromType) body.from_type = fromType;
  if (q) body.search = q;
  if (certFilter) body.certification = certFilter;
  const ok = await avpConfirm('Confirmer le reclassement en masse ? Cette action modifie plusieurs producteurs à la fois.', { okText: 'Reclasser', danger: true });
  if (!ok) return;
  const btn = document.getElementById('bulk-apply'); btn.disabled = true; btn.textContent = '…';
  try {
    const r = await authFetch('/producers/bulk-type', { method: 'POST', body: JSON.stringify(body) });
    const d = await r.json().catch(() => ({}));
    if (!r || !r.ok) throw new Error(d.detail || 'Reclassement impossible.');
    closeBulk();
    toast(`${d.updated} producteur(s) reclassé(s).`);
    load(true); loadMembershipStats();
  } catch (e) { err.textContent = e.message; err.style.display = 'block'; }
  finally { btn.disabled = false; btn.textContent = 'Appliquer'; }
}

renderHeader();
renderColMenu();
initCertFilter();
load();
</script>
