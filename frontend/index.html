<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1a4231">
<title>AgriVision Pro — Dashboard</title>
<script src="auth.js"></script>
<style>
.stats-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(195px,1fr));gap:16px;margin-bottom:28px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  padding:22px 20px;box-shadow:var(--sh);position:relative;overflow:hidden}
.stat-val{font-family:'Fraunces',serif;font-size:38px;font-weight:700;line-height:1}
.stat-lbl{font-size:11.5px;color:var(--muted);font-weight:500;margin-top:6px;
  text-transform:uppercase;letter-spacing:.05em}
.stat-icon{position:absolute;right:16px;top:16px;font-size:26px;opacity:.12}
.stat-sub{font-size:12px;color:var(--faint);margin-top:10px}

.content-grid{display:grid;grid-template-columns:1fr 320px;gap:20px}
@media(max-width:1100px){.content-grid{grid-template-columns:1fr}}

.risk-bars{display:flex;flex-direction:column;gap:14px;margin-top:8px}
.risk-row{display:flex;align-items:center;gap:12px}
.risk-name{font-size:13px;font-weight:500;width:60px;flex-shrink:0}
.risk-bar-bg{flex:1;height:8px;background:var(--border-l);border-radius:99px;overflow:hidden}
.risk-bar-fill{height:100%;border-radius:99px;transition:.6s}
.risk-count{font-size:13px;font-weight:600;width:28px;text-align:right;flex-shrink:0}

.recent-diag{display:flex;flex-direction:column;gap:0}
.diag-item{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--border-l)}
.diag-item:last-child{border-bottom:none}
.diag-icon{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;font-size:16px}
.diag-name{font-size:13.5px;font-weight:500}
.diag-meta{font-size:12px;color:var(--muted);margin-top:2px}
.diag-score{font-family:'Fraunces',serif;font-size:18px;font-weight:700;margin-left:auto;flex-shrink:0}

.quick-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qa-btn{border:1px solid var(--border);background:var(--surface);border-radius:var(--r);
  padding:14px 16px;cursor:pointer;transition:.15s;text-align:left;
  font-family:'DM Sans',sans-serif;display:flex;align-items:center;gap:10px}
.qa-btn:hover{background:var(--surface-warm);border-color:var(--accent)}
.qa-icon{width:34px;height:34px;border-radius:8px;background:var(--bg);display:flex;
  align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.qa-label{font-size:13px;font-weight:600;color:var(--text)}
.qa-sub{font-size:11.5px;color:var(--muted);margin-top:1px}

.modal-overlay{position:fixed;inset:0;background:rgba(12,32,24,.55);
  display:flex;align-items:center;justify-content:center;z-index:900;padding:20px;display:none}
.modal{background:var(--surface);border-radius:var(--rl);padding:28px;
  width:100%;max-width:500px;box-shadow:var(--sh-md);animation:modalIn .2s ease}
@keyframes modalIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.modal-title{font-family:'Fraunces',serif;font-size:20px;font-weight:700;margin-bottom:20px}
.form-row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal-footer{display:flex;justify-content:flex-end;gap:10px;margin-top:22px;
  padding-top:16px;border-top:1px solid var(--border)}
</style>
</head>
<body>
<div class="avp-layout">
  <nav id="sidebar"></nav>
  <div class="avp-main">

    <div class="avp-header">
      <div>
        <div class="page-title">Dashboard</div>
        <div class="page-sub" id="coop-name">Chargement…</div>
      </div>
      <button class="btn btn-primary" onclick="openModal()">
        <span class="material-symbols-outlined" style="font-size:18px">add</span>
        Nouvelle plantation
      </button>
    </div>

    <div class="avp-content">

      <!-- Stats -->
      <div class="stats-row">
        <div class="stat-card">
          <div class="stat-icon">🌱</div>
          <div class="stat-val" id="s-total">—</div>
          <div class="stat-lbl">Plantations</div>
          <div class="stat-sub">dans votre coopérative</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon" style="color:var(--low)">✓</div>
          <div class="stat-val" id="s-low" style="color:var(--low)">—</div>
          <div class="stat-lbl">Risque faible</div>
          <div class="stat-sub">état optimal</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon" style="color:var(--med)">⚠</div>
          <div class="stat-val" id="s-med" style="color:var(--med)">—</div>
          <div class="stat-lbl">Risque moyen</div>
          <div class="stat-sub">à surveiller</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon" style="color:var(--high)">⚡</div>
          <div class="stat-val" id="s-high" style="color:var(--high)">—</div>
          <div class="stat-lbl">Risque élevé</div>
          <div class="stat-sub">intervention requise</div>
        </div>
      </div>

      <div class="content-grid">
        <!-- Left: recent diagnostics -->
        <div>
          <div class="section-title">Diagnostics récents</div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Plantation</th>
                  <th>Région</th>
                  <th>Score</th>
                  <th>Risque</th>
                  <th>Date</th>
                </tr>
              </thead>
              <tbody id="diag-tbody">
                <tr><td colspan="5" style="text-align:center;padding:40px;color:var(--muted)">Chargement…</td></tr>
              </tbody>
            </table>
          </div>
        </div>

        <!-- Right: risk distribution + quick actions -->
        <div style="display:flex;flex-direction:column;gap:20px">
          <div class="card">
            <div class="section-title" style="margin-bottom:12px">Répartition des risques</div>
            <div class="risk-bars" id="risk-bars">
              <div style="color:var(--muted);font-size:13px">Chargement…</div>
            </div>
          </div>

          <div class="card">
            <div class="section-title" style="margin-bottom:12px">Actions rapides</div>
            <div class="quick-actions">
              <button class="qa-btn" onclick="location.href='plantations.html'">
                <div class="qa-icon">🌱</div>
                <div><div class="qa-label">Plantations</div><div class="qa-sub">Gérer la liste</div></div>
              </button>
              <button class="qa-btn" onclick="location.href='diagnostic.html'">
                <div class="qa-icon">🔬</div>
                <div><div class="qa-label">Diagnostic</div><div class="qa-sub">Lancer une analyse</div></div>
              </button>
              <button class="qa-btn" onclick="location.href='map.html'">
                <div class="qa-icon">🗺️</div>
                <div><div class="qa-label">Carte</div><div class="qa-sub">Vue géographique</div></div>
              </button>
              <button class="qa-btn" onclick="location.href='analytics.html'">
                <div class="qa-icon">📊</div>
                <div><div class="qa-label">Analytique</div><div class="qa-sub">Tendances</div></div>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Modal: nouvelle plantation -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-title">Nouvelle plantation</div>
    <div class="form-row2">
      <div class="form-group"><label class="form-label">Nom</label><input class="form-input" id="m-name" placeholder="Plantation Soubré"></div>
      <div class="form-group"><label class="form-label">Propriétaire</label><input class="form-input" id="m-owner" placeholder="Konan Kouassi"></div>
    </div>
    <div class="form-row2">
      <div class="form-group"><label class="form-label">Pays</label>
        <select class="form-input" id="m-country">
          <option>Côte d'Ivoire</option><option>Ghana</option><option>Cameroun</option><option>Nigeria</option>
        </select>
      </div>
      <div class="form-group"><label class="form-label">Région</label><input class="form-input" id="m-region" placeholder="Soubré"></div>
    </div>
    <div class="form-row2">
      <div class="form-group"><label class="form-label">Latitude</label><input class="form-input" id="m-lat" type="number" step="any" placeholder="5.78"></div>
      <div class="form-group"><label class="form-label">Longitude</label><input class="form-input" id="m-lng" type="number" step="any" placeholder="-6.59"></div>
    </div>
    <div class="form-group"><label class="form-label">Superficie (hectares)</label><input class="form-input" id="m-ha" type="number" step="any" placeholder="4.5"></div>
    <div id="m-err" style="color:var(--high);font-size:13px;margin-top:8px;display:none"></div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal()">Annuler</button>
      <button class="btn btn-primary" id="m-btn" onclick="createPlantation()">Créer</button>
    </div>
  </div>
</div>

<script>
initApp('dashboard');

const user = getCurrentUser();
if (user) {
  document.getElementById('coop-name').textContent = `Coopérative · ${user.role}`;
}

async function loadDashboard() {
  // Stats
  try {
    const r = await authFetch('/map/stats');
    if (!r || !r.ok) return;
    const s = await r.json();
    document.getElementById('s-total').textContent = s.total_plantations;
    document.getElementById('s-low').textContent   = s.low_risk_plantations;
    document.getElementById('s-med').textContent   = s.medium_risk_plantations;
    document.getElementById('s-high').textContent  = s.high_risk_plantations;

    const total = s.total_plantations || 1;
    document.getElementById('risk-bars').innerHTML = `
      <div class="risk-row">
        <span class="risk-name" style="color:var(--low)">Faible</span>
        <div class="risk-bar-bg"><div class="risk-bar-fill" style="width:${s.low_risk_plantations/total*100}%;background:var(--low)"></div></div>
        <span class="risk-count" style="color:var(--low)">${s.low_risk_plantations}</span>
      </div>
      <div class="risk-row">
        <span class="risk-name" style="color:var(--med)">Moyen</span>
        <div class="risk-bar-bg"><div class="risk-bar-fill" style="width:${s.medium_risk_plantations/total*100}%;background:var(--med)"></div></div>
        <span class="risk-count" style="color:var(--med)">${s.medium_risk_plantations}</span>
      </div>
      <div class="risk-row">
        <span class="risk-name" style="color:var(--high)">Élevé</span>
        <div class="risk-bar-bg"><div class="risk-bar-fill" style="width:${s.high_risk_plantations/total*100}%;background:var(--high)"></div></div>
        <span class="risk-count" style="color:var(--high)">${s.high_risk_plantations}</span>
      </div>`;
  } catch {}

  // Recent diagnostics
  try {
    const r2 = await authFetch('/diagnostics?limit=8');
    if (!r2 || !r2.ok) return;
    const diags = await r2.json();
    const tb = document.getElementById('diag-tbody');
    if (!diags.length) {
      tb.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:40px;color:var(--muted)">Aucun diagnostic. <a href="diagnostic.html" style="color:var(--primary);font-weight:600">Lancer le premier →</a></td></tr>';
      return;
    }
    tb.innerHTML = diags.map(d => `
      <tr>
        <td style="font-weight:500">${d.plantation_id ? `Plantation #${d.plantation_id}` : '—'}</td>
        <td style="color:var(--muted)">${d.region || d.country || '—'}</td>
        <td>
          <div style="display:flex;align-items:center;gap:8px">
            <div style="width:60px;height:6px;background:var(--border-l);border-radius:99px;overflow:hidden">
              <div style="width:${d.global_score}%;height:100%;background:${scoreColor(d.global_score)};border-radius:99px"></div>
            </div>
            <span style="font-family:'Fraunces',serif;font-weight:600;font-size:13.5px">${Math.round(d.global_score)}</span>
          </div>
        </td>
        <td>${riskBadge(d.global_risk_level)}</td>
        <td style="color:var(--muted)">${fmtDate(d.created_at)}</td>
      </tr>`).join('');
  } catch {}
}

loadDashboard();

function openModal() { document.getElementById('modal').style.display = 'flex'; }
function closeModal() { document.getElementById('modal').style.display = 'none'; }
document.getElementById('modal').addEventListener('click', e => { if (e.target===e.currentTarget) closeModal(); });

async function createPlantation() {
  const name = document.getElementById('m-name').value.trim();
  const owner= document.getElementById('m-owner').value.trim();
  const country = document.getElementById('m-country').value;
  const region  = document.getElementById('m-region').value.trim();
  const lat  = parseFloat(document.getElementById('m-lat').value);
  const lng  = parseFloat(document.getElementById('m-lng').value);
  const ha   = parseFloat(document.getElementById('m-ha').value);
  const errEl= document.getElementById('m-err');
  errEl.style.display='none';

  if (!name || !owner) { errEl.textContent='Nom et propriétaire requis.'; errEl.style.display='block'; return; }

  const btn = document.getElementById('m-btn');
  btn.disabled=true; btn.textContent='Création…';

  try {
    const res = await authFetch('/plantations', {
      method:'POST',
      body: JSON.stringify({ name, owner_name:owner, country, region: region||null,
        latitude: isNaN(lat)?null:lat, longitude: isNaN(lng)?null:lng, hectares: isNaN(ha)?null:ha })
    });
    if (!res || !res.ok) {
      const e = await res?.json().catch(()=>({}));
      throw new Error(e.detail || 'Erreur création (rôle admin requis).');
    }
    closeModal();
    toast('Plantation créée avec succès.');
    loadDashboard();
  } catch(e) {
    errEl.textContent = e.message; errEl.style.display='block';
  } finally { btn.disabled=false; btn.textContent='Créer'; }
}
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js')
      .then(reg => console.log('[PWA] Service Worker enregistré:', reg.scope))
      .catch(err => console.warn('[PWA] Échec enregistrement SW:', err));
  });
}
</script>
</body>
</html>
