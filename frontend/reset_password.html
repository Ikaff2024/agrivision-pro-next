<!DOCTYPE html>
<html lang="fr">
<head>
  <!-- Anti-flash navigation : fond crème dès l'analyse (remplit le gap inter-pages)
       + opt-in View Transitions render-blocking (fondu natif Chromium). Voir auth.js. -->
  <style id="avp-anti-flash">html{background:#f8f4ee}@view-transition{navigation:auto}</style>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgriVision Pro — Réinitialisation du mot de passe</title>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,700&family=DM+Sans:wght@400;500;600&display=swap">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--primary:#1a4231;--sb:#0c2018;--accent:#52b788;--bg:#f8f4ee;--surface:#fff;--border:#e6ddd0;--text:#1a2218;--muted:#6a7d64;--faint:#b0c4b0;--r:10px}
    body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px}
    .auth-box{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:32px;box-shadow:0 8px 30px rgba(12,32,24,.06)}
    .auth-title{font-family:'Fraunces',serif;font-size:25px;font-weight:700;letter-spacing:-.4px;margin-bottom:6px}
    .auth-sub{font-size:13.5px;color:var(--muted);margin-bottom:26px}
    .form-group{margin-bottom:15px}
    .form-label{display:block;font-size:12.5px;font-weight:500;color:var(--muted);margin-bottom:6px}
    .form-input{width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:var(--r);font-size:14.5px;color:var(--text);background:var(--surface);outline:none;font-family:'DM Sans',sans-serif;transition:.15s}
    .form-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(82,183,136,.13)}
    .btn-go{width:100%;padding:12px;border-radius:var(--r);border:none;cursor:pointer;background:var(--primary);color:#fff;font-size:15px;font-weight:600;font-family:'DM Sans',sans-serif;transition:.2s;margin-top:6px}
    .btn-go:hover{background:var(--sb)}
    .btn-go:disabled{opacity:.55;cursor:not-allowed}
    .box{border-radius:var(--r);padding:10px 14px;font-size:13px;margin-bottom:14px;display:none;line-height:1.5}
    .error-box{background:#fdedec;border:1px solid #f1948a;color:#922b21}
    .ok-box{background:#eafaf1;border:1px solid #82d9aa;color:#1e6b43}
    .auth-bottom{text-align:center;margin-top:22px;padding-top:18px;border-top:1px solid var(--border);font-size:13.5px;color:var(--muted)}
    .auth-bottom a{color:var(--primary);font-weight:600}
  </style>
</head>
<body>
  <div class="auth-box">
    <h1 class="auth-title">Nouveau mot de passe</h1>
    <p class="auth-sub">Choisissez un nouveau mot de passe pour votre compte AgriVision Pro.</p>

    <div class="box error-box" id="err"></div>
    <div class="box ok-box" id="ok"></div>

    <div id="form-wrap">
      <div class="form-group">
        <label class="form-label">Nouveau mot de passe</label>
        <input class="form-input" id="pass" type="password" placeholder="••••••••" autocomplete="new-password">
      </div>
      <div class="form-group">
        <label class="form-label">Confirmer le mot de passe</label>
        <input class="form-input" id="pass2" type="password" placeholder="••••••••" autocomplete="new-password">
      </div>
      <button class="btn-go" id="btn" onclick="doReset()">Réinitialiser</button>
    </div>

    <div class="auth-bottom"><a href="login.html">Retour à la connexion</a></div>
  </div>

  <script src="config.js"></script>
  <script>
    const API_BASE = window.AGRIVISION_API_BASE || window.CG_API_BASE || (
      ['localhost', '127.0.0.1'].includes(window.location.hostname)
        ? 'http://127.0.0.1:8010'
        : 'https://agrivision-api-production.up.railway.app'
    );
    const token = new URLSearchParams(location.search).get('token');

    function show(id, msg) {
      const el = document.getElementById(id);
      el.textContent = msg;
      el.style.display = 'block';
    }

    if (!token) {
      document.getElementById('form-wrap').style.display = 'none';
      show('err', "Lien invalide ou incomplet. Refaites une demande depuis la page de connexion.");
    }

    async function doReset() {
      document.getElementById('err').style.display = 'none';
      const p1 = document.getElementById('pass').value;
      const p2 = document.getElementById('pass2').value;
      if (p1.length < 6) { show('err', 'Mot de passe trop court (minimum 6 caractères).'); return; }
      if (p1 !== p2) { show('err', 'Les deux mots de passe ne correspondent pas.'); return; }

      const btn = document.getElementById('btn');
      btn.disabled = true; btn.textContent = 'Réinitialisation…';
      try {
        const res = await fetch(`${API_BASE}/auth/reset-password`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, new_password: p1 })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.detail || 'Réinitialisation impossible.');
        document.getElementById('form-wrap').style.display = 'none';
        show('ok', (data.message || 'Mot de passe réinitialisé.') + ' Redirection…');
        setTimeout(() => { window.location.href = 'login.html'; }, 2200);
      } catch (e) {
        show('err', e.message);
        btn.disabled = false; btn.textContent = 'Réinitialiser';
      }
    }

    document.addEventListener('keydown', (e) => { if (e.key === 'Enter') doReset(); });
  </script>
</body>
</html>
