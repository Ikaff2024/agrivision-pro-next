# nixpacks.toml — Configuration Railway pour AgriVision Pro
# WeasyPrint nécessite des librairies système C (Cairo, Pango, GDK-PixBuf)
# pour le rendu HTML→PDF. Sans ce fichier, l'import de WeasyPrint
# planterait au démarrage avec "OSError: cannot load library 'libcairo-2.dll'".

[phases.setup]
aptPkgs = [
    "libcairo2",
    "libpango-1.0-0",
    "libpangoft2-1.0-0",
    "libgdk-pixbuf-2.0-0",
    "libffi-dev",
    "shared-mime-info",
    "fonts-liberation",
    "fonts-dejavu-core",
]

[phases.install]
cmds = ["pip install -r requirements.txt"]

[start]
cmd = "uvicorn main:app --host 0.0.0.0 --port ${PORT:-8080}"
