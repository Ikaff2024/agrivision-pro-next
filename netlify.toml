[build]
  # On part de la racine du repo et on publie le sous-dossier frontend/.
  # Erreur historique a eviter : "base + publish = frontend + frontend"
  # cherchait "frontend/frontend" qui n'existe pas.
  publish = "frontend"
  ignore  = "exit 0"

[build.environment]
  NODE_VERSION = "20"
  PYTHON_VERSION = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
