[build]
  # IMPORTANT : on force base="" pour ecraser tout reglage UI Netlify
  # heritr d'une creation precedente. Sans ca, si l'UI a "Base = frontend",
  # Netlify cherche "frontend/frontend" et echoue.
  base    = ""
  publish = "frontend"
  # NOTE: ne PAS ajouter "ignore = exit 0" — ca annule TOUS les deploiements.

[build.environment]
  NODE_VERSION = "20"
  # Netlify détecte requirements.txt (à la racine, pour le backend Railway) et lance
  # un `pip install`. Sans version épinglée, il prenait Python 3.14 → shapely n'a pas
  # de wheel pour 3.14 → compilation depuis les sources → échec (geos_c.h introuvable).
  # On épingle 3.12 (wheels shapely/pyshp disponibles → aucune compilation, aucun GEOS).
  # N'affecte QUE Netlify : Railway build via Dockerfile, la CI fixe Python en 3.11.
  PYTHON_VERSION = "3.12"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

# Le service worker ne doit jamais etre mis en cache par le navigateur : sinon
# les mises a jour du SW (et donc des strategies de cache des pages) tardent a
# se propager. no-cache force une revalidation a chaque visite.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
